e?","a":"Computers","topic":"Misc","cat":"Electronics","exp":"The computer industry (including smartphones, tablets, and embedded systems) represents the largest segment of the electronics market."},{"q":"What is trellis coded modulation?","a":"A combined coding and modulation technique using convolutional coding to improve error performance without bandwidth increase","topic":"Networks","cat":"Comms","exp":"Trellis coding adds redundant bits and higher-order modulation to achieve coding gain, enabling higher data rates over noisy channels (used in V.32 and V.34 modems)."},{"q":"If you need an LC circuit to be resonant at 2500 Hz and use a 150 mH coil, what should the capacitance value be?","a":"0.027 μF","topic":"Electronics","cat":"Electronics","exp":""},{"q":"In electromagnetism, what law that determines the polarity of an induced voltage?","a":"Lenz’ law","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What refers to the strong repulsion between the positively charged nuclei which makes fusion reaction difficult to attain?","a":"Coulomb repulsion","topic":"GEAS","cat":"GEAS","exp":""},{"q":"In SSB, the transmitter output is expressed in terms of what?","a":"Peak Envelope Power (PEP)","topic":"RF","cat":"Comms","exp":"PEP is the average power during one RF cycle at the peak of the modulation envelope. For SSB: PEP = 12W typical for J3E. Average power is typically ¼ to ⅓ of PEP during voice transmission."},{"q":"What NTC memorandum circular sets the rules and regulations governing the manufacture, acquisition, sale and service of radio communication equipment?","a":"MC No. 2-05-88","topic":"GEAS","cat":"GEAS","exp":""},{"q":"When can an ac-voltage, v = 120sin120πt reach its first peak?","a":"4.167 ms","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the acceptance angle of an optical fiber?","a":"The maximum angle at which light can enter the fiber and undergo total internal reflection","topic":"Fiber","cat":"Comms","exp":"The acceptance angle (half-angle of the acceptance cone) determines what light enters the fiber. It's related to numerical aperture: NA = sin(acceptance angle)."},{"q":"In the process of radiation, energy is carried by electromagnetic waves. What is the speed of electromagnetic waves?","a":"186,000 miles/second","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the trouble when the color oscillator does not oscillate?","a":"No color","topic":"TV","cat":"Comms","exp":"The 3.58 MHz color subcarrier oscillator is essential for demodulating chrominance signals. No oscillation = no color information decoded."},{"q":"In electromagnetism, what law that determines the amount of induced voltage?","a":"Faraday’s law","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What compression law is used by European telephone systems?","a":"A-law compression","topic":"Telephone","cat":"Electronics","exp":"A-law companding (A=87.6) is specified by ITU-T G.711 for European and international PCM telephony, providing slightly different dynamic range than µ-law."},{"q":"What does it means when the material is said to be “yielding”?","a":"The material has pass through elastic range and enter the plastic range","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the Shannon-Hartley theorem?","a":"There is a theoretical maximum data rate for a channel given its bandwidth and signal-to-noise ratio: C = B·log₂(1 + S/N)","topic":"Networks","cat":"Comms","exp":"Shannon's theorem defines the channel capacity C in bits/second, setting an absolute upper bound on error-free data transmission rate."},{"q":"Which semiconductor is mostly used to detect near infrared?","a":"silicon carbide","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the pilot subcarrier frequency in FM stereo broadcasting?","a":"19 kHz","topic":"RF","cat":"Comms","exp":"The 19 kHz pilot tone signals stereo presence to receivers. It is at half the 38 kHz suppressed subcarrier frequency, making regeneration easy."},{"q":"A coin 20mg is place on the smooth edge of a 25 cm-radius phonograph record as the record is brought up to its normal rational speed of 45 rmp. What must be the coefficient of friction between the coin and the record if the coin is not to slip off?","a":"0.56","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A stone rests in a pail that is moved in a vertical circle of radius 60 cm. What is the least speed the stone must have as it rounds the top of the circle if it is to remain in contact with the pail?","a":"2.4 m/s","topic":"Impulse and Momentum","cat":"Physics","exp":"Schaum's College Physics - Impulse and Momentum"},{"q":"All are AM radio prime time block for provincial stations except one. Which one?","a":"11 AM to 3 PM","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the shape factor of a receiver?","a":"Expresses the steepness of the selectivity skirts","topic":"RF","cat":"Comms","exp":"Shape factor = bandwidth at -60 dB / bandwidth at -6 dB. A perfect filter has shape factor = 1.0. Real filters range from 1.5 to 3+. Lower shape factor = better adjacent channel rejection."},{"q":"What do you call a semiconductor that is doped with both donor and acceptor impurities?","a":"compensated semiconductor","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the range of troposcatter propagation?","a":"350 MHz to 10 GHz","topic":"GPS","cat":"Comms","exp":"Troposcatter uses backscatter from turbulence in the troposphere (up to 15 km altitude). Effective at 350 MHz–10 GHz for beyond-LOS links of 100-300 km. It's not reliable enough for most commercial use."},{"q":"What is CDPD (Cellular Digital Packet Data)?","a":"A digital packet data service over AMPS cellular networks","topic":"Cellular","cat":"Comms","exp":"CDPD overlaid packet data on existing AMPS cellular channels using idle time between calls, providing 19.2 kbps data at 800/900 MHz."},{"q":"What law in electronics where an induced current will be in such a direction that its own magnetic field will oppose the magnetic field that produces the same?","a":"Lenz law","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What modulation technique does CDPD use?","a":"GMSK (Gaussian Minimum Shift Keying)","topic":"Cellular","cat":"Comms","exp":"CDPD uses GMSK modulation at 19.2 kbps, the same modulation as GSM, chosen for its spectrum efficiency and constant envelope properties."},{"q":"What do you call a clipper circuit wherein the diode is shunted with the load?","a":"parallel clipper","topic":"Electronics","cat":"Electronics","exp":""},{"q":"The following are quantities that describe motion and uses Newton’s law of motion and d’Alembert’s principle except one. Which one?","a":"Time","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A ball is thrown at an angle of 32.5o from the horizontal towards a smooth floor. At what angle will it rebound if the coefficient of between the ball and the floor is 0.30?","a":"10.82o","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the output power of a standard Bluetooth device (Class 2)?","a":"1 mW (0 dBm)","topic":"Networks","cat":"Comms","exp":"Class 2 Bluetooth devices transmit at 1 mW (0 dBm), giving a range of about 10 meters, the most common class in consumer electronics."},{"q":"Which of the given circuit below must have a capacitor?","a":"clamper","topic":"Electronics","cat":"Electronics","exp":""},{"q":"How large a force is required to accelerate a 1300-kg car from rest to a speed of 20 m/s in a distance of 80 m?","a":"3.3 kN","topic":"Projectile Motion","cat":"Physics","exp":"Schaum's College Physics - Projectile Motion"},{"q":"What is the PCM system used in North American telephone networks?","a":"Bell T1 (DS1)","topic":"Telephone","cat":"Comms","exp":"Bell T1 (DS1) carries 24 PCM voice channels at 64 kbps each plus framing bits, for a total line rate of 1.544 Mbps."},{"q":"An elevator starts from rest with a constant upward acceleration. It moves 2.0 m in the first 0.60 s. A passenger in the elevator is holding a 3.0-kg package by a vertical string. What is the tension in the string during the accelerating process?","a":"63 N","topic":"Newton's Laws","cat":"Physics","exp":"Schaum's College Physics - Newton's Laws"},{"q":"A 60.0 kg glider pilot traveling in a glider at 40.0 m/s wishes to turn an inside vertical loop such that he exerts a force of 350 N on the seat when the glider is at the top of the loop. What must be the radius of the loop under these conditions? (Hint: Gravity and the seat exert forces on the pilot.)","a":"102 m","topic":"Impulse and Momentum","cat":"Physics","exp":"Schaum's College Physics - Impulse and Momentum"},{"q":"Which regulatory body allocates spectrum space and issues licenses in the USA?","a":"FCC (Federal Communications Commission)","topic":"RF","cat":"Comms","exp":"The FCC regulates all non-federal radio communications in the United States, allocating spectrum, licensing stations, and setting technical standards."},{"q":"What is the noticeable change in loudness level?","a":"6 to 10 dB","topic":"Acoustics","cat":"Comms","exp":"The human ear perceives a 6–10 dB increase as a noticeably louder sound. A 10 dB increase is perceived as roughly twice as loud."},{"q":"What is the AWG 22 customer loop resistance?","a":"170 Ω per km (per conductor)","topic":"Telephone","cat":"Comms","exp":"AWG 22 copper wire has a loop resistance of approximately 170 Ω/km (85 Ω/km per conductor × 2 for the loop), used for medium-length subscriber loops."},{"q":"What is the reverberation time for an auditorium?","a":"1.6 to 1.8 s","topic":"Acoustics","cat":"Comms","exp":"Optimal reverberation time for auditoriums is 1.6–1.8 seconds. Churches have longer reverberation (1.4–3.4 s) for a fuller sound."},{"q":"In a semiconductor material, what will happen to the number of free electrons when the temperature rises?","a":"increases","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What microphones are predominantly used in aviation services?","a":"Dynamic microphones","topic":"Acoustics","cat":"Comms","exp":"Dynamic microphones are rugged, require no phantom power, and handle high SPLs well — ideal for the demanding aviation environment."},{"q":"What is the frequency of middle C?","a":"262 Hz","topic":"Acoustics","cat":"Comms","exp":"Middle C (C4) on a standard piano is approximately 261.63 Hz, commonly rounded to 262 Hz."},{"q":"Determine the displacement vector that must be added to the displacement 25^i ment of 7.0 m pointing in the x-direction?","a":"18^i  16^j m","topic":"Vectors","cat":"Physics","exp":"Schaum's College Physics - Vectors"},{"q":"What is the speed of sound through compressed water (100 kPa) if its volume decreased by 0.005% of its original volume?","a":"1414 m/s","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the ionospheric layer used for nighttime communications?","a":"F layer (F2 at night)","topic":"RF","cat":"Comms","exp":"At night, the F1 and F2 layers merge into a single F layer. The F2 layer persists at night and is the main reflector for HF communications."},{"q":"A 6000-kg truck traveling north at 5.0 m/s collides with a 4000-kg truck moving west at 15 m/s. If the two trucks remain locked together after impact, with what speed and in what direction do they move immediately after the collision?","a":"6.7 m/s at 278 north of west","topic":"Work, Energy, and Power","cat":"Physics","exp":"Schaum's College Physics - Work, Energy, and Power"},{"q":"When base is common to both the input and output sides of the configuration and is usually the terminal closes to, or at ground potential, it is called what?","a":"common-base terminology","topic":"Electronics","cat":"Electronics","exp":""},{"q":"Which of the following set of quantities that describe motion and uses the principle of work and energy?","a":"Force, mass, distance, velocity","topic":"GEAS","cat":"GEAS","exp":""},{"q":"and interference?","a":"Hertz","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the most significant part or stage of a launched satellite?","a":"Initial payload","topic":"Satellite","cat":"Comms","exp":"The initial (primary) payload is the main satellite in a launch. Secondary payloads (smaller satellites) may share the rocket. The initial payload gets the prime orbit slot."},{"q":"What refers to the branch of mathematics which deals with the dimensions of quantities?","a":"Dimensional analysis","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What do you call of the gain of an op-amp if operated in common mode input?","a":"common gain","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the time constant for FM pre-emphasis and de-emphasis networks in North America?","a":"75 microseconds","topic":"RF","cat":"Comms","exp":"North American FM uses a 75 µs time constant for pre-emphasis (boost high frequencies before transmission) and de-emphasis (restore flat response) at the receiver."},{"q":"A long beam of length L has a formula which is 48Ely = w (2x^4 – 5Lx^3 + 3(L^2 )(x^2)); where does the maximum deflection occur?","a":"0.578L","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A player throws a baseball upward with an initial velocity of 30 ft/sec and catches it with a baseball glove. When will the ball strike the glove? Assume the glove is position in the same elevation when the ball left his hand.","a":"1.86 s","topic":"GEAS","cat":"GEAS","exp":""},{"q":"When was 3G first introduced?","a":"2001","topic":"Cellular","cat":"Comms","exp":"3G (UMTS/WCDMA) was commercially launched in 2001. It provides data rates over 2 Mbps for stationary users and 384 kbps for pedestrians."},{"q":"What is IS-136 (D-AMPS)?","a":"Digital AMPS using TDMA - 3 users per 30 kHz channel","topic":"Cellular","cat":"Comms","exp":"IS-136 digitized AMPS using TDMA: 3 users per 30 kHz channel, pi/4-DQPSK modulation at 48.6 kbps, VSELP voice coding at 8 kbps. Competed with GSM and CDMA in the US until AT&T migrated users to GSM in the early 2000s."},{"q":"What is the purpose of neutralization in RF amplifiers?","a":"Elimination of unwanted RF feedback (oscillation prevention)","topic":"RF","cat":"Comms","exp":"Neutralization feeds back a signal equal and opposite to the unwanted internal feedback in an amplifier, preventing oscillation."},{"q":"A parallel LC network with L = 100 mH and C = 25μF will resonate at what frequency?","a":"100 Hz","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A double convex lens has faces of radii 16 and 18 cm. When an object is 20 cm from the lens, a real image is formed 30 cm from the lens. What is the focal length of the lens?","a":"12 cm","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is used to fire a geosynchronous satellite to attain its final circular geostationary orbit?","a":"Apogee kick motor","topic":"Satellite","cat":"Comms","exp":"After launch to a transfer orbit, the apogee kick motor (AKM) fires at apogee to circularize the orbit at 35,786 km — the geostationary altitude."},{"q":"In a diode-capacitor voltage quadrupler, what is the voltage across the third stage capacitor?","a":"2 V max","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is a product detector?","a":"A detector for suppressed-carrier AM signals that multiplies the signal by a locally regenerated carrier","topic":"RF","cat":"Comms","exp":"Product detectors multiply the incoming SSB or DSB-SC signal by a locally generated carrier to recover the modulating audio, essential for suppressed-carrier demodulation."},{"q":"If an element has an atomic number of 12, there are how many protons and electrons?","a":"12 protons and 12 electrons","topic":"Electronics","cat":"Electronics","exp":""},{"q":"The block in Fig. 4-10(c) just begins to slide up the incline when the pushing force shown is increased to 70 N. (a) What is the critical static friction force on it? (b) What is the value of the coecient of static friction?","a":"(a) 15 N; (b) 0.17","topic":"Equilibrium","cat":"Physics","exp":"Schaum's College Physics - Equilibrium"},{"q":"What states that if two bodies are in thermal equilibrium with a third body, they are also in equilibrium with each other?","a":"Zeroth law of thermodynamics","topic":"GEAS","cat":"GEAS","exp":""},{"q":"In what direction is the magnetic field about a conductor when current is flowing?","a":"In a direction determined by the left-hand rule.","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What body manages the global electromagnetic spectrum?","a":"ITU (International Telecommunication Union)","topic":"RF","cat":"Comms","exp":"The ITU, a United Nations agency, coordinates global use of the radio-frequency spectrum through the Radio Regulations treaty."},{"q":"Which type of FET has the lowest input resistance?","a":"JFET","topic":"Electronics","cat":"Electronics","exp":""},{"q":"How many pins does the RS-232C interface have?","a":"25 pins","topic":"Networks","cat":"Comms","exp":"RS-232C uses a 25-pin connector (DB-25) for serial communication between DTE and DCE equipment."},{"q":"A light emitting diode (LED) is to be used in a circuit with a supply voltage of 5 V. What should be the value of the resistor needed by the LED to operate normally?","a":"250 Ω","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the aeronautical distress frequency?","a":"121.5 MHz","topic":"Antennas","cat":"Comms","exp":"121.5 MHz is the international aeronautical emergency frequency (Guard channel). Aircraft ELTs (Emergency Locator Transmitters) transmit here. 406 MHz is now the primary ELT frequency."},{"q":"As electronic circuit operates, its operating temperature changes which causes device parameters to change. In op-amps, what do you call the change in input offset voltage due to the change in temperature?","a":"input offset voltage drift","topic":"Electronics","cat":"Electronics","exp":""},{"q":"The µA741 op-amp has a CMRR of 90dB and a differential-mode voltage amplification of 200,000.What is the op-amp’s common-mode voltage gain?","a":"6.324","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the Fresnel zone clearance rule for microwave links?","a":"Maximum 40% obstruction of first Fresnel zone","topic":"Antennas","cat":"Comms","exp":"For microwave LOS links, the first Fresnel zone must be at least 60% clear (max 40% obstructed) to avoid significant diffraction loss. Less clearance requires link margin or taller towers. The 0.6 factor is applied in path design."},{"q":"A 6-Ω resistor is connected in series with a capacitive reactance of 8 Ω. If the supply voltage is 200 V, what is the apparent power of the circuit?","a":"4000 W","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What results when luminance components interfere in the color signal, occurring whenever there is diagonal detail?","a":"Cross luminance","topic":"TV","cat":"Comms","exp":"Cross luminance appears as crawling dot patterns on high-contrast diagonal edges. It's caused by high-frequency luminance being mistaken for chroma."},{"q":"What protocol is used for packet switching networks (CCITT)?","a":"X.75","topic":"Networks","cat":"Comms","exp":"X.75 is the CCITT standard for internetworking between packet-switched networks (the gateway protocol between X.25 networks)."},{"q":"What antenna system uses a half-wave dipole, a reflector, and one or more directors?","a":"Yagi-Uda antenna","topic":"Antennas","cat":"Comms","exp":"The Yagi-Uda is the most common directional antenna, using a driven dipole, a reflector behind it, and directors in front for gain."},{"q":"Where is sporadic-E ionization most prevalent?","a":"The equatorial region","topic":"RF","cat":"Comms","exp":"Sporadic-E (Es) is irregular ionization in the E layer most frequently observed near the equator, enabling unusual long-distance HF and VHF propagation."},{"q":"What refers to a telephone that rings another phone without dialing?","a":"Hot line","topic":"Telephone","cat":"Comms","exp":"A hotline (or hot line) connects directly to a specific number without dialing — picking up the handset automatically calls the pre-programmed destination. Used for security, emergency lines."},{"q":"What phenomenon occurs when a microwave beam passes at a grazing angle over an obstacle?","a":"Diffraction","topic":"RF","cat":"Comms","exp":"Diffraction allows radio waves to bend around obstacles, especially significant when the beam grazes the top of a terrain obstruction."},{"q":"What is the aspect ratio of HDTV?","a":"16:9","topic":"TV","cat":"Comms","exp":"HDTV uses a widescreen 16:9 aspect ratio compared to the traditional 4:3 ratio of standard definition TV, closer to the human field of view."},{"q":"What do you call the total number of magnetic lines of force in a magnetic field?","a":"magnetic flux","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the FM luminance frequency used in VCR recording?","a":"3.5 MHz","topic":"TV","cat":"Comms","exp":"In VCR systems, the luminance (Y) signal is frequency-modulated onto a carrier around 3.5–4 MHz before recording to overcome tape's limited dynamic range."},{"q":"What is the cost of building a base station?","a":"$500,000 to $750,000","topic":"Cellular","cat":"Comms","exp":"A cellular base station (BTS) costs $500K–$750K to build and install, including tower, equipment, and backhaul. This is why spectrum and site sharing became important."},{"q":"What is the standard test tone power in telecommunications?","a":"1 mW (0 dBm)","topic":"Telephone","cat":"Comms","exp":"The standard test tone power is 1 milliwatt (0 dBm) at 1000 Hz, used as a reference level in telephony."},{"q":"What is the on-hook loop voltage in a telephone?","a":"-48 Vdc","topic":"Telephone","cat":"Comms","exp":"The central office supplies -48 VDC (negative to prevent electrolytic corrosion) to the local loop when the phone is on-hook. Current flows (20-120 mA) when off-hook."},{"q":"What is Hard Line coaxial cable?","a":"Rigid coax with solid outer conductor for low transmission loss","topic":"Antennas","cat":"Comms","exp":"Hard line (Heliax) uses a corrugated or smooth solid aluminum outer conductor. Loss is 3-10x lower than flexible braided coax. Used in broadcast antenna feeders and cellular base station jumper cables where minimum loss is critical."},{"q":"A ship is traveling due east at 10 km/h. What must be the speed of a second ship heading 308 east of north if it is always due north of the first ship?","a":"20 km/h","topic":"Vectors","cat":"Physics","exp":"Schaum's College Physics - Vectors"},{"q":"Among the given amplifiers below, which is the most efficient?","a":"class A (transformer-coupled)","topic":"Electronics","cat":"Electronics","exp":""},{"q":"Among the given elements, which is considered as nonmetal?","a":"silicon (Si)","topic":"Electronics","cat":"Electronics","exp":""},{"q":"If the current-gain-bandwidth product of transistor is 250 MHz and is operated at 100 MHz, what is the effective current gain of the transistor?","a":"2.5","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A 2nC point charge will produce what potential at 2m away?","a":"9.0 Volts","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the supervisory audio tone (SAT) in AMPS cellular?","a":"A continuous sine wave above voice frequency sent on the voice channel to detect loss of signal","topic":"Cellular","cat":"Comms","exp":"The SAT tone (5970, 6000, or 6030 Hz) is transmitted by the base station along with voice; loss of the SAT causes the system to recognize a dropped call."},{"q":"What elements possess four valence electrons?","a":"Semiconductors","topic":"Electronics","cat":"Electronics","exp":""},{"q":"The Earth's radius is about 6370 km. An object that has a mass of 20 kg is taken to a height of 160 km above the Earth's surface. (a) What is the object's mass at this height? (b) How much does the object weigh (i.e., how large a gravitational force does it experience) at this height?","a":"(a) 20 kg; (b) 0.19 kN","topic":"Newton's Laws","cat":"Physics","exp":"Schaum's College Physics - Newton's Laws"},{"q":"What is the luminance formula for NTSC color television?","a":"Y = 0.30R + 0.59G + 0.11B (30% red, 59% green, 11% blue)","topic":"TV","cat":"Board Exam","exp":"The NTSC luminance equation weights colors according to the eye's sensitivity: most sensitive to green, then red, then blue. This allows B&W TVs to show proper brightness from color signals."},{"q":"Which material has more free electrons?","a":"Conductor","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the accuracy of standard GPS?","a":"2 nautical miles (standard positioning service)","topic":"GPS","cat":"Comms","exp":"Standard GPS (SPS) provides approximately 100m horizontal accuracy; '2 nautical miles' refers to older estimates before selective availability was removed."},{"q":"The temperature coefficient of resistance of a certain wire is known to be 0.004/°C at zero degrees Celsius. What would be the temperature coefficient at room temperature?","a":"0.00360/°C","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the threshold of pain for acoustic shock?","a":"120 dB","topic":"Acoustics","cat":"Comms","exp":"At 120 dB, the sound intensity is physically painful to the human ear. Exposure at this level should not exceed 20 minutes per day."},{"q":"What is a superframe in T1?","a":"A group of 12 T1 frames used for signaling and synchronization","topic":"Telephone","cat":"Electronics","exp":"The D4 superframe groups 12 frames together, using specific framing bit patterns to indicate synchronization and to carry robbed-bit signaling."},{"q":"What refers to an undertaking the object of which is to transmit audio, video, text, images or other signals or messages for reception of a broad audience in a geographical area via wired or wireless means?","a":"Broadcasting","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A 4.0-kg object is lifted 1.5 m. (a) How much work is done against the Earth's gravity? (b) Repeat if the object is lowered instead of lifted.","a":"(a) 59 J; (b) 59 J","topic":"Projectile Motion","cat":"Physics","exp":"Schaum's College Physics - Projectile Motion"},{"q":"What is the Seebeck Effect?","a":"A temperature difference between two dissimilar metals generates a voltage (thermocouple principle)","topic":"Misc","cat":"Comms","exp":"Discovered by Thomas Seebeck, this thermoelectric effect is the basis for thermocouples — devices that convert temperature differences into measurable voltages."},{"q":"What is the time a synthesizer remains at a frequency called?","a":"Dwell time","topic":"RF","cat":"Comms","exp":"Dwell time is how long a frequency-hopping radio stays on each frequency before jumping to the next. Longer dwell time = more data per hop but easier to intercept. Typical FH systems use 10-100 ms dwell times."},{"q":"What is the X-band frequency range for radar?","a":"8–12 GHz (approximately)","topic":"RF","cat":"Comms","exp":"X-band (8–12 GHz) is widely used for weather radar, marine radar, police speed guns, and some satellite communications."},{"q":"What type of microphone is the ribbon microphone?","a":"Pressure-gradient (velocity) microphone","topic":"Acoustics","cat":"Comms","exp":"A ribbon microphone responds to the pressure difference (gradient) between its two faces, giving it a figure-8 polar pattern."},{"q":"The screw of a certain press has a pitch of 0.20 cm. The diameter of the wheel to which a tangential turning force F is applied is 55 cm. If the eciency is 40 percent, how large must F be to produce a force of 12 kN in the press?","a":"35 N","topic":"Circular Motion","cat":"Physics","exp":"Schaum's College Physics - Circular Motion"},{"q":"What is a process in which the system remains infinitesimally closed to an equilibrium state at all times?","a":"Quasi-state or quasi- equilibrium process","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A class A amplifier has an efficiency of only 25%, but this can be increased if the output is coupled with a transformer. Up to how much is its efficiency will reach due to coupling?","a":"50%","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is a Passive Optical Network (PON)?","a":"All-fiber access system for residential applications","topic":"Fiber","cat":"Comms","exp":"PON delivers fiber-to-the-home (FTTH) without active electronics in the distribution network. A single fiber feeds a passive optical splitter serving up to 32 subscribers, reducing cost significantly."},{"q":"What is Dolby AC-3?","a":"Dolby Digital — the surround sound audio coding standard (used in DVD and HDTV)","topic":"TV","cat":"Comms","exp":"Dolby AC-3 (Dolby Digital) is a perceptual audio codec supporting 5.1 surround sound, used in DVDs, Blu-ray, and digital television broadcasting."},{"q":"What is the standard IF Video Carrier for a cable TV system?","a":"45.75 MHz","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A 6-Ω resistor is connected in series with a capacitive reactance of 8 Ω. If the supply voltage is 200 V, what is the circuit current magnitude?","a":"20 A","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the data rate of fiber optics?","a":"10 Gbps","topic":"Fiber","cat":"Comms","exp":"Single-mode fiber can carry 10 Gbps per channel. With DWDM (Dense Wavelength Division Multiplexing), total capacity can reach terabits per second."},{"q":"What phenomenon in electronics does an avalanche breakdown primarily dependent?","a":"Ionization","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is a bridge rectifier having diodes in two arms and resistors in the other two?","a":"half-bridge","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is IMPATT diode used for?","a":"Microwave oscillator/amplifier operating at ~30 GHz and above","topic":"RF","cat":"Electronics","exp":"IMPATT (Impact Ionization Avalanche Transit Time) diodes generate microwave power through avalanche breakdown, used in millimeter-wave radar and communications."},{"q":"What is the impedance at the open end of a half-wave transmission line?","a":"2500 ohms","topic":"RF","cat":"Comms","exp":"At the open end of a resonant half-wave line, impedance reaches a maximum (voltage antinode, current node), typically around 2500 ohms for practical lines."},{"q":"What type of polarization does a helical antenna produce?","a":"Circular polarization","topic":"Antennas","cat":"Comms","exp":"Helical antennas radiate circularly polarized waves, making them popular for satellite communication where orientation may vary."},{"q":"What is the data rate of V.90 modem?","a":"56 kbps downstream / 33.6 kbps upstream","topic":"Networks","cat":"Comms","exp":"V.90 provides 56 kbps downloads by exploiting the digital nature of telephone networks; upstream is limited to 33.6 kbps analog."},{"q":"A guitar string 30 cm long resonates in its fundamental to a frequency of 250 Hz. What is the tension in the string if 80 cm of the string “weighs” 0.80 grams?","a":"40 N","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What type of camera tube is yellow-green most sensitive to?","a":"Camera pickup tube","topic":"TV","cat":"Comms","exp":"Camera pickup tubes (including vidicons and plumbicons) have peak sensitivity to yellow-green light (~550 nm), matching the eye's photopic peak sensitivity."},{"q":"What generates local oscillator frequencies using a PLL?","a":"Frequency synthesizer","topic":"RF","cat":"Comms","exp":"A frequency synthesizer uses a PLL with a programmable divider to generate precise frequencies from a reference crystal oscillator. The output frequency = N × reference frequency, where N is the divider value."},{"q":"What refers to the transfer of energy between a solid surface and the adjacent fluid that is in motion?","a":"Convection","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is a magnetic field?","a":"A force set up when current flows through a conductor.","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the most common cause of internal noise in electronic equipment?","a":"Thermal agitation (Johnson-Nyquist noise)","topic":"RF","cat":"Electronics","exp":"Thermal noise is caused by random motion of electrons due to heat in resistive components. It's present in all conductors at temperatures above absolute zero."},{"q":"What is B8E emission designation?","a":"Independent sideband (ISB) emission","topic":"RF","cat":"Comms","exp":"B8E is the ITU emission designation for independent sideband, where each sideband carries different information."},{"q":"What is a Beverage (wave) antenna?","a":"Long-wire antenna 2+ wavelengths with far-end resistive termination","topic":"Antennas","cat":"Comms","exp":"A Beverage antenna is a horizontal wire 2+ wavelengths long, terminated in its characteristic impedance. Highly directional toward the terminated end. Used for LF/MF/HF receiving and submarine trailing wire communication systems."},{"q":"What is the efficiency of a series-fed class A amplifier?","a":"25%","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A wave has pressure amplitude of 5 dynes/cm^2 and a velocity of 35.7 m/s, what is the absolute intensity considering that 0.001293gm/cm?","a":"2.71 x 10^-8 W/cm^2","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the output voltage across a load resistor if it is paralleled with a forward biased silicon diode? The resistor network is supplied with 10 V.","a":"0.7 V","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is a Gimmick capacitor?","a":"Short hookup wire providing small adjustable capacitance tuned by bending","topic":"Antennas","cat":"Comms","exp":"A gimmick is a few centimeters of insulated hookup wire near a circuit node providing 1-10 pF capacitance. Bending it changes the coupling. Used in RF circuit fine-tuning alignment as an inexpensive substitute for a trimmer capacitor."},{"q":"Which OSI layer handles the transmission of bits over a communications channel?","a":"Physical layer (Layer 1)","topic":"Networks","cat":"Board Exam","exp":"The Physical layer defines electrical, optical, and mechanical specifications for transmitting raw bits: voltage levels, connectors, timing, and bit rates."},{"q":"What FM demodulator requires limiter stages before it?","a":"Foster-Seeley discriminator","topic":"RF","cat":"Comms","exp":"The Foster-Seeley (phase) discriminator is sensitive to amplitude variations, so it requires limiting stages before it. The ratio detector improves on this by providing inherent AM rejection."},{"q":"When was radio first demonstrated as a practical communication medium?","a":"1887 (Hertz demonstrated radio waves)","topic":"Misc","cat":"Comms","exp":"Heinrich Hertz proved the existence of electromagnetic waves in 1887; Marconi made practical wireless telegraphy demonstrations in 1895."},{"q":"What frequency band is used by DME and VOR navigation systems?","a":"108 to 118 MHz","topic":"GPS","cat":"Comms","exp":"VOR (Very High Frequency Omnidirectional Range) operates in the 108-117.95 MHz band; DME operates in the 962-1213 MHz band but the navigation band overlaps at 108-118 MHz."},{"q":"Which law vested the jurisdiction, control and regulation over the Philippine communicateons satellite corporation with the National Telecommunications Commission?","a":"E. O. 196","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the most widely used fiber optic cable type?","a":"Single-mode step-index fiber","topic":"Fiber","cat":"Comms","exp":"Single-mode step-index fiber dominates long-distance telecommunications due to its very low dispersion and attenuation at 1310 nm and 1550 nm."},{"q":"What displacement at 708 has an x-component of 450 m? What is its y-component? 1.2 km 1.29 What displacement must be added to a 50 cm displacement in the x-direction to give a resultant displacement of 85 cm at 258?","a":"45 cm at 538","topic":"Vectors","cat":"Physics","exp":"Schaum's College Physics - Vectors"},{"q":"A 2.5 in. diameter shaft is 2 ft. long. Its maximum shear stress is 10,000 psi. What is the angular deflection in degrees?","a":"0.96o","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is D-AMPS modulation technique?","a":"pi/4-DQPSK","topic":"Cellular","cat":"Comms","exp":"D-AMPS uses pi/4-DQPSK (pi/4 Differential Quadrature Phase Shift Keying) carrying 2 bits per symbol at 24.3 k symbols/second giving 48.6 kbps. The pi/4 phase offset prevents 180-degree transitions that would saturate power amplifiers."},{"q":"What is a line code?","a":"A system for translating binary data into voltage or current levels for transmission over a physical medium","topic":"Networks","cat":"Electronics","exp":"Line codes (NRZ, RZ, Manchester, AMI, etc.) define how 1s and 0s are represented electrically, optimizing for bandwidth, synchronization, and DC balance."},{"q":"Which law provides for a national policy on the operation and use of international satellite communications in the country?","a":"E. O. 467","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the charge of an electron?","a":"1.6022 x 10-19 C","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What does 19CP4 designate?","a":"A CRT with a 19-inch diagonal screen","topic":"TV","cat":"Comms","exp":"CRT designations include the diagonal screen size in inches followed by the phosphor type code, so 19CP4 is a 19-inch tube."},{"q":"What is Z-wave?","a":"Proprietary wireless protocol for home automation - rival to ZigBee","topic":"Networks","cat":"Comms","exp":"Z-Wave operates at 908 MHz in the US using mesh networking for home automation. Its lower frequency than ZigBee gives better wall penetration. Originally proprietary (Sigma Designs), now open standard ITU-T G.9959."},{"q":"What is a subcarrier oscillator (VCO)?","a":"A VCO whose frequency is varied in proportion to the amplitude of a modulating signal","topic":"RF","cat":"Comms","exp":"In FM multiplex systems, subcarrier oscillators generate carriers at fixed frequencies (e.g., 38 kHz stereo subcarrier) that can be modulated by audio."},{"q":"What is the average splice loss in fiber optics?","a":"0.15 dB","topic":"Fiber","cat":"Comms","exp":"A well-made fusion splice typically has a loss of 0.1–0.2 dB. Mechanical splices have higher loss (0.3–0.5 dB)."},{"q":"What did James Clerk Maxwell contribute to electromagnetics?","a":"Formulated the unified mathematical theory of electromagnetic waves (Maxwell's equations)","topic":"Misc","cat":"Comms","exp":"Maxwell's four equations describe how electric and magnetic fields interact and propagate, predicting the existence of radio waves and unifying electricity, magnetism, and optics."},{"q":"Which of the following semiconductors has the smallest energy gap?","a":"InSb","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What semiconductor that is mostly used in devices requiring the emission or absorption of lights?","a":"compound semiconductor","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the data rate of Bluetooth 2.0 EDR?","a":"2.1 Mbps","topic":"Networks","cat":"Comms","exp":"Bluetooth 2.0 with Enhanced Data Rate (EDR) achieves up to 3 Mbps raw or 2.1 Mbps effective throughput, 3x faster than Bluetooth 1.x."},{"q":"The wavelength of a source wave in a certain material as measured is 18 cm. The frequency of the wave is 1900 Hz. Compute the speed of sound wave?","a":"342 m/s","topic":"GEAS","cat":"GEAS","exp":""},{"q":"Which transistor configuration has the highest input resistance?","a":"common collector","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is formed when n-type and p-type semiconductors are brought together?","a":"pn junction","topic":"Electronics","cat":"Electronics","exp":""},{"q":"When resistors are connected in series, what happens?","a":"The effective resistance is increased","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is NAVTEX?","a":"Maritime safety broadcast system on 518 kHz","topic":"Misc","cat":"Comms","exp":"NAVTEX broadcasts maritime safety information (weather, navigational warnings, search-and-rescue alerts) on 518 kHz internationally and 490 kHz nationally. A key component of GMDSS required on commercial ships."},{"q":"What is the brightness of an image called?","a":"Luminance","topic":"TV","cat":"Board Exam","exp":"Luminance is the measure of brightness or light intensity of an image, independent of color (chrominance). In video, luminance is the Y signal."},{"q":"What is the efficiency of a parabolic antenna?","a":"55%","topic":"Antennas","cat":"Comms","exp":"Parabolic dish antenna aperture efficiency is limited by non-uniform feed illumination, feed blockage, spillover, and surface errors. Net practical efficiency is about 55%. Higher efficiency requires more complex feed designs like corrugated horns."},{"q":"What is the minimum carrier power output of a standard AM broadcast where effective and direct supervision of an Electronics and Communications Engineer is required?","a":"1kW","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is considered as the heat content of a system?","a":"Enthalpy","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the data rate of V.22 modem?","a":"1200 bps","topic":"Networks","cat":"Comms","exp":"V.22 is the ITU standard for 1200 bps full-duplex modem operation over public telephone networks, the standard that replaced Bell 212A internationally."},{"q":"How is static convergence adjusted in a color CRT?","a":"By adjusting permanent magnets near the electron gun","topic":"TV","cat":"Comms","exp":"Static convergence corrects the convergence at the center of the screen using small permanent magnets that deflect the electron beams slightly."},{"q":"What is the total impedance of a series circuit consisting of R = 6Ω, X = 8Ω, and X = C L 16Ω?","a":"10 Ω","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the relationship between PEP and Vrms for a single-tone SSB signal?","a":"PEP = Vrms² / R (PEP equals 1/3 to 1/4 of the DC input power)","topic":"RF","cat":"Comms","exp":"For SSB, the peak envelope power (PEP) represents the power at the peak of the modulating signal; at average voice levels, PEP is 1/3 to 1/4 of amplifier dc input."},{"q":"A train an hour after starting, meets an accident which delayed the trip for one hour, after which it proceeds at 3/5 of its former rate and arrives 3 hrs after time. Had the incident happened 50 km further out the line, it would have arrived 3/2 hrs sooner. Find the length of the journey?","a":"88.88 km","topic":"GEAS","cat":"GEAS","exp":""},{"q":"An airplane acquires a take-off velocity of 150 mph on a 2-mile runway. If the plane started from rest and the acceleration remains constant, what is the time required to reach take-off speed?","a":"96 s","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What gas thermometer is based on the principle that at low pressure, the temperature of a gas is proportional to its pressure at constant volume?","a":"Constant-volume gas thermometer","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What will happen to the magnitude of the load-line slope when the load resistance is decreased?","a":"it will increase","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the designation for SSB with suppressed carrier?","a":"J3E","topic":"RF","cat":"Comms","exp":"ITU emission designations: J3E = SSB suppressed carrier (most common SSB), H3E = SSB full carrier, R3E = SSB reduced carrier, A3E = DSB full carrier (standard AM). 12W PEP is the power rating for J3E."},{"q":"A 1200-kg car going 30 m/s applies its brakes and skids to rest. If the friction force between the sliding tires and the pavement is 6000 N, how far does the car skid before coming to rest?","a":"90 m","topic":"Projectile Motion","cat":"Physics","exp":"Schaum's College Physics - Projectile Motion"},{"q":"Which of the following penalties is provided under the existing telecommunication law, should an international carrier unable to comply with its obligation to provide local exchange service in un-served and under-served areas within three years from grant of authority?","a":"Cancellation of its authority","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A debt of P 1000 is to be paid off in 5 equal yearly payments, each combining an amortization installment and interest at 4% on the previously unpaid balance of the debt. What should be the amount of each payment?","a":"P 224.62","topic":"GEAS","cat":"GEAS","exp":""},{"q":"At which OSI layers does a bridge operate?","a":"Physical and Data Link layers (Layer 1 and 2)","topic":"Networks","cat":"Comms","exp":"A bridge filters and forwards frames based on MAC addresses, operating at Layer 2 (Data Link), and is also aware of the physical layer."},{"q":"What is the hue color sync phase?","a":"Yellow green","topic":"TV","cat":"Comms","exp":"The color burst reference phase corresponds to yellow-green on the color wheel. The burst signal establishes the reference for all hue demodulation."},{"q":"What is NRZ (Non-Return-to-Zero) signaling?","a":"A line code where the signal level does not return to zero between bits","topic":"Networks","cat":"Electronics","exp":"In NRZ signaling, logic 1 holds high and logic 0 holds low for the full bit period. It is efficient but has no inherent clock content for long runs of same bits."},{"q":"What is the distinguishing feature of a class C amplifier?","a":"Output is present for less than 180 degrees of the input signal cycle","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the reverberation time for churches?","a":"1.4 to 3.4 seconds","topic":"Acoustics","cat":"Comms","exp":"Church reverberation of 1.4-3.4 seconds creates a majestic sound for choral and organ music. However it reduces speech intelligibility. Modern worship spaces aim for 1.2-1.8 seconds or use electronic enhancement for simultaneous clarity."},{"q":"An explosion occurs at a distance of 5 km from the observer. How long after the explosion does a person hear if the temperature is 18°C? Note: the speed of sound at STP (standard temperature and pressure) is 332 m/s and changes by 0.6 m/s for every 1 °C change in temperature.","a":"14.58 s","topic":"GEAS","cat":"GEAS","exp":""},{"q":"An amplifier has the following percent harmonic distortions; D2=10%, D3=5% and D4=1%. What is the amplifier % THD?","a":"11.22%","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the CTCSS system?","a":"Continuous Tone-Coded Squelch System — permits selective radio signaling using subaudible tones","topic":"RF","cat":"Comms","exp":"CTCSS (PL tones) are low-frequency tones (67–254 Hz) transmitted with voice; receivers only unsquelch when they detect their programmed tone."},{"q":"An electric motor runs at 900 rpm and delivers 2.0 hp. How much torque does it deliver? 10.36 The driving side of a belt has a tension of 1600 N, and the slack side has 500 N tension. The belt turns a pulley 40 cm in radius at a rate of 300 rpm. This pulley drives a dynamo having 90 percent eciency. How many kilowatts are being delivered by the dynamo?","a":"12 kW","topic":"Angular Motion","cat":"Physics","exp":"Schaum's College Physics - Angular Motion"},{"q":"A 40 000-kg freight car is coasting at a speed of 5.0 m/s along a straight track when it strikes a 30 000-kg stationary freight car and couples to it. What will be their combined speed after impact?","a":"2.9 m/s","topic":"Work, Energy, and Power","cat":"Physics","exp":"Schaum's College Physics - Work, Energy, and Power"},{"q":"A 20 μF capacitor is charged by a 12-V battery. What is the stored energy at the capacitor?","a":"1.44 x 10-3 J","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What will happen when two opposite charges get closer?","a":"attracts more","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the basic law that provides for the regulation of radio station, communications in the Philippines and other purposes?\\","a":"R. A. 3846","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the isolation between subscribers in CATV?","a":"28 dB","topic":"CATV","cat":"Comms","exp":"CATV tap units provide at least 28 dB isolation between subscriber ports to prevent one subscriber's signals from reaching another's equipment."},{"q":"A certain Hookean spring is stretched 20 cm when a given mass is hung from it. What is the frequency of vibration of the mass if pulled down a little and released?","a":"1.1 Hz","topic":"Simple Harmonic Motion","cat":"Physics","exp":"Schaum's College Physics - Simple Harmonic Motion"},{"q":"What is the standard IEEE specification for Wi-Fi?","a":"IEEE 802.11b (Wi-Fi)","topic":"Networks","cat":"Board Exam","exp":"IEEE 802.11b operates at 2.4 GHz and provides up to 11 Mbps, making it the first widely adopted Wi-Fi standard. Later versions (g, n, ac) provide higher speeds."},{"q":"What is letter boxing in video?","a":"Black bars added above and below a widescreen image when displayed on a narrower screen","topic":"TV","cat":"Comms","exp":"Letterboxing preserves the original widescreen aspect ratio by adding horizontal black bars on standard (4:3) displays."},{"q":"What modulator circuit is used for direct FM generation?","a":"Reactance modulator","topic":"RF","cat":"Comms","exp":"A reactance modulator varies the effective reactance of a tank circuit to shift the oscillator frequency in proportion to the audio, generating direct FM."},{"q":"In materials, what do you call the area that separates the valence band and the conduction band?","a":"forbidden band","topic":"Electronics","cat":"Electronics","exp":""},{"q":"An iron steam pipe is 200 ft long at 0oC. What will be its increase in length when heated to 100oC? Coefficient of linear expansion is 30 x 10^-6 per oC.","a":"0.20 ft","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is a codec in digital communications?","a":"A coder-decoder device that converts analog signals to and from PCM digital format","topic":"Networks","cat":"Electronics","exp":"Codecs implement both the ADC (encoding) and DAC (decoding) functions needed for digital telephony or audio, often on a single integrated circuit."},{"q":"What is natural sampling?","a":"Sampling where the sample amplitude follows the original signal for the full duration of the sample pulse","topic":"Networks","cat":"Electronics","exp":"Natural sampling preserves the actual instantaneous waveform during each sample pulse, as opposed to flat-top (sample-and-hold) sampling."},{"q":"A car is a rest on a sloping driveway. By experiment the driver releases the brake of the car and let the car move at constant acceleration. How fast will the car be moving when it reaches the street? Note: The street is 4 m below the original position of the car.","a":"8.86 m/s","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the LORAN C operating frequency?","a":"100 kHz","topic":"GPS","cat":"Comms","exp":"LORAN-C operates at 100 kHz (LF band), allowing ground-wave propagation for long-range navigation coverage over land and sea."},{"q":"What device measures the height of the ionosphere?","a":"Ionosonde","topic":"RF","cat":"Comms","exp":"An ionosonde transmits swept-frequency radio pulses and measures the time delay of reflections to determine the height and electron density of ionospheric layers."},{"q":"What is the basic qualification of an applicant for public carrier network before a Certificate of Public Convenience or a Provisional Authority is issued?","a":"Franchise","topic":"GEAS","cat":"GEAS","exp":""},{"q":"In Fig. 6-8, h1  50:0 cm, h2  30:0 cm, and the length along the wire from A to C is 400 cm. A 3.00-g bead released at A coasts to point C and stops. How large an average friction force opposed its motion?","a":"1.47 mN","topic":"Projectile Motion","cat":"Physics","exp":"Schaum's College Physics - Projectile Motion"},{"q":"Determine the maximum shearing stress in a helical steel spring composed of 20 turns of 20 mm diameter wire on mean radius of 80 mm when the spring is supporting a load of 20 kN?","a":"121 MPa","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the reference noise temperature in telecommunications?","a":"290 Kelvin (approximately 17°C)","topic":"RF","cat":"Comms","exp":"290 K is the standard reference temperature used in noise figure and noise temperature calculations per IEEE and ITU standards."},{"q":"What is adaptive delta modulation?","a":"Delta modulation where the step size varies based on previous values for improved efficiency","topic":"Networks","cat":"Electronics","exp":"Adaptive delta modulation dynamically changes its step size, using larger steps for fast-changing signals to prevent slope overload."},{"q":"A body projected upward from the level ground at an angle of 508 with the horizontal has an initial speed of 40 m/s. (a) How long will it take to hit the ground? (b) How far from the starting point will it strike? (c) At what angle with the horizontal will it strike?","a":"(a) 6.3 s; (b) 0.16 km; (c) 508","topic":"Uniformly Accelerated Motion","cat":"Physics","exp":"Schaum's College Physics - Uniformly Accelerated Motion"},{"q":"What is the IEEE standard for global wireless LAN specifications?","a":"IEEE 802.11x (Wi-Fi family)","topic":"Networks","cat":"Board Exam","exp":"The 802.11 family defines Wi-Fi standards: 802.11b (11 Mbps), 802.11g (54 Mbps), 802.11n (300+ Mbps), 802.11ac (1+ Gbps)."},{"q":"What do you call the very small amount of current that will flow in the diode when it is reverse biased?","a":"reverse saturation current","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is Niels Bohr known for in physics?","a":"The Bohr model of the atom (1913) — electrons orbit nucleus in discrete energy levels","topic":"Misc","cat":"Comms","exp":"Bohr's model explained the hydrogen spectrum by proposing electrons can only occupy specific orbits with quantized energy levels."},{"q":"What is the frequency used to signal handoffs in cellular communications?","a":"10 kHz","topic":"Cellular","cat":"Comms","exp":"The 10 kHz SAT (Supervisory Audio Tone) is used in AMPS to signal handoffs and call terminations. It rides below the voice frequency range."},{"q":"According to its computer, a robot that left its closet and traveled 1200 m, had an average speed of 20.0 m/s. How long did the trip take?","a":"60.0 s","topic":"Uniformly Accelerated Motion","cat":"Physics","exp":"Schaum's College Physics - Uniformly Accelerated Motion"},{"q":"Which color in the visible spectrum has the longest wavelength?","a":"Red (not orange; orange is second longest)","topic":"Misc","cat":"Comms","exp":"Visible light wavelengths: red (~700 nm), orange, yellow, green, blue, indigo, violet (~400 nm). Red has the longest wavelength."},{"q":"What is the sampling interval of the T1 system?","a":"125 microseconds (8000 samples per second)","topic":"Telephone","cat":"Comms","exp":"T1 samples each of its 24 channels at 8000 samples/second (Nyquist for 4 kHz voice bandwidth), giving a 125 µs sampling interval."},{"q":"What is dynamic range in PCM?","a":"The ratio of the strongest to the weakest signal that can be correctly transmitted (in dB: DR = 6.02n + 1.76 dB)","topic":"Networks","cat":"Electronics","exp":"Dynamic range sets the loudest vs. quietest reproducible signals. Each additional bit in PCM adds approximately 6 dB of dynamic range."},{"q":"What are the 3 segments of GPS?","a":"Space segment, user segment, control segment","topic":"GPS","cat":"Comms","exp":"GPS architecture: Space segment (24-32 satellites), Control segment (ground stations including master at Schriever/Falcon AFB, Colorado), User segment (GPS receivers)."},{"q":"What is the most widely used RF transformer core type?","a":"Toroid (toroidal core)","topic":"RF","cat":"Electronics","exp":"Toroidal cores offer high Q, minimal EMI radiation (closed magnetic path), and fewer turns needed compared to E-I or rod cores."},{"q":"A steel support must connect to 30,000 pound tensile loads separated by 200 inches. The maximum allowable stress is 10,000 psi and the maximum elongation is 0.020 inch. What is the required area? E(steel) = 3 x 10^7 psi","a":"10 in2","topic":"GEAS","cat":"GEAS","exp":""},{"q":"The power in a circuit consisting of two equal resistors in series is known to be 10 watts. If the two resistors are connected in parallel, what would be the circuit power dissipation?","a":"40 watts","topic":"Electronics","cat":"Electronics","exp":""},{"q":"How to have a better high-frequency response in designing semiconductor devices?","a":"all of the above","topic":"Electronics","cat":"Electronics","exp":""},{"q":"Which of the following is an example of a compound semiconductor?","a":"All of the above","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the maximum telephone loop resistance allowed?","a":"1300 ohms (per loop)","topic":"Telephone","cat":"Board Exam","exp":"The maximum loop resistance for a standard telephone subscriber loop is approximately 1300 ohms (including both conductors), beyond which telephone current becomes insufficient."},{"q":"What type of analog pulse modulation is PWM?","a":"Pulse Width Modulation — the pulse duration varies with signal amplitude","topic":"RF","cat":"Comms","exp":"In PWM, the width (duration) of each pulse varies proportionally with the instantaneous amplitude of the modulating signal."},{"q":"A boat can go 12 kph in still water. Going full sped it goes 25 km upstream in the same time it takes it to go 35 km downstream. What is the rate of the current?","a":"2.5 kph","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What satellite subsystem monitors on-board conditions and transmits data back to ground?","a":"TTC (Telemetry, Tracking, and Command)","topic":"Satellite","cat":"Comms","exp":"TTC systems measure satellite health (temperature, power, attitude) and transmit this telemetry to ground controllers who can send commands to correct problems."},{"q":"Theoretically, where does the conduction of holes occur in a doped semiconductor?","a":"valence band","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What composes all matter whether a liquid, solid, or gas?","a":"Atoms","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What types of microphone produce low-Z outputs?","a":"Dynamic, ribbon, carbon","topic":"Acoustics","cat":"Comms","exp":"Dynamic and ribbon microphones use electromagnetic induction and produce low-impedance outputs suitable for long cable runs without signal degradation."},{"q":"What is the highest efficiency of heat engine operating between the two thermal energy reservoirs at temperature limits?","a":"Carnot efficiency","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is a vocoder?","a":"A voice coder — applies lossy compression to human speech by modeling the vocal system","topic":"Networks","cat":"Electronics","exp":"Vocoders extract speech parameters (fundamental frequency, vocal tract shape) and transmit them instead of the waveform, achieving very low bit rates (2.4–8 kbps)."},{"q":"What is the smallest element of a matter?","a":"atom","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the position accuracy of LORAN C/D?","a":"460 meters","topic":"GPS","cat":"Comms","exp":"LORAN C/D achieves position accuracy of approximately 460 meters (0.25 nautical miles), sufficient for maritime and aviation en-route navigation."},{"q":"What is Michael Faraday known for?","a":"Discovering electromagnetic induction and the unit of capacitance (Farad) is named after him","topic":"Misc","cat":"Comms","exp":"Faraday showed that a changing magnetic field induces an electric current, the principle behind generators and transformers. He also invented the Faraday cage."},{"q":"What is the technique used to spread a signal by linearly shifting the carrier frequency?","a":"Chirp","topic":"RF","cat":"Comms","exp":"Chirp (linear frequency modulation) sweeps the carrier frequency linearly across a bandwidth. Used in radar for pulse compression — sending a long chirped pulse and compressing it on receive for high range resolution."},{"q":"A block was made to slide down a 30o incline plane. If coefficient of friction between the block and the plane is 0.30, how long will it take the block to travel 20 m from the rest?","a":"6.55 s","topic":"GEAS","cat":"GEAS","exp":""},{"q":"Which of the three regions/areas in a transistor that is the smallest in construction?","a":"base","topic":"Electronics","cat":"Electronics","exp":""},{"q":"In Fig. 3-22, how large a force F is needed to give the blocks an acceleration of 3.0 m/s2 if the coecient of kinetic friction between blocks and table is 0.20? How large a force does the 1.50-kg block then exert on the 2.0-kg block?","a":"22 N, 15 N","topic":"Newton's Laws","cat":"Physics","exp":"Schaum's College Physics - Newton's Laws"},{"q":"When was the first analog cellular phone call made commercially?","a":"October 13, 1983","topic":"Cellular","cat":"Comms","exp":"The first commercial analog cellular service (AMPS) launched on October 13, 1983 in Chicago by Ameritech, using 800 MHz frequencies."},{"q":"What did Alessandro Volta invent?","a":"The voltaic pile (1796) — the first electric battery","topic":"Misc","cat":"Comms","exp":"Volta's voltaic pile, made of alternating zinc and copper discs separated by brine-soaked cloth, was the first device to produce a continuous electric current."},{"q":"In TV, special effects and production switching are done by?","a":"Special Effects Groups (SEG)","topic":"TV","cat":"Comms","exp":"A Special Effects Generator (SEG) is video production equipment for mixing, switching, and applying effects between multiple video sources."},{"q":"Which color contributes the most luminance in a video signal?","a":"Yellow (green combined with red)","topic":"TV","cat":"Comms","exp":"Yellow has the highest luminance because the human eye is most sensitive to green and red; yellow is the additive mix of these two primaries."},{"q":"What is the modulation used in Enhanced Data Rate for GSM Evolution (EDGE)?","a":"8PSK","topic":"Cellular","cat":"Comms","exp":"EDGE uses 8-PSK modulation (3 bits per symbol), tripling the bit rate compared to GMSK used in standard GPRS. EDGE provides data rates up to 384 kbps."},{"q":"What routing technique requires each node to retransmit packets onto every outgoing line?","a":"Flooding","topic":"Networks","cat":"Comms","exp":"Flooding ensures packets reach their destination by sending them on all routes. It's reliable but inefficient. Used in military and some mesh networks where reliability trumps efficiency."},{"q":"A force of 20 N is acting on a 10 Wb magnetic pole, calculate the intensity of the magnetic field?","a":"2 N/Wb","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the Gunn effect?","a":"Oscillations produced in GaAs (gallium arsenide) at microwave frequencies due to transferred electron effect","topic":"RF","cat":"Comms","exp":"Gunn diodes exploit the negative resistance in GaAs when an electric field causes electrons to transfer to higher-energy, lower-mobility states, producing microwave oscillations."},{"q":"What is the output terminal match loss in CATV systems?","a":"16 dB","topic":"CATV","cat":"Comms","exp":"CATV distribution equipment maintains output terminal-to-terminal isolation of typically 16 dB to prevent reflections from one outlet affecting others."},{"q":"Why must a parametric amplifier be cooled?","a":"To improve its noise performance","topic":"RF","cat":"Board Exam","exp":"The noise temperature of a parametric amplifier decreases dramatically when cooled; at liquid helium temperatures (~4K), noise temperatures below 10K are achievable for satellite receivers."},{"q":"What is defined as the direct conversion of a substance from the solid to the vapor state or vice versa without passing the liquid state?","a":"Sublimation","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the lowest layer of the ionosphere?","a":"F1 layer","topic":"RF","cat":"Comms","exp":"The ionosphere has D, E, F1, and F2 layers. F1 is the lower portion of the F layer and is most prominent during the day."},{"q":"How is fiber grating produced?","a":"By illuminating the fiber with ultraviolet light","topic":"Fiber","cat":"Comms","exp":"Fiber Bragg Gratings (FBG) are created by exposing photosensitive fiber to a UV interference pattern. This creates periodic refractive index variations that act as wavelength-selective reflectors."},{"q":"When was the Strowger automatic telephone exchange switch invented?","a":"1897","topic":"Telephone","cat":"Comms","exp":"Almon Strowger invented the step-by-step (Strowger) switch in 1889 and it became commercially available around 1892-1897, enabling automatic telephone dialing."},{"q":"What does TACAN provide?","a":"Bearing and distance (slant range) information for aircraft navigation","topic":"GPS","cat":"Comms","exp":"TACAN (Tactical Air Navigation) provides both azimuth (bearing) and DME (distance) for military aircraft navigation."},{"q":"A 700-N man stands on a scale on the ¯oor of an elevator. The scale records the force it exerts on whatever is on it. What is the scale reading if the elevator has an acceleration of (a) 1.8 m/s2 up? (b) 1.8 m/s2 down? (c) 9.8 m/s2 down?","a":"(a) 0.83 kN; (b) 0.57 kN; (c) zero","topic":"Newton's Laws","cat":"Physics","exp":"Schaum's College Physics - Newton's Laws"},{"q":"What is an energy that can be transferred from one object to another causing a change in temperature of each object?","a":"Heat","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is a Feed Horn?","a":"Horn radiator at the focal point of a parabolic dish","topic":"Antennas","cat":"Comms","exp":"The feed horn converts waveguide mode to free-space radiation at the dish focal point. Its beamwidth is designed to uniformly illuminate the dish reflector for maximum aperture efficiency. Horn beamwidth determines dish illumination taper."},{"q":"The captain of a spacecraft send a pulse of light towards earth and then exactly 1 min. later (as measured by the clock on the spacecraft), sends a second pulse. An observer on earth sees the second pulse arrive 4 minutes after the first. What is the velocity of the spacecraft relative to the earth?","a":"0.968c","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the duration of the vertical blanking interval in NTSC?","a":"1333 microseconds","topic":"TV","cat":"Comms","exp":"The vertical blanking interval in NTSC is approximately 1333 µs (21 lines at 63.5 µs each), during which the beam retraces vertically."},{"q":"What is the Adaptive Multi-Rate (AMR) codec?","a":"Variable rate speech codec for 3G systems from 4.75 to 12.2 kbps","topic":"Cellular","cat":"Comms","exp":"AMR adjusts its coding rate based on channel quality: high rate for good signal gives better voice quality, low rate for poor signal provides more error correction bits. Standard voice codec for UMTS (3G) and enhanced GSM networks."},{"q":"What are the transistor configurations used in a cascade amplifier?","a":"common-emitter and common-base","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the minimum illumination level recommended for reading?","a":"8000 lux","topic":"Misc","cat":"Comms","exp":"Adequate reading illumination is typically 500-1000 lux in practice, but 8000 lux is cited as the minimum for comfortable reading in some standards."},{"q":"What is the significance of connecting loads in parallel?","a":"it allows independent operations of loads","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is return loss when termination impedance equals characteristic impedance?","a":"Infinite (no reflection)","topic":"RF","cat":"Comms","exp":"When load impedance perfectly matches characteristic impedance, all power is absorbed and none is reflected, giving infinite return loss."},{"q":"Why is FM more efficient than AM?","a":"Because FM uses class C amplifiers","topic":"Antennas","cat":"Comms","exp":"FM transmitters use highly efficient Class C amplifiers (70-85% efficiency) because FM has constant amplitude. AM requires linear Class A/B amplifiers (~25-50% efficiency) to preserve amplitude variations."},{"q":"What is the color burst frequency in NTSC?","a":"3.579545 MHz","topic":"TV","cat":"Comms","exp":"The NTSC color subcarrier is precisely 3.579545 MHz, chosen to interleave with the luminance spectrum and minimize visible dot pattern interference."},{"q":"How many water molecules are present in 5.34 mL of water at a temperature of 4oC, which the density of water at this temperature is 1.00 g/mL? Atomic masses of H and O are 1.008 g and 16.00 g respectively.","a":"1.78 x 10^23 molecules","topic":"GEAS","cat":"GEAS","exp":""},{"q":"The block shown in Fig. 4-10(b) slides at a constant speed down the incline. (a) How large is the friction force that opposes its motion? (b) What is the coecient of sliding (kinetic) friction between the block and the plane?","a":"(a) 39 N; (b) 0.84","topic":"Equilibrium","cat":"Physics","exp":"Schaum's College Physics - Equilibrium"},{"q":"A 33 kilo ohms resistor is connected in series with a parallel combination made up of a 56 kilo ohm resistor and a 7.8 kilo ohm resistor. What is the total combined resistance of these three resistors?","a":"39067 ohms","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What OSI layer handles the transmission of bits in the communications channel?","a":"Physical layer","topic":"Networks","cat":"Comms","exp":"OSI Layer 1 (Physical) deals with voltages, current levels, bit timing, and physical connectors. It transmits raw bits over the medium — nothing about meaning or structure."},{"q":"The coecient of sliding friction between a 900-kg car and the pavement is 0.80. If the car is moving at 25 m/s along level pavement when it begins to skid to a stop, how far will it go before stopping?","a":"40 m","topic":"Projectile Motion","cat":"Physics","exp":"Schaum's College Physics - Projectile Motion"},{"q":"A large horizontal disk is rotating on a vertical axis through its center; for the disk, I  4000 kg \u0001 m2 . The disk is coasting at a rate of 0.150 rev/s when a 90.0-kg person drops onto the disk from an overhanging tree limb. The person lands and remains at a distance of 3.00 m from the axis of rotation. What will be the rate of rotation after the person has landed?","a":"0.125 rev/s","topic":"Angular Motion","cat":"Physics","exp":"Schaum's College Physics - Angular Motion"},{"q":"The non-inverting and inverting inputs of an op-amp have an input voltage of 1.5 mV and 1.0 mV, respectively. If the op-amp has a common-mode voltage gain of 10 and a differential-mode gain of 10,000, what is its output voltage?","a":"5.0125 V","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the insulator used in most MOS-FET?","a":"SiO2","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What refers to a permit issued by the NTC authorizing the holder thereof to engage to the acquisition, servicing, maintenance, purchase or sale of transmitters and/or transceivers, parts and accessories thereof?","a":"Radio Communication Equipment Dealer Permit","topic":"GEAS","cat":"GEAS","exp":""},{"q":"Which FET has a wide and short effective channel?","a":"V-MOSFET","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the standard test tone frequency in telephony?","a":"1000 Hz (1 kHz)","topic":"Telephone","cat":"Comms","exp":"A 1000 Hz (1 kHz) tone at 0 dBm is the standard reference for level measurements in telephone and broadcast transmission systems."},{"q":"What is an executive order signed by former President Fidel Ramos in March 1998 providing the national policy in the operation and use of international satellite communications in the Philippines?","a":"E. O. 467","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is an anechoic room?","a":"A room where all sound is absorbed by the walls, floor, and ceiling","topic":"Acoustics","cat":"Comms","exp":"Anechoic chambers have highly absorptive surfaces (wedge-shaped foam) on all surfaces, virtually eliminating reflections to create a 'free field' environment."},{"q":"What is the orbital period of each GPS constellation satellite?","a":"12 hours","topic":"GPS","cat":"Comms","exp":"GPS satellites orbit at 20,200 km altitude with a 12-hour period. Six orbital planes are spaced 60° apart, each inclined 55° relative to the equator."},{"q":"What is the single-hop nighttime range of the F2 layer?","a":"4130 km","topic":"GPS","cat":"Comms","exp":"At night, the F2 layer persists (unlike E and F1 layers which disappear). A single F2 hop can cover up to 4130 km, enabling long-distance HF communication at night."},{"q":"How does the input of an op-amp made high?","a":"A and B above","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What error control method is used for HF radio transmission?","a":"ARQ (Automatic Repeat reQuest)","topic":"RF","cat":"Comms","exp":"ARQ detects transmission errors and requests retransmission of corrupted data, widely used where forward error correction alone is insufficient."},{"q":"A steel wheel 800 mm in diameter rolls on a horizontal steel rail. It carries a load of 700 N. The coefficient of rolling resistance is 0.250 mm. What is the force P necessary to roll the wheel along the rail?","a":"0.44 N","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the variation of the FM discriminator that greatly reduces sensitivity to amplitude variations?","a":"Ratio detector","topic":"RF","cat":"Comms","exp":"The ratio detector (improved Foster-Seeley) provides AM rejection without a limiter stage, reducing sensitivity to amplitude noise by 50%. However, its output voltage is also 50% of the Foster-Seeley."},{"q":"According to the TV broadcast standards, what is the maximum effective radiated power in Metro Manila and Metro Cebu for channels 7 – 13?","a":"1000 kW","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A series RL network is supplied with a 200-volt, 60-cycle source. If the voltage across the resistor R is 100 V, what is the voltage across the inductor L?","a":"173.2 V","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What device is used to measure X-ray radiation exposure?","a":"Dosimeter","topic":"Safety","cat":"Comms","exp":"A dosimeter (film badge or electronic) measures cumulative radiation exposure to ensure safety limits are not exceeded in X-ray environments."},{"q":"What is the free-running frequency of a VCO?","a":"The frequency at which the VCO oscillates when its control voltage is zero","topic":"RF","cat":"Comms","exp":"The free-running frequency is the VCO's natural (uncontrolled) frequency; applying a control voltage shifts it higher or lower from this center point."},{"q":"What is Photometry?","a":"Science of measuring light visible to the human eye","topic":"Misc","cat":"Comms","exp":"Photometry measures light weighted by the human eye spectral sensitivity curve (peak at 555 nm yellow-green). Units: lumen, candela, lux. Radiometry measures all electromagnetic radiation without spectral weighting."},{"q":"What is inertial navigation based on?","a":"Newton's Laws of Motion (integrates accelerometer data to track position)","topic":"GPS","cat":"Comms","exp":"Inertial Navigation Systems (INS) use accelerometers and gyroscopes to continuously compute position by integrating acceleration, with no external signal required."},{"q":"What refers to the transfer of energy from the more energetic particles of a substance to the adjacent less energetic ones as a result of interaction between particles?","a":"Conduction","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What principle is employed in cellular telephony to allow simultaneous Tx and Rx without push-to-talk?","a":"Frequency duplex","topic":"Cellular","cat":"Comms","exp":"FDD (Frequency Division Duplex) uses separate frequencies for transmit and receive, allowing full-duplex operation. No push-to-talk is needed unlike half-duplex radio systems."},{"q":"A silicon diode has a reverse saturation current of 50 nA at room temperature. If the operating temperature is raised by 50°C, what is now the reverse saturation current?","a":"1.66 µA","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the speech coding rate of GSM?","a":"13 kbps","topic":"Cellular","cat":"Comms","exp":"GSM uses the RPE-LPC (Regular Pulse Excited – Linear Predictive Coding) codec at 13 kbps. This efficiently compresses voice to fit 8 time slots per 200 kHz channel."},{"q":"What causes permanent hearing damage?","a":"Exposure to 130-150 dB SPL","topic":"Safety","cat":"Comms","exp":"Acoustic trauma from single exposures above 130 dB can permanently damage cochlear hair cells. Jet engines (~140 dB) and firearms (~160 dB peak) can cause immediate permanent damage. Hair cells do not regenerate in mammals."},{"q":"What process assigns PCM digital codes to signal magnitudes?","a":"Quantizing","topic":"Telephone","cat":"Comms","exp":"Quantizing divides the analog amplitude range into discrete steps and assigns a binary code to each, converting analog signals to digital."},{"q":"What is the recommended volume per person for a church?","a":"7.1 to 9.9 cubic meters per person","topic":"Acoustics","cat":"Comms","exp":"Church acoustics require more volume per person (7.1-9.9 m³) than cinemas (3.1 m³) to support the longer reverberation times needed for organ music and choral singing."},{"q":"What is the typical one-way delay for a GEO satellite transmission?","a":"Approximately 500 ms (round trip)","topic":"Satellite","cat":"Board Exam","exp":"A GEO satellite is ~36,000 km away; one-way propagation delay = 36000/(3×10⁵) ≈ 120 ms. Round-trip delay is ~240–270 ms; total with processing ≈ 500 ms."},{"q":"A car staring from rest pick-up at a uniform rate and passes three electric post in succession. The post is spaced 360 cm apart along a street road. The car takes 10 seconds to travel from the first post to the second post and takes 6 seconds to go from the 2nd to the 3rd post. Where did the car started from the first post?","a":"73.5 m","topic":"GEAS","cat":"GEAS","exp":""},{"q":"Which antennas are made with microstrip on PCBs?","a":"Patch antenna","topic":"Antennas","cat":"Comms","exp":"Microstrip patch antennas are etched onto PCBs — flat, compact, and easily integrated into devices. They're used in GPS receivers, Wi-Fi cards, and mobile phones."},{"q":"What refers to the heating of the earth’s atmosphere not caused by direct sunlight but by infrared light radiated by the surface and absorbed mainly by atmospheric carbon dioxide?","a":"Greenhouse effect","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the typical power output of a reflex klystron?","a":"100 mW","topic":"RF","cat":"Comms","exp":"Reflex klystrons use a single cavity and a reflector electrode. They produce low power (~100 mW) but are tunable over a narrow range. Used as local oscillators in microwave receivers."},{"q":"What are the two types of network software?","a":"Peer-to-peer, client-server","topic":"Networks","cat":"Comms","exp":"In peer-to-peer networks, all computers share equally. In client-server networks, dedicated servers provide services to client computers. Client-server is preferred for large networks."},{"q":"Which RF connector type is the least expensive?","a":"F-type connector","topic":"RF","cat":"Comms","exp":"F-type connectors are inexpensive push-on/screw-on connectors used for cable TV, satellite, and antenna connections at 75 ohms impedance."},{"q":"How many horizontal lines are blanked out in the frame of a TV receiver by V blanking?","a":"42","topic":"TV","cat":"Comms","exp":"NTSC has 525 total lines; 42 are blanked during vertical retrace. This leaves 483 active lines (though the effective visible count is about 480)."},{"q":"What is the beat frequency between the 3.58 MHz color subcarrier and the 4.5 MHz sound signal?","a":"0.92 MHz","topic":"TV","cat":"Comms","exp":"4.5 MHz − 3.58 MHz = 0.92 MHz. This beat frequency is used in intercarrier sound detection in TV receivers."},{"q":"An elevator weighs 1000 pounds
