 and is supported by a 5/16 inch diameter cable, 1500 feet long. When the elevator carries a 1500 lb, the cable elongates 6 inches more. What is the modulus of elasticity of the cable?","a":"5.87 x 10^7 psi","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the GPS satellite separation?","a":"60 degrees","topic":"GPS","cat":"Comms","exp":"The 6 GPS orbital planes are equally spaced at 60° intervals around the equator. Each plane contains 4 satellites, with some spares, for 24+ total satellites."},{"q":"A wheel and axle having a total moment of inertia of 0.002 0 kg \u0001 m2 is caused to rotate about a horizontal axis by means of an 800-g mass attached to a cord wrapped around the axle. The radius of the axle is 2.0 cm. Starting from rest, how far must the mass fall to give the wheel a rotational rate of 3.0 rev/s?","a":"5.3 cm","topic":"Angular Motion","cat":"Physics","exp":"Schaum's College Physics - Angular Motion"},{"q":"What is usually used to move heavy loads by applying a force which is usually smaller that the weight of the load?","a":"Wedge","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A truck is moving north at a speed of 70 km/h. The exhaust pipe above the truck cab sends out a trail of smoke that makes an angle of 208 east of south behind the truck. If the wind is blowing directly toward the east, what is the wind speed at that location?","a":"25 km/h","topic":"Vectors","cat":"Physics","exp":"Schaum's College Physics - Vectors"},{"q":"What is a stripline transmission line?","a":"A flat conductor between two parallel ground planes on a PCB","topic":"RF","cat":"Comms","exp":"Stripline is a planar transmission line with a flat conductor sandwiched between two ground planes, fully enclosed and shielded."},{"q":"What short haul telecom distance is the dividing line for transmission?","a":"Exceeding 200 km is typically considered long haul","topic":"Networks","cat":"Board Exam","exp":"Short haul typically covers distances up to 200 km; beyond that, specialized long-haul transmission equipment and amplification strategies are needed."},{"q":"A 200-kg cart is pushed slowly up an incline. How much work does the pushing force do in moving the cart up to a platform 1.5 m above the starting point if friction is negligible?","a":"2.9 kJ","topic":"Projectile Motion","cat":"Physics","exp":"Schaum's College Physics - Projectile Motion"},{"q":"What is the critical capacitance variation of most varactors used in frequency modulators?","a":"12 to 1","topic":"RF","cat":"Comms","exp":"Varactor (voltage-variable capacitor) diodes used in FM modulators have a typical capacitance ratio of 12:1. This range determines the maximum frequency deviation possible — wider ratio = more deviation range."},{"q":"What is the magnitude of the resultant force of the two forces which are perpendicular to each other? The two forces are 20 units and 30 units respectively.","a":"36","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is station keeping for a geostationary satellite?","a":"The process of adjusting the satellite's orbit to maintain its position above a fixed point on Earth","topic":"Satellite","cat":"Comms","exp":"Station keeping uses onboard thrusters to correct for perturbations from the Sun, Moon, and non-uniform Earth gravity that would cause the satellite to drift."},{"q":"What refers to the portion of the internal energy of a system associated with the kinetic energies of the molecules?","a":"Sensible energy","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A nut comes loose from a bolt on the bottom of an elevator as the elevator is moving up the shaft at 3.00 m/s. The nut strikes the bottom of the shaft in 2.00 s. (a) How far from the bottom of the shaft was the elevator when the nut fell o ? (b) How far above the bottom was the nut 0.25 s after it fell o?","a":"(a) 13.6 m; (b) 14 m","topic":"Uniformly Accelerated Motion","cat":"Physics","exp":"Schaum's College Physics - Uniformly Accelerated Motion"},{"q":"What law specifically requires the service of a duly registered Electronics and Communications Engineer in the designing, installation and construction, operation and maintenance of radio stations?","a":"D. O. 88","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A body is projected downward at an angle of 308 with the horizontal from the top of a building 170 m high. Its initial speed is 40 m/s. (a) How long will it take before striking the ground? (b) How far from the foot of the building will it strike? (c) At what angle with the horizontal will it strike?","a":"(a) 4.2 s; (b) 0.15 km; (c) 608","topic":"Uniformly Accelerated Motion","cat":"Physics","exp":"Schaum's College Physics - Uniformly Accelerated Motion"},{"q":"What is a comb filter used for in TV receivers?","a":"To cancel chroma crosstalk by separating luminance and chrominance signals","topic":"TV","cat":"Comms","exp":"A comb filter uses a delay line equal to one horizontal line period to separate the Y (luminance) and C (chrominance) signals by exploiting their phase relationship."},{"q":"What did Gustav Kirchhoff contribute to circuit theory?","a":"Kirchhoff's Current Law (KCL) and Kirchhoff's Voltage Law (KVL) in 1847","topic":"Misc","cat":"Comms","exp":"KCL states that current into a node equals current out; KVL states that the sum of voltages around any closed loop equals zero."},{"q":"What is backhaul in satellite communications?","a":"The terrestrial channel linking an earth station to the main switching network","topic":"Satellite","cat":"Comms","exp":"Backhaul carries traffic from remote earth stations or cell towers back to the core network or switching center."},{"q":"A light bulb emits a total luminous flux of 1700 lumens, distributed uniformly over a hemisphere. What is the illuminance at a distance of 2 meters?","a":"67.65 lm/m^2","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What refers to a remuneration paid to a carrier by the interconnecting carriers for accessing the facilities of such carrier which is needed by the interconnecting carriers for the origination and/or termination of all types of traffic derived from the interconnector?","a":"Access charge","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A highway curve has a super elevation of 7 degrees. What is the radius of the curve such that there will be no lateral pressure between the tires and the roadway at a speed of 40 mph?","a":"265.71 m","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A ball was dropped into a hard court from a height of 10 m. if coefficient of restitution is 0.95, what height will it attain on its 5th bounce?","a":"6 m","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A 3-m string is driven by a 240 Hz vibrator at its end. Determine the speed of transverse waves on the string if it resonates four segments?","a":"360 m/s","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the skip zone in radio propagation?","a":"Area between outer ground wave range and inner edge of ionospheric return","topic":"GPS","cat":"Comms","exp":"The skip zone is the dead zone where neither ground wave nor sky wave reaches. Ground wave dies out, but the sky wave (refracted by ionosphere) lands beyond the zone. No signal is received in the skip zone."},{"q":"What are pulses that retain their shapes as they pass through optical fibers?","a":"Solitons","topic":"Fiber","cat":"Comms","exp":"Solitons are optical pulses that maintain their shape by balancing fiber dispersion with nonlinear effects (self-phase modulation). They enable ultra-long-distance transmission without distortion."},{"q":"A body was fired vertically upward with an initial velocity of 500 m/s from the ground. How long will it take the body to return to the ground?","a":"10.2 seconds","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the final amplifier stage called?","a":"Power amplifier","topic":"Antennas","cat":"Comms","exp":"The power amplifier (PA) is the final stage of a transmitter, delivering maximum RF power to the antenna. It's typically a Class C amplifier for FM/CW, Class AB for SSB."},{"q":"If the sum of P12000 is deposited in an account earning interest at a rate of 9% compounded quarterly, what will it become at the end of 8 years?","a":"P 24,457.24","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is considered as the actual pressure at a given position and is measured relative to absolute vacuum?","a":"Absolute pressure","topic":"GEAS","cat":"GEAS","exp":""},{"q":"In CATV, what is the RF output terminal impedance match?","a":"16 dB","topic":"CATV","cat":"Comms","exp":"The 16 dB RF output terminal match (return loss) ensures minimal signal reflection at subscriber tap points, maintaining signal integrity throughout the distribution system."},{"q":"If three amplifiers with a gain of 8 each are in cascade, how much is the overall gain?","a":"512","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the EIRP of a 10 kW earth station with 3 dB backoff, 4 dB feeder loss, and 40 dB antenna gain?","a":"73 dBW","topic":"Satellite","cat":"Board Exam","exp":"EIRP = P_tx - backoff - feeder_loss + antenna_gain = 40 - 3 - 4 + 40 = 73 dBW. (10 kW = 40 dBW)"},{"q":"What is the center impedance of a half-wave antenna?","a":"73 ohms","topic":"Antennas","cat":"Comms","exp":"A theoretical half-wave dipole in free space has a radiation resistance of 73.1 Ω. In practice, nearby objects affect this. Coaxial cable (50 Ω) is matched using a balun."},{"q":"What LAN topology is used by classical Ethernet?","a":"BUS topology","topic":"Networks","cat":"Comms","exp":"Classic Ethernet (10Base5, 10Base2) uses a bus topology where all computers share one coaxial cable. Collisions are managed by CSMA/CD protocol."},{"q":"Amplifiers conversion efficiency are calculated using what formula?","a":"A or B are correct","topic":"Electronics","cat":"Electronics","exp":""},{"q":"The resultant of two forces in a plane is 400 N at 120 degrees. If one of the forces is 200 lbs at 20 degrees what is the other force?","a":"477.27 N at 144.38 degrees","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is cladding in optical fiber?","a":"Dielectric material surrounding the fiber core with lower refractive index","topic":"Fiber","cat":"Comms","exp":"Cladding surrounds the core and has a lower refractive index to allow total internal reflection, guiding light along the fiber."},{"q":"What is used to produce high-power microwave oscillations?","a":"Klystron and magnetrons","topic":"RF","cat":"Comms","exp":"Klystrons and magnetrons are high-power vacuum tube microwave oscillators. Klystrons use velocity modulation of an electron beam; magnetrons use crossed electric and magnetic fields. Magnetrons are in radar and microwave ovens."},{"q":"What is the maximum theoretical data rate for a satellite transponder with 36 MHz bandwidth (binary)?","a":"72 Mbps (Nyquist: 2 × bandwidth)","topic":"Satellite","cat":"Board Exam","exp":"By Nyquist's theorem, binary transmission maximum rate = 2 × bandwidth = 2 × 36 MHz = 72 Mbps. Higher-order modulation achieves more, but this is the binary limit."},{"q":"A 1200-kg car coasts from rest down a driveway that is inclined 208 to the horizontal and is 15 m long. How fast is the car going at the end of the driveway if (a) friction is negligible and (b) a friction force of 3000 N opposes the motion?","a":"(a) 10 m/s; (b) 5.1 m/s","topic":"Projectile Motion","cat":"Physics","exp":"Schaum's College Physics - Projectile Motion"},{"q":"If a rocket contains more than one satellite, what is the smaller satellite called?","a":"Secondary payload","topic":"Satellite","cat":"Comms","exp":"When multiple satellites share a launch vehicle, the smaller/less important one is the secondary (or tertiary) payload. They typically have less favorable orbit insertion."},{"q":"What is the inclination angle of GPS satellites' orbits?","a":"55 degrees","topic":"GPS","cat":"Comms","exp":"GPS orbital planes are inclined 55° relative to the equator. This provides good coverage up to about 85° latitude — near but not at the poles."},{"q":"In order to have the best efficiency and stability, where at the loadline should a solid state power amplifier be operated?","a":"Just below the saturation point","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A light ray passing through air and strikes a glass surface at an angle of 55° from the normal surface. What is the angle between the reflected light and the surface?","a":"35°","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What type of MOSFET whose channel is originally thick but narrows as the proper gate bias is applied?","a":"depletion","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What states that for a confined fluid, the pressure at a point has the same magnitude in all directions?","a":"Pascal’s Law","topic":"GEAS","cat":"GEAS","exp":""},{"q":"If, in Fig. 9-4 and in Problem 9.33, h  2:5R, how large a force will the 50-g bead exert on the wire as it passes through point C?","a":"2.9 N","topic":"Impulse and Momentum","cat":"Physics","exp":"Schaum's College Physics - Impulse and Momentum"},{"q":"What is a Discone antenna?","a":"Vertically polarized broadband omnidirectional antenna","topic":"Antennas","cat":"Comms","exp":"A discone has a horizontal disc and a vertical cone connected at their tips. It provides omnidirectional coverage over 10:1 or greater bandwidth without retuning. Popular for VHF/UHF scanner receivers covering many services simultaneously."},{"q":"What is the GPS satellite orbit period?","a":"12 hours","topic":"GPS","cat":"Comms","exp":"Each GPS satellite completes two orbits per day (12-hour period) at an altitude of 20,200 km. At least 4 satellites are needed for 3D position fixing."},{"q":"In companding, what device provides less amplification for low-level signals?","a":"Expander","topic":"Telephone","cat":"Comms","exp":"The expander in a companding system restores the original dynamic range by providing less amplification for low signals and more for high signals."},{"q":"What modulation method is commonly used for telegraphy?","a":"FSK (Frequency Shift Keying)","topic":"Misc","cat":"Comms","exp":"FSK uses two frequencies to represent mark and space conditions, making it suitable for telegraphy and low-speed data transmission."},{"q":"What is a launched satellite that breaks free from Earth's gravity and wanders in space?","a":"Space probe","topic":"GPS","cat":"Comms","exp":"A space probe is launched at or above escape velocity (~11.2 km/s / 25,000 mph). It escapes Earth's gravity and can travel to other planets or deep space."},{"q":"How many voice band channels are in a FDM jumbogroup?","a":"3600 channels","topic":"Telephone","cat":"Board Exam","exp":"FDM hierarchy: 12 ch = group; 5 groups = supergroup (60 ch); 10 supergroups = mastergroup (600 ch); 6 mastergroups = jumbogroup (3600 ch)."},{"q":"What is random data sent continuously by a NIC that disrupts the whole network?","a":"Jabber","topic":"Networks","cat":"Comms","exp":"Jabber is a condition where a NIC transmits a continuous stream of garbage data, monopolizing the network medium and preventing all other stations from transmitting."},{"q":"What is the standard terrestrial TV transmission in the US?","a":"8VSB","topic":"TV","cat":"Comms","exp":"8VSB (8-level Vestigial Sideband) is the ATSC standard for digital TV broadcasting in North America. It offers 19.39 Mbps data rate on a 6 MHz channel."},{"q":"What is the minimum channel rejection of a CATV system?","a":"60 dB","topic":"CATV","cat":"Comms","exp":"60 dB spurious signal rejection ensures adjacent channels don't interfere with desired channels. This is the minimum per FCC regulations for cable TV systems."},{"q":"How does SSB bandwidth compare to DSBFC?","a":"SSB uses half the bandwidth of DSBFC","topic":"RF","cat":"Comms","exp":"Single sideband suppresses the carrier and one sideband, requiring only half the bandwidth of double-sideband full-carrier (DSBFC)."},{"q":"What is sometimes known as the “Fourth-power law”?","a":"Stefan-Boltzmann law","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the latent heat of vaporization of water at 1 atm?","a":"2257.1 kJ/kg","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What data transfer scheme uses the handshaking principle?","a":"Asynchronous data transfer scheme","topic":"Networks","cat":"Board Exam","exp":"Asynchronous (or interrupt-driven) data transfer uses handshaking signals (ready/acknowledge) to coordinate transfers, eliminating the need for a shared clock."},{"q":"Which of the following is the molar mass of the gas at 752 torr and 41oC? Ten grams of a gas occupy a volume of 5.12 L.","a":"51 g/mol","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What law provides an absolute reference point for the determination of entropy?","a":"Third law of thermodynamics","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What device, that employs only electron or hole?","a":"unipolar","topic":"Electronics","cat":"Electronics","exp":""},{"q":"How many moles of chloroform (CHCl3) are there in 210.45 g of chloroform? C = 12.01 amu, H = 1.008 amu and Cl = 35.45 amu.","a":"1.76 CHCl3 moles","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A man borrows P 10,000 from a loan association. The rate of simple interest is 15%. But the interest is to be deducted from the load at the time the money is borrowed. At the end of one year, he has to pay back P10, 000. What is the actual rate of interest?","a":"17.65%","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A man aimed his rifle at the bull’s eye of a target 50 m away. If the speed of the bullet is 500 m/s, how far below the bull’s eye does the bullet strikes the target?","a":"5.0 cm","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A 6.0-kg bowling ball I  2Mr 2 =5 starts from rest and rolls down a gradual slope until it reaches a point 80 cm lower than its starting point. How fast is it then moving? Ignore friction losses.","a":"3.3 m/s","topic":"Angular Motion","cat":"Physics","exp":"Schaum's College Physics - Angular Motion"},{"q":"Where does the Q-point of a class C amplifier positioned?","a":"below cutoff region","topic":"Electronics","cat":"Electronics","exp":""},{"q":"In FET, the conduction path of the output is controlled by the electric field as its name implies. How does an electric field in FET established?","a":"By the charges present at the gate due to the reverse-biased junction.","topic":"Electronics","cat":"Electronics","exp":""},{"q":"The atomic masses of carbon, hydrogen, and oxygen are 12.07g, 1.008g and 16.00g respectively. Calculate the number of C atoms present in 84.5 g of isopropanol (rubbing alcohol), C3H8O?","a":"2.54 x 1024 C atoms","topic":"GEAS","cat":"GEAS","exp":""},{"q":"In op-amps functional block diagram, what follows the differential amplifier?","a":"high gain amplifier","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A ball is thrown vertically upward from the ground and a student gazing out of the window sees it moving upward pass him at 5 m/s. The window is 10 m above the ground. How high does the ball go above the ground?","a":"11.28 m","topic":"GEAS","cat":"GEAS","exp":""},{"q":"Which transistor configuration hybrid parameters, that is usually specified by the manufacturers?","a":"for common-emitter","topic":"Electronics","cat":"Electronics","exp":""},{"q":"Why do most op-amps use a common collector at the output stage?","a":"to have a very low output resistance","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What do you call an amplifier which has an output current flowing during the whole input current cycle?","a":"class A amplifier","topic":"Electronics","cat":"Electronics","exp":""},{"q":"An amplifier of class AB means its output signal is between the output of class B and A, such that it varies from 180° (class B) to 360° (class A). How about its efficiency?","a":"Efficiency of class AB is in between the efficiency of class A and B, that is from 25% - 78.5%.","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the approximate threshold voltage between the base-emitter junction of a silicon darlington transistor?","a":"1.6 V","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A man sold 7 more than 5/8 of his load of apple, after which he had 9 less than 2/5 of his original load left. What was the original load?","a":"80","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the resonant frequency of a circuit when L of 25 microhenry and C of 10 picofarad are in parallel?","a":"10.1 MHz","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A car's odometer reads 22 687 km at the start of a trip and 22 791 km at the end. The trip took 4.0 hours. What was the car's average speed in km/h and in m/s?","a":"26 km/h, 7.2 m/s","topic":"Uniformly Accelerated Motion","cat":"Physics","exp":"Schaum's College Physics - Uniformly Accelerated Motion"},{"q":"What refers to the point at which the saturated liquid and saturated vapor states are the same or identical?","a":"Maximum point","topic":"GEAS","cat":"GEAS","exp":""}];
</script>

function applyFilters(){let count=parseInt(document.getElementById('qCount').value)||100; let topic=document.getElementById('topicFilter').value; if(count>unlockedLimit)count=unlockedLimit; let filtered=[...allQuestions]; if(topic!=='all') filtered=filtered.filter(q=> (q.topic||'').toUpperCase().includes(topic.toUpperCase()) || (q.q||'').toLowerCase().includes(topic.toLowerCase())); if(filtered.length==0) filtered=[...allQuestions]; questions=filtered.slice(0,count); limit=questions.length; idx=0; answered=0; correct=0; document.getElementById('filterInfo').innerText='✅ Showing '+questions.length+' Qs from '+allQuestions.length+' total pool - FIXED!'; showQ();}

function updateScore(){let pct=answered>0?Math.round(correct/answered*100):0; document.getElementById('scoreText').innerText='Answered: '+answered+' | Correct: '+correct+' | Score: '+pct+'% - Q '+(idx+1)+'/'+limit; document.getElementById('progressText').innerText='Q '+(idx+1)+'/'+limit+' - Pool: '+allQuestions.length+' - '+(questions[idx]?.topic||'');}
function setMode(m,el){mode=m; document.querySelectorAll('.mode').forEach(e=>e.classList.remove('active')); el.classList.add('active'); let td=document.getElementById('blitzTimer'); if(m==='blitz'){td.style.display='block'; startBlitz();} else {td.style.display='none'; clearInterval(blitzInterval);} showQ();}

 let q=questions[idx];
 document.getElementById('q').innerText='Q'+(idx+1)+'/'+limit+' ['+(q.topic||q.cat||'ECE')+']: '+(q.q||'');
 let opts=document.getElementById('opts'); opts.innerHTML='';
 let extra=document.getElementById('extra');
 // Q&A mode (has 'a' field, no opts)
 if(!q.opts || q.opts.length===0){
   // Show answer area hidden initially
   let isBlitz = mode==='blitz';

   let exp = q.exp||q.explanation||'';
   if(mode==='study' || document.getElementById('q').dataset.showAns==='1'){
     extra.innerHTML='<div style="background:#052e16;border:1px solid #166534;border-radius:12px;padding:12px;margin:12px 0;color:#86efac;font-size:14px;white-space:pre-wrap"><b>✅ Answer:</b> '+ansText+(exp?'<br><br><b>📖 Exp:</b> '+exp:'')+'</div>';
     opts.innerHTML='<div style="display:flex;gap:8px"><button class="btn" style="flex:1;background:#22c55e;color:#000" onclick="markCorrect(true)">✅ I Got It</button><button class="btn" style="flex:1;background:#ef4444;color:#fff" onclick="markCorrect(false)">❌ Missed</button></div>';
   } else {
     extra.innerHTML='<div style="background:#1e1b4b;border:1px solid #3730a3;border-radius:12px;padding:12px;margin:12px 0;color:#a5b4fc;font-size:13px">👆 Tap Show to see answer</div>';
     opts.innerHTML='';
   }
 } else {
   // MCQ mode
   extra.innerHTML='';
   (q.opts||[]).forEach((o,i)=>{
     let d=document.createElement('div'); d.className='opt'; d.innerText=o;
     d.onclick=()=>{
       if(d.classList.contains('correct')||d.classList.contains('wrong')) return;
       let ok=(q.ans||0)===i; answered++;
       if(ok){d.classList.add('correct'); correct++;} else {d.classList.add('wrong'); let ce=document.querySelectorAll('.opt')[q.ans||0]; if(ce) ce.classList.add('correct');}
       updateScore(); if(mode==='blitz') clearInterval(blitzInterval);
       setTimeout(()=>{nextQ(); if(mode==='blitz') startBlitz();},800);
     };
     opts.appendChild(d);
   });
 }
}
function markCorrect(ok){
 answered++;
 if(ok) correct++;
 updateScore();
 nextQ();
 if(mode==='blitz') startBlitz();
}
function showAns(){
 let q=questions[idx];
 if(!q.opts || q.opts.length===0){
   document.getElementById('q').dataset.showAns='1';
   showQ();
 } else {
   let c=q.ans||0; let els=document.querySelectorAll('.opt'); if(els[c]) els[c].classList.add('correct');
 }
}
function nextQ(){
 document.getElementById('q').dataset.showAns='0';
 idx=(idx+1)%limit; showQ();
}

updateQCountOptionsSafe(); applyFilters();
</script></body></html>
