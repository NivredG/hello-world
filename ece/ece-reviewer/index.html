const QA_FREE=[{"q":"What law that describes the force of attraction or repulsion between two charges is directly proportional to their strengths and inversely proportional to the square of the distance between them?","a":"Coulomb’s law or law of electrostatics","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the rated lifetime of an LED?","a":"200,000 hours","topic":"Fiber","cat":"Comms","exp":"LEDs have an extremely long operational life (up to 200,000 hours), compared to approximately 1,000 hours for incandescent bulbs."},{"q":"What coaxial cable type is used for Thick Ethernet?","a":"RG-11 (50 ohm)","topic":"Networks","cat":"Comms","exp":"Thick Ethernet (10Base5) uses RG-11 or RG-8 50-ohm coaxial cable with vampire taps; RG-58 is used for Thin Ethernet (10Base2)."},{"q":"What is the typical gain for a rhombic antenna?","a":"15 to 60 dB","topic":"Antennas","cat":"Comms","exp":"Rhombic antennas are large wire antennas used for HF communication. Their gain ranges from 15-60 dB depending on the number of wavelengths per side, making them excellent for long-distance HF work."},{"q":"What is Norton's theorem?","a":"Any linear circuit can be replaced by a current source (In) in parallel with a resistance (Rn)","topic":"Misc","cat":"Comms","exp":"Norton's theorem is the current-source dual of Thevenin's; the Norton current equals the short-circuit current, and Rn = Rth."},{"q":"What characterizes synchronous data transmission?","a":"Uses unique SYN characters at the start of each message block","topic":"Networks","cat":"Comms","exp":"Synchronous transmission sends blocks of data framed by SYN characters, with continuous clocking and no gaps between characters."},{"q":"What is the bandwidth of Ultra Wideband (UWB)?","a":"500 MHz minimum bandwidth","topic":"RF","cat":"Comms","exp":"UWB is defined as having a bandwidth of at least 500 MHz or a fractional bandwidth greater than 20%, enabling high-resolution ranging and high data rates."},{"q":"What is the main advantage of DSBSC over DSBFC?","a":"No transmitter power is wasted in the carrier","topic":"RF","cat":"Comms","exp":"In double-sideband suppressed carrier (DSBSC), no power is sent in the unmodulated carrier, making it more power-efficient than DSB full carrier."},{"q":"What family of standards defines RS-232C interchange circuits?","a":"V.24 (CCITT)","topic":"Networks","cat":"Comms","exp":"V.24 defines the interchange circuits for DTE-DCE interfaces, essentially standardizing what RS-232C calls its 25-pin interface signals."},{"q":"What is the speed of sound at 25°C in sea water?","a":"1520 m/s","topic":"Acoustics","cat":"Comms","exp":"Sea water at 25°C transmits sound at ~1520 m/s. Sonar and submarine communications rely on this acoustic property."},{"q":"What is the speed of sound in steel at 1 atm?","a":"5150 m/s","topic":"Acoustics","cat":"Comms","exp":"Sound travels much faster through solids than air. Steel: ~5150 m/s, Wood: ~3300 m/s, Air at 20°C: ~343 m/s, Sea water: ~1520 m/s."},{"q":"What became CDMA 2000?","a":"IS-95","topic":"Cellular","cat":"Comms","exp":"IS-95 (cdmaOne) evolved into CDMA2000 (IS-2000), a 3G standard. CDMA2000 1xRTT provides 144 kbps and EV-DO provides up to 2.4 Mbps."},{"q":"When was the first cellular commercial system introduced?","a":"October 13, 1983","topic":"Cellular","cat":"Comms","exp":"Ameritech launched the first commercial cellular telephone network in the US in Chicago, Illinois on October 13, 1983, using the AMPS standard."},{"q":"What is the human hearing range in octaves?","a":"10","topic":"Acoustics","cat":"Comms","exp":"The human ear can perceive sounds from approximately 20 Hz to 20,000 Hz, which spans 10 octaves (each octave doubles the frequency)."},{"q":"The atomic mass of chlorine is 35.45 g. What is the root-mean-square of molecular chlorine in m/s at 31oC?","a":"327 m/s","topic":"GEAS","cat":"GEAS","exp":""},{"q":"Which class of amplifiers that is intended for pulse operation?","a":"class D","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What will happen to the channel of a JFET as current flows to it?","a":"skews","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the number of HDTV horizontal lines?","a":"1125","topic":"TV","cat":"Comms","exp":"HDTV uses 1125 total horizontal lines (1080 active), compared to NTSC's 525 lines. This provides about 5 times more picture information."},{"q":"Which class of amplifiers that has the highest efficiency?","a":"class D","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is a modem's primary function?","a":"Interfaces DTE to an analogue transmission line by modulating/demodulating signals","topic":"Networks","cat":"Comms","exp":"A modem (modulator-demodulator) converts digital DTE signals to analog for transmission over telephone lines, and reverses the process on reception."},{"q":"What is VRC in data communications?","a":"Vertical Redundancy Check — a single parity bit per character","topic":"Networks","cat":"Comms","exp":"VRC (also called parity check) adds one bit to each character to make the total number of 1s either odd or even, detecting single-bit errors."},{"q":"What is Nikola Tesla known for in electrical engineering?","a":"Invention of the AC induction motor and AC power system; the Tesla (unit of magnetic flux density) honors him","topic":"Misc","cat":"Comms","exp":"Tesla's AC polyphase system became the standard for power distribution. He also developed the Tesla coil, radio (contested), and numerous other electrical inventions."},{"q":"In CATV, what is the noise figure for mid, high, and super band channels?","a":"6 dB or better","topic":"CATV","cat":"Comms","exp":"CATV system noise figures: Sub and low bands ≤5 dB, Mid/High/Super bands ≤6 dB, UHF channels ≤9 dB. Lower noise figures mean better signal quality."},{"q":"What do you call an amplifier that is biased to class C but modulates over the same portion of the curve as if it were biased to class B?","a":"class BC","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What network topology provides the highest redundancy with no bottlenecks?","a":"Mesh topology","topic":"Networks","cat":"Comms","exp":"In a full mesh topology, every node connects directly to every other node, providing multiple redundant paths and eliminating single points of failure."},{"q":"Among the three characteristics of a transistor amplifier, which region is normally employed for linear (undistorted) amplifiers?","a":"active region","topic":"Electronics","cat":"Electronics","exp":""},{"q":"In the design of high power semiconductor devices, it involves what factors?","a":"all of the above","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the difference between a JFET and a MOSFET?","a":"all of the above","topic":"Electronics","cat":"Electronics","exp":""},{"q":"The ability of a material to resist current flow is called “resistance”. What is (are) the factor(s) that affect its value?","a":"all of these","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What compression law is used in North American telephone systems?","a":"µ-law (mu-law)","topic":"Telephone","cat":"Electronics","exp":"North America and Japan use µ-law (with µ=255) companding for PCM telephony. Europe uses A-law (A=87.6). Both give 8-bit PCM 64 kbps quality."},{"q":"What is differential PCM (DPCM)?","a":"PCM that encodes and transmits only the difference between successive samples instead of full sample values","topic":"Networks","cat":"Electronics","exp":"DPCM exploits sample-to-sample correlation in speech to reduce bit rate. The decoder accumulates differences to reconstruct the original signal."},{"q":"How does permittivity affect electric field intensity?","a":"It causes the field intensity to decrease.","topic":"Electronics","cat":"Electronics","exp":""},{"q":"Why is a geostationary satellite not stationary for regions near the poles?","a":"The angle of inclination is too low for these regions","topic":"GPS","cat":"Comms","exp":"Geostationary satellites orbit above the equator (0° inclination). Near the poles, they appear very low on the horizon (<5°), causing blockage and poor signal geometry."},{"q":"A transistor with β = 100 is connected as common base, was found to have a leakage current I = 1µA. If the transistor is configured as common emitter, what is the CBO approximate value of its I ? CEO","a":"100 µA","topic":"Electronics","cat":"Electronics","exp":""},{"q":"Which indicates the degree of change, in operating-point due to temperature variation in the dc biasing?","a":"stability factor","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What do you call the loss of electrical energy in counter balancing the residual magnetism in each cycle?","a":"coercivity","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the purpose of a squelch circuit?","a":"Prevents amplified noise from reaching the loudspeaker when no signal is present","topic":"RF","cat":"Comms","exp":"Squelch mutes the audio output when the received signal drops below a threshold, eliminating the noise heard between transmissions."},{"q":"What factors determine the capacitance of a capacitor?","a":"Area of the plates, distance between the plates, and the dielectric constant of the material between the plates","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A full 360° sine-wave signal is applied as an input to an unknown class of amplifier, if the output delivers only a pulse of less than 180°, of what class does this amplifier belongs?","a":"class C","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the method of reducing reverberation using loudspeaker feedback?","a":"Ambiophony","topic":"Acoustics","cat":"Comms","exp":"Ambiophony uses electronic feedback to artificially extend or reduce reverberation, creating ideal acoustic conditions in a room."},{"q":"A 50Ω resistor is connected in series with a 150C resistor and to a supply voltage of 20V. What is the current through the 50Ω resistor?","a":"0.1 A","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What data compression technique assigns shorter codes to the most frequent characters?","a":"Huffman encoding","topic":"Networks","cat":"Comms","exp":"Huffman coding builds a variable-length code tree based on symbol frequency, giving shorter codes to more common characters for data compression."},{"q":"When was the electric telegraph invented?","a":"1844 (Samuel Morse's first public demonstration)","topic":"Misc","cat":"Comms","exp":"Samuel Morse demonstrated the electric telegraph on May 24, 1844, sending 'What hath God wrought' from Washington D.C. to Baltimore."},{"q":"What is the principle musical interval considered dissonant?","a":"7:8 ratio","topic":"Acoustics","cat":"Comms","exp":"The ratio 7:8 represents a minor second interval, which sounds tense and dissonant. Consonant intervals include octave (1:2), perfect fifth (2:3), etc."},{"q":"Which of the following is designated as the international distress, safety and calling frequency for radio telephony for stations of the maritime mobile service when using frequencies in the authorized bands between 156 MHz and 174 MHz?","a":"156.8 MHz","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What LAN software prevents simultaneous access to data being modified?","a":"Record locking","topic":"Networks","cat":"Comms","exp":"Record locking prevents data corruption in client-server LANs. When one station modifies a record, it's locked so others can read but not simultaneously modify it."},{"q":"What is any tone produced by a sound source in addition to the fundamental tone?","a":"Overtone","topic":"Acoustics","cat":"Comms","exp":"Overtones (harmonics) are integer multiples of the fundamental frequency. They give each instrument its unique timbre."},{"q":"If atomic masses of Al and O are 26.98 amu and 16.00 amu, respectively, how many grams of Al are there in 431g of Al2O3?","a":"228 g","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the science that describes and predicts the effect on bodies at rest or in motion by forces acting on it?","a":"Engineering Mechanics","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the IMT-2000 maximum data rate for mobile users in high-speed vehicles?","a":"144 kbps","topic":"Cellular","cat":"Comms","exp":"IMT-2000 (3G) specifications: 144 kbps for fast-moving vehicles, 384 kbps for pedestrians, and over 2 Mbps for stationary/indoor users."},{"q":"When a mobile is simultaneously in the coverage area of two base stations, this is called?","a":"Soft handoff","topic":"Cellular","cat":"Comms","exp":"Soft handoff (CDMA) maintains connections to both base stations simultaneously before dropping one. TDMA/GSM uses hard handoff (break-before-make)."},{"q":"What is defined as the ratio of the change in temperature to the change in pressure when a real gas is throttled?","a":"Joule-Thomson coefficient","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the frequency one octave above middle C?","a":"524 Hz","topic":"Acoustics","cat":"Comms","exp":"One octave above middle C (262 Hz) is 524 Hz — exactly double. Each octave doubles the frequency."},{"q":"What do you call a positively charged ion?","a":"cation","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the height of GLONASS satellites?","a":"19,100 km","topic":"GPS","cat":"Comms","exp":"GLONASS satellites orbit at approximately 19,100 km altitude in 64.8° inclined orbits, slightly lower than GPS at ~20,200 km."},{"q":"A place on the terrestrial sphere has an altitude of 25o15’N. how many nautical miles is that place from the north?","a":"3, 885","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What refers to the amount of heat needed to raise the temperature of an object by one degree Celsius or 1K?","a":"Heat capacity","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the Kell factor (utilization factor) for TV vertical resolution?","a":"Approximately 0.7","topic":"TV","cat":"Comms","exp":"The Kell factor reduces effective vertical resolution to about 70% of the total line count, due to the sampling nature of the scanning process."},{"q":"What is the main disadvantage of fiber optic cable made of glass?","a":"Brittleness","topic":"Fiber","cat":"Comms","exp":"Glass fiber is fragile and can break under mechanical stress. It requires careful handling, proper strain relief, and protective jacketing to prevent breaks."},{"q":"What camera tube uses lead oxide and has minimum lag?","a":"Plumbicon","topic":"TV","cat":"Comms","exp":"The Plumbicon uses lead oxide (PbO) as its photoconductor. Its near-zero lag makes it ideal for live TV — fast motion produces no image retention/smearing."},{"q":"What is the midrange frequency region of the musical sound spectrum?","a":"256 Hz to 2048 Hz","topic":"Acoustics","cat":"Comms","exp":"The midrange covers the most critical musical frequencies where human hearing is most sensitive and instruments' fundamental tones are prominent."},{"q":"A World Series batter hits a home run ball with a velocity of 40 m/s at an angle of 268 above the horizontal. A fielder who can reach 3.0 m above the ground is backed up against the bleacher wall, which is 110 m from home plate. The ball was 120 cm above the ground when hit. How high above the fielder's glove does the ball pass?","a":"6.0 m","topic":"Uniformly Accelerated Motion","cat":"Physics","exp":"Schaum's College Physics - Uniformly Accelerated Motion"},{"q":"In what positions will a converging lens of focal length 10 cm from an image of luminous object on a screen located 50 cm from the object?","a":"13.82 cm and 36.18 cm from the object","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A converging lens of focal length 20 cm is placed 37 cm in front of a screen. At what distance that the object be placed so that its image appears on the screen?","a":"43.5 cm","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is Time Division Multiplexing (TDM)?","a":"Each information signal is allowed to use all the available bandwidth but only for a fraction of the time","topic":"Telephone","cat":"Electronics","exp":"TDM interleaves time slots from multiple channels into one transmission stream. Used in T1/E1 systems, SONET/SDH, and digital cellular."},{"q":"A 0.50-kg ball falls past a window that is 1.50 m in vertical length. (a) How much did the KE of the ball increase as it fell past the window? (b) If its speed was 3.0 m/s at the top of the window, what was its speed at the bottom?","a":"(a) 7.4 J; (b) 6.2 m/s","topic":"Projectile Motion","cat":"Physics","exp":"Schaum's College Physics - Projectile Motion"},{"q":"An object was fired at an initial velocity of 50 m/s at an inclination of 60o with the horizontal. How long did it take the object to strike the ground if it was fired at the same level with its range?","a":"8.83 sec","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What situation arises in Ethernet when two terminals transmit simultaneously?","a":"Contention","topic":"Networks","cat":"Comms","exp":"In CSMA/CD Ethernet, contention (collision) occurs when two stations transmit simultaneously. Both stop, wait a random backoff time, then retry. The listening period is 9.6 µs."},{"q":"What is the typical loudness level of a watch ticking?","a":"20 Phons","topic":"Acoustics","cat":"Comms","exp":"A ticking watch produces a very faint sound, measured at approximately 20 phons — just above the threshold of normal hearing."},{"q":"What is the oldest type of semiconductor device used in microwave frequencies?","a":"Point contact diode","topic":"RF","cat":"Comms","exp":"The point contact diode was the first semiconductor microwave device, used in crystal radio receivers and early radar systems."},{"q":"What is residual magnetism?","a":"The flux density, which exist in the iron core when the magnetic field intensity is reduced to zero.","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the envelope delay distortion reference frequency for SSB?","a":"1800 Hz","topic":"RF","cat":"Comms","exp":"Envelope delay distortion (EDD) is worst at band edges. For SSB voice channels, 1800 Hz is used as the reference frequency for EDD measurements because it's near the center of the 300-3400 Hz voice band."},{"q":"A medium unshaded lamp hangs 8 m directly above the table. To what distance should it be lowered to increase the illumination to 4.45 times its former value?","a":"3.79 m","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A pump lifts water from a lake to a large tank 20 m above the lake. How much work against gravity does the pump do as it transfers 5.0 m3 of water to the tank? One cubic meter of water has a mass of 1000 kg.","a":"9:8 \u0002 105 J","topic":"Projectile Motion","cat":"Physics","exp":"Schaum's College Physics - Projectile Motion"},{"q":"What is the Ethernet preamble for?","a":"Synchronizing the receiver clock before data arrives","topic":"Networks","cat":"Comms","exp":"Ethernet frames begin with 7 bytes of 10101010... followed by SFD byte 10101011. This allows the receiver PLL to synchronize before actual frame data arrives, preventing loss of the first data bytes."},{"q":"What is RZ (Return-to-Zero) signaling?","a":"A line code where the signal returns to zero at the end of each bit period","topic":"Networks","cat":"Electronics","exp":"RZ codes return to zero mid-bit, providing clock information embedded in the signal but requiring twice the bandwidth of NRZ for the same bit rate."},{"q":"A 12.0-g bullet is accelerated from rest to a speed of 700 m/s as it travels 20.0 cm in a gun barrel. Assuming the acceleration to be constant, how large was the accelerating force? (Be careful of units.)","a":"14.7 kN","topic":"Newton's Laws","cat":"Physics","exp":"Schaum's College Physics - Newton's Laws"},{"q":"What theorem we should use in solving electrical circuits with several voltage sources?","a":"superposition","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A 500-g wheel that has a moment of inertia of 0:015 kg \u0001 m2 is initially turning at 30 rev/s. It coasts to rest after 163 rev. How large is the torque that slowed it?","a":"0.26 N \u0001 m","topic":"Angular Motion","cat":"Physics","exp":"Schaum's College Physics - Angular Motion"},{"q":"What is the actual data rate for terrestrial digital TV (ATSC)?","a":"32.28 Mbps","topic":"TV","cat":"Board Exam","exp":"ATSC digital TV has a 19.39 Mbps net payload rate for broadcast; the total symbol rate including overhead is 32.28 Mbps over a 6 MHz channel."},{"q":"Which of the following characterizes inductance?","a":"Tends to oppose changes in current","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is a broadside array?","a":"Array of dipoles with equal spacing, same phase, connected to same source — maximum radiation perpendicular to array axis","topic":"Antennas","cat":"Comms","exp":"A broadside array has elements fed in phase, producing maximum radiation broadside (perpendicular) to the line of the array."},{"q":"How many 1kΩ resistors to be connected in parallel are needed in order to get 100Ω?","a":"10","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What does a gaussmeter measure?","a":"magnetic flux density","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the upstream signal frequency range in a two-wire CATV cable?","a":"5 to 30 MHz","topic":"CATV","cat":"Comms","exp":"CATV systems use a split-band design: upstream (subscriber-to-headend) uses 5–30 MHz, downstream uses 54–750+ MHz."},{"q":"What is the interval between going off-hook and hearing a dial tone?","a":"Dial tone delay","topic":"Telephone","cat":"Comms","exp":"Dial tone delay is the time from when a subscriber lifts the handset (goes off-hook) until the CO sends dial tone. It should be less than 3 seconds per ITU standards."},{"q":"What forces the electron beam to move slowly in a TWT?","a":"Slow wave structure","topic":"RF","cat":"Comms","exp":"The helical slow-wave structure reduces the phase velocity of the RF wave to match the electron beam velocity (~10-20% of light speed), enabling continuous energy transfer from electrons to the RF wave."},{"q":"A roller coaster is just barely moving as it goes over the top of the hill. It rolls nearly without friction down the hill and then up over a lower hill that has a radius of curvature of 15 m. How much higher must the first hill be than the second if the passengers are to exert no force on the seat as they pass over the top of the lower hill?","a":"7.5 m","topic":"Impulse and Momentum","cat":"Physics","exp":"Schaum's College Physics - Impulse and Momentum"},{"q":"In Fig. 6-8, h1  200 cm, h2  150 cm, and at A the 3.00-g bead has a downward speed along the wire of 800 cm/s. (a) How fast is the bead moving as it passes point B if friction is negligible? (b) How much energy did the bead lose to friction work if it rises to a height of 20.0 cm above C after it leaves the wire?","a":"(a) 10.2 m/s; (b) 105 mJ","topic":"Projectile Motion","cat":"Physics","exp":"Schaum's College Physics - Projectile Motion"},{"q":"What is flat-topped sampling?","a":"Sampling using a sample-and-hold circuit, giving each pulse constant amplitude for its full duration","topic":"Networks","cat":"Electronics","exp":"Flat-topped sampling creates rectangular pulses whose amplitude equals the signal at the sampling instant, simplifying digital encoding."},{"q":"What is the guardband for C-band satellite communications?","a":"4 MHz","topic":"Satellite","cat":"Comms","exp":"C-band satellite transponders are typically 36 MHz wide with 4 MHz guardbands between them, allowing 500 MHz of spectrum to accommodate 12 transponders."},{"q":"When was the telephone invented?","a":"1876 (Alexander Graham Bell)","topic":"Telephone","cat":"Comms","exp":"Alexander Graham Bell received the patent for the telephone on March 7, 1876, making the first successful voice transmission the next day."},{"q":"If a magnetic flux occurs across 100 turns at a rate of 2 Wb/sec. What is the induced voltage as per Faraday’s law?","a":"200 V","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the relative permeability of paramagnetic substance?","a":"slightly greater than 1","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What did John Ambrose Fleming invent?","a":"The vacuum tube diode (Fleming valve, 1904)","topic":"Misc","cat":"Comms","exp":"Fleming invented the thermionic diode valve, the first practical vacuum tube and the foundation of electronic amplification and radio detection."},{"q":"What is the standard pitch frequency for American Concert A?","a":"440 Hz","topic":"Acoustics","cat":"Comms","exp":"A4 (Concert A) is universally tuned to 440 Hz. This is the reference pitch used for tuning instruments."},{"q":"What is the exact frequency of the color subcarrier signal?","a":"3.579545 MHz","topic":"TV","cat":"Comms","exp":"The NTSC color subcarrier is precisely 3.579545 MHz. This specific frequency was chosen to minimize visible interference between the chroma signal and other TV signals."},{"q":"How do you classify an amplifier used to amplify either amplitude modulated (AM) or frequency modulated (FM) signals?","a":"class S","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the approximate height of a GEO satellite (from Kepler's law)?","a":"35,790 km above Earth's surface","topic":"Satellite","cat":"Board Exam","exp":"Using Kepler's third law with a 24-hour period, the GEO orbit radius is 42,164 km from Earth's center, giving an altitude of ~35,786 km above the surface."},{"q":"How much more information does HDTV contain compared to NTSC?","a":"Approximately 5 times more information","topic":"TV","cat":"Comms","exp":"HDTV has about 5 times the picture information of NTSC, due to higher resolution (1080 or 720 lines vs 480) and widescreen format."},{"q":"Determine which statement is true?","a":"The current carriers in conductors are valence electrons.","topic":"Electronics","cat":"Electronics","exp":""},{"q":"Which pulse in V blanking corresponds to 3H lines wide?","a":"V sync","topic":"TV","cat":"Comms","exp":"The vertical sync pulse occupies exactly 3 horizontal line periods (3H). This wide pulse distinguishes it from equalizing pulses (H/2) during vertical blanking."},{"q":"At what temperature should a crystal microphone not be used?","a":"Above 52°C","topic":"Acoustics","cat":"Comms","exp":"Crystal microphones use piezoelectric crystals that can be damaged or depolarized by heat above approximately 52°C (125°F)."},{"q":"What is the SCA subcarrier frequency in FM broadcasting?","a":"67 kHz (background music/subsidiary services)","topic":"RF","cat":"Comms","exp":"The 67 kHz SCA (Subsidiary Communications Authorization) subcarrier carries auxiliary services like store music or reading services for the visually impaired."},{"q":"What OSI layer handles interhost communications?","a":"Session layer (Layer 5)","topic":"Networks","cat":"Comms","exp":"The Session layer establishes, manages, and terminates sessions between applications on different hosts, including synchronization and dialog control."},{"q":"What is the cut-off frequency of the standard FM pre-emphasis/de-emphasis network?","a":"2122 Hz","topic":"RF","cat":"Comms","exp":"The 75 µs time constant used in North American FM corresponds to a cut-off frequency of 1/(2π×75×10⁻⁶) ≈ 2122 Hz."},{"q":"What digital modulation does SPADE (satellite) use?","a":"QPSK","topic":"Satellite","cat":"Board Exam","exp":"SPADE (Single channel Per carrier, Demand-Assigned, multiple-access Equipment) uses QPSK modulation for efficient use of satellite bandwidth."},{"q":"What refers to a series of tones that sounds good when used in combination?","a":"Musical scale","topic":"Acoustics","cat":"Comms","exp":"A musical scale is a set of pitches in ascending or descending order. The diatonic scale is full of consonant tones."},{"q":"A car moving at 5.0 m/s tries to round a corner in a circular arc of 8.0 m radius. The roadway is ¯at. How large must the coecient of friction be between wheels and roadway if the car is not to skid?","a":"0.32","topic":"Impulse and Momentum","cat":"Physics","exp":"Schaum's College Physics - Impulse and Momentum"},{"q":"If the sum of P12 000 is deposited in an account earning interest at a rate of 9% compounded quarterly, what will it become at the end of 8 years?","a":"P24, 457.24","topic":"GEAS","cat":"GEAS","exp":""},{"q":"How much impurity concentration is needed for a sample of silicon to change its electrical property from a poor conductor to a good conductor?","a":"one part per million","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the aural carrier frequency of NTSC UHF TV channel 28?","a":"559.75 MHz","topic":"TV","cat":"Board Exam","exp":"UHF TV channel 28 occupies 554–560 MHz. The picture carrier is at 555.25 MHz; the aural (sound) carrier is 4.5 MHz higher at 559.75 MHz."},{"q":"What states that the net mass transfer to or from a system during a process is equal to the net change in the total mass of the system during that process?","a":"Conservation of mass principle","topic":"GEAS","cat":"GEAS","exp":""},{"q":"How is dynamic convergence adjusted in a color CRT?","a":"By varying the current through convergence coils (electromagnets)","topic":"TV","cat":"Comms","exp":"Dynamic convergence corrects beam convergence across the entire screen using coils fed with correction waveforms synchronized to the scan."},{"q":"What is a quadrature detector used for in TV?","a":"FM detection (demodulation of the audio carrier in TV receivers)","topic":"TV","cat":"Comms","exp":"The quadrature detector is widely used for demodulating the 4.5 MHz FM audio carrier in TV receivers; it compares the signal with a 90° phase-shifted version."},{"q":"A silicon material has an intrinsic concentration n=1010 per cubic centimeter at room i temperature. If it is doped with 1015 antimony atoms per cubic centimeter, what is now the approximate electron concentration at the conduction band?","a":"1015 electrons","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the time required to complete one horizontal scanning line in NTSC?","a":"63.6 microseconds","topic":"TV","cat":"Comms","exp":"NTSC has 525 lines per frame at 30 fps, so each line takes 1/(525×30) ≈ 63.5 µs, including blanking."},{"q":"What is the value of a resistor with colors from left: Orange, Blue, Gold, and Silver?","a":"3.6 ohms ± 10%","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the maximum deviation of cellular radios that use FM?","a":"±12 kHz","topic":"Cellular","cat":"Comms","exp":"AMPS cellular uses FM with ±12 kHz maximum deviation on 30 kHz channel spacing. The 10 kHz supervisory tone is used for handoff signaling."},{"q":"What is the amount of sound attenuation offered by a wall, ceiling, or floor?","a":"Transmission loss","topic":"Acoustics","cat":"Comms","exp":"Transmission Loss (TL) measures how much a barrier reduces sound. Heavy, dense materials provide greater transmission loss."},{"q":"What is the term for ordinary telephone?","a":"POTS (Plain Old Telephone System)","topic":"Telephone","cat":"Comms","exp":"POTS refers to the traditional analog telephone system using the public switched telephone network (PSTN). It has been largely replaced by VoIP and digital systems, but the term is still used."},{"q":"What is the front porch in a TV composite video signal?","a":"The brief blanking interval between the end of active video and the horizontal sync pulse","topic":"TV","cat":"Comms","exp":"The front porch is a short black level period before the sync pulse, ensuring the sync tip is clearly distinguishable from the video content."},{"q":"What is lowers the operating temperature of receivers to reduce noise levels?","a":"Cryogenic cooling","topic":"RF","cat":"Comms","exp":"Cryogenic cooling (liquid helium, ~4K) reduces thermal noise in amplifiers to near zero, giving noise figures below 0.1 dB. Used in radio telescopes and satellite ground stations for maximum sensitivity."},{"q":"What is the 10BaseT Ethernet system restricted to?","a":"100 m","topic":"Networks","cat":"Comms","exp":"10BaseT (twisted pair Ethernet) has a maximum segment length of 100 meters between station and hub/switch. This is due to signal attenuation and CSMA/CD timing requirements."},{"q":"What is the spacing between M88 loading coils on telephone cables?","a":"9000 feet (approximately 2.75 km)","topic":"Telephone","cat":"Comms","exp":"M88 loading coils (88 mH inductance) are placed at 9000 ft intervals on telephone cables to improve voice frequency transmission by reducing attenuation."},{"q":"What is aliasing (foldover distortion)?","a":"Distortion caused by sampling at a rate lower than twice the highest signal frequency","topic":"Networks","cat":"Electronics","exp":"Aliasing occurs when sampling rate < 2 × fmax; the undersampled high frequencies 'fold over' and appear as low-frequency distortion in the recovered signal."},{"q":"What is the SI unit of pressure?","a":"Pa","topic":"GEAS","cat":"GEAS","exp":""},{"q":"Which is NOT an extensive property of thermodynamics?","a":"Density","topic":"GEAS","cat":"GEAS","exp":""},{"q":"Which amplifiers can be used for linear amplification?","a":"class A or B","topic":"Electronics","cat":"Electronics","exp":""},{"q":"Which of the following refers to the gain of a circuit?","a":"The ratio of the output quantity to input quantity of an amplifier.","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the duration of the horizontal blanking pulse in NTSC?","a":"10.2 microseconds","topic":"TV","cat":"Comms","exp":"The NTSC horizontal blanking interval is 10.2 µs out of a total 63.5 µs line period, blanking the electron beam during horizontal retrace."},{"q":"What is MPEG-2 primarily used for?","a":"Digital broadcast TV (DVD, satellite TV, cable TV) using cosine transform compression","topic":"Networks","cat":"Electronics","exp":"MPEG-2 (ISO 13818) uses the discrete cosine transform for video compression, achieving HDTV quality at 15-20 Mbps. It is the standard for DVD and most broadcast digital TV."},{"q":"Which coaxial connector is more complex but better maintains electrical characteristics?","a":"N-type connector","topic":"Antennas","cat":"Comms","exp":"Type N connectors (named after Paul Neill) are precision RF connectors rated to 18 GHz. They maintain 50 Ω impedance through the connection, unlike cheaper BNC connectors."},{"q":"What accessory is referred to as a magic T?","a":"Hybrid T","topic":"Antennas","cat":"Comms","exp":"A Hybrid T (Magic T) is a waveguide junction that splits power equally between two ports while isolating them from each other. It's used in balanced mixers and duplexers."},{"q":"What system does NOT use TDMA?","a":"IS-95","topic":"Cellular","cat":"Comms","exp":"IS-95 (cdmaOne) uses CDMA (Code Division Multiple Access), where all users share the same frequency simultaneously but with unique PN codes. GSM uses TDMA."},{"q":"A train changes its speed uniformly from 60 mph to 30 mph in a distance of 1500 ft. What is its acceleration?","a":"– 1.94d ft/s2","topic":"GEAS","cat":"GEAS","exp":""},{"q":"An engine expends 40.0 hp in propelling a car along a level track at 15.0 m/s. How large is the total retarding force acting on the car?","a":"1.99 kN","topic":"Projectile Motion","cat":"Physics","exp":"Schaum's College Physics - Projectile Motion"},{"q":"the motion of a body?","a":"Vector diagram","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A pendulum 80.0 cm long is pulled to the side, so that its bob is raised 20.0 cm from its lowest position, and is then released. As the 50.0 g bob moves through its lowest position, (a) what is its speed and (b) what is the tension in the pendulum cord?","a":"(a) 1.98 m/s; (b) 0.735 N","topic":"Impulse and Momentum","cat":"Physics","exp":"Schaum's College Physics - Impulse and Momentum"},{"q":"What type of amplifier commonly used at the output stage of op-amps?","a":"complementary amplifier","topic":"Electronics","cat":"Electronics","exp":""},{"q":"In CATV system, what is the sound section isolation?","a":"40 dB","topic":"CATV","cat":"Comms","exp":"Sound section isolation in CATV refers to the separation between the audio carrier and video carrier. 40 dB prevents audio from cross-modulating the video signal."},{"q":"What is the common IF frequency for satellite up/down converters?","a":"70 MHz","topic":"Satellite","cat":"Board Exam","exp":"70 MHz is the standard intermediate frequency for satellite earth station up/down converters, allowing standardized IF equipment to work with different RF frequency bands."},{"q":"What is a rhombic antenna?","a":"A travelling wave antenna in the shape of a rhombus (diamond), used for HF communications","topic":"Antennas","cat":"Comms","exp":"The rhombic is a large fixed-direction travelling wave antenna offering high gain over a wide frequency range, historically used for HF long-distance links."},{"q":"What packets switched data technique is used with GSM systems?","a":"GPRS","topic":"Cellular","cat":"Comms","exp":"GPRS adds packet-switching capability to GSM's circuit-switched voice network. Data is sent in packets over unused voice time slots, enabling efficient data transmission."},{"q":"What spread-spectrum technique does Bluetooth use?","a":"Frequency hopping (FHSS) — hops 1600 times per second across 79 channels","topic":"Networks","cat":"Board Exam","exp":"Bluetooth uses FHSS in the 2.4 GHz ISM band, rapidly hopping between 79 channels to minimize interference with other devices and improve security."},{"q":"What will be the current equation in a series RC network if supplied with v = V sin120πt m source. The circuit has a power factor pf = 0.5?","a":"i = I sin(120πt + 60) max","topic":"Electronics","cat":"Electronics","exp":""},{"q":"If two micro-farad capacitors are connected in series, what will be the total effective capacitance?","a":"0.125 microfarad","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A 7.00-g bullet moving horizontally at 200 m/s strikes and passes through a 150-g tin can sitting on a post. Just after impact, the can has a horizontal speed of 180 cm/s. What was the bullet's speed after leaving the can?","a":"161 m/s","topic":"Work, Energy, and Power","cat":"Physics","exp":"Schaum's College Physics - Work, Energy, and Power"},{"q":"A box rests at a point 2.0 m from the axis of a horizontal circular platform. The coecient of static friction between box and platform is 0.25. As the rate of rotation of the platform is slowly increased from zero, at what angular speed will the box first slide?","a":"1.1 rad/s","topic":"Impulse and Momentum","cat":"Physics","exp":"Schaum's College Physics - Impulse and Momentum"},{"q":"A shunt resistor is used to limit the load current to 0.5 A, if the load resistance is 100Ω and the original current is 1amp, what should be the value of the shunt resistance?","a":"100Ω","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is a Hertz antenna?","a":"An antenna that is not connected to ground (ungrounded/elevated dipole)","topic":"Antennas","cat":"Comms","exp":"A Hertz (or Hertzian) antenna is a half-wave dipole that does not require a ground connection, unlike the Marconi antenna."},{"q":"A string wound on the rim of a wheel 20 cm in diameter is pulled out at a rate of 75 cm/s. Through how many revolutions will the wheel have turned by the time that 9.0 m of string has been unwound? How long will it take?","a":"14 rev, 12 s","topic":"Impulse and Momentum","cat":"Physics","exp":"Schaum's College Physics - Impulse and Momentum"},{"q":"How many electrical degrees a current will lead the voltage in a series RC load with R = 100 Ω and X = 50 Ω? C","a":"26.56°","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is a comb filter used for in TV?","a":"To cancel chroma crosstalk","topic":"TV","cat":"Comms","exp":"A comb filter separates luminance (Y) and chrominance (C) signals by exploiting the 3.58 MHz subcarrier's comb-like spectrum. It eliminates cross-color and cross-luminance artifacts."},{"q":"What is the typical velocity factor of non-foam 50/75 ohm coaxial cable?","a":"0.66","topic":"RF","cat":"Comms","exp":"Solid polyethylene dielectric coax has a velocity factor of about 0.66, meaning signals travel at 66% of the speed of light."},{"q":"Which of the following describes the action of a capacitor?","a":"Stores electrical energy","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the typical range of velocity factor in a coaxial cable?","a":"0.6 to 0.8","topic":"Antennas","cat":"Comms","exp":"Velocity factor = signal speed/speed of light. Solid polyethylene: ~0.66, foam polyethylene: ~0.78-0.82, PTFE: ~0.70. This factor matters for cut-length antennas and delay lines."},{"q":"At what angle does an alternating voltage of cosine-waveform reaches its negative peak?","a":"180°","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What instrument is used to measure atmospheric pressure?","a":"Barometer","topic":"GEAS","cat":"GEAS","exp":""},{"q":"At forward bias condition, what will happen to the diode resistance when the applied voltage is increased?","a":"will decrease","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is lossy data compression?","a":"Compression that allows some reduction in signal quality to achieve higher compression ratios","topic":"Networks","cat":"Electronics","exp":"Lossy compression (JPEG, MP3, voice codecs) removes perceptually less-important information. It achieves much higher ratios than lossless but cannot recover original exactly."},{"q":"How many wire pairs are needed for Gigabit Ethernet?","a":"4 pairs (all 4 pairs of Cat5e/Cat6 cable)","topic":"Networks","cat":"Comms","exp":"1000Base-T Gigabit Ethernet uses all 4 pairs of twisted-pair cable simultaneously for full-duplex transmission, unlike 100Base-TX which uses only 2 pairs."},{"q":"What is the maximum output voltage swing of an op-amp?","a":"+VSAT to -VSAT","topic":"Electronics","cat":"Electronics","exp":""},{"q":"If the base-emitter junction is reverse biased and the base-collector junction is forward biased, the transistor will be at what region of operation?","a":"cut-off region","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the TDMA frame size for D-AMPS?","a":"1944 bits","topic":"Cellular","cat":"Comms","exp":"D-AMPS TDMA frames are 1944 bits long, divided into 6 time slots of 324 bits each. Three users share one 30 kHz channel (3× capacity increase over AMPS)."},{"q":"What capacitance is significant when the diode is forward biased?","a":"diffusion capacitance or storage capacitance","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the stop bit logic level in asynchronous serial transmission?","a":"Logic 1 (mark)","topic":"Networks","cat":"Comms","exp":"The stop bit is always logic 1 (mark), returning the line to idle state between characters and ensuring the start bit (logic 0) of the next character is detectable."},{"q":"What is the law whereby the force of attraction and repulsion between poles is inversely proportional to the square of the distance between them?","a":"Coulomb’s second law","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A neutron star is formed when an object such as our Sun collapses. Suppose a uniform spherical star of mass M and radius R collapses to a uniform sphere of radius 10 5 R. If the original star has a rotation rate of 1 rev each 25 days (as does the Sun), what will be the rotation rate of the neutron star?","a":"5 \u0002 103 rev/s","topic":"Angular Motion","cat":"Physics","exp":"Schaum's College Physics - Angular Motion"},{"q":"What do you call the quantity of magnetism retained by a magnetic material after the withdrawal of a magnetizing force?","a":"Residual magnetism","topic":"Electronics","cat":"Electronics","exp":""},{"q":"In semiconductor application, which of the following statement is not true?","a":"An ohmmeter test across the base-collector of a transistor should show low resistance for both polarities.","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What do you call the phenomenon whereby substance attracts pieces of iron?","a":"Magnetism","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the approximate critical frequency of the F2 layer?","a":"8 MHz","topic":"GPS","cat":"Comms","exp":"The F2 layer (highest ionospheric layer) has a critical frequency of about 8 MHz. Signals below this frequency are reflected back; above it, they pass through. The MUF is about 3× the critical frequency."},{"q":"What is the USSR-developed high-power microwave oscillator?","a":"Gyrotron","topic":"RF","cat":"Comms","exp":"A gyrotron uses cyclotron resonance to generate millimeter-wave radiation at very high power (megawatts). Developed in the USSR, it's used for plasma heating in fusion research reactors."},{"q":"What frequency band do satellites use with 14–17 GHz uplink and 17–20 GHz downlink?","a":"Ka band","topic":"Satellite","cat":"Board Exam","exp":"Ka band (26.5–40 GHz) satellites use approximately 28–30 GHz uplink and 18–20 GHz downlink. Higher frequencies allow smaller antennas and higher data rates."},{"q":"In 1784, who demonstrated that the force between charges is inversely related to the square of the distance between them?","a":"Coulomb","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the maximum VF tone level that may be fed into a voice signal?","a":"+6 dBm","topic":"RF","cat":"Comms","exp":"The maximum volume of tone placed on a voice channel is +6 dBm (VU). Exceeding this causes clipping and distortion. Normal speech averages around -15 to -10 dBm on the telephone network."},{"q":"What is the law whereby the force of attraction or repulsion between poles is inversely proportional to the square of the distance between them?","a":"Coulomb’s second law","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the prime time block for FM radio in Metro Manila?","a":"6:00 AM to 8 PM","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What refers to the listing of the date and time events, programs, equipment, test, malfunctions and corrections in communication system?","a":"Log","topic":"GEAS","cat":"GEAS","exp":""},{"q":"How many number of atoms are there in 1.32 x 10^3 g of Lead (Pb)? Pb atomic mass is 207.7g.","a":"3.84 x 10^24 atoms","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the dielectric constant of polyethylene insulator?","a":"2.27","topic":"Antennas","cat":"Comms","exp":"Polyethylene has a relative permittivity (dielectric constant) of 2.27, giving it a velocity factor of about 1/√2.27 ≈ 0.664 in coaxial cable, affecting signal propagation speed."},{"q":"What is an Ionosonde used for?","a":"Measures virtual height of the ionosphere","topic":"GPS","cat":"Comms","exp":"An ionosonde transmits swept-frequency radio pulses upward and measures the return time. The frequency at which pulses stop returning gives the critical frequency; return time gives the virtual height of each ionospheric layer."},{"q":"What is the location of a celestial body in space called?","a":"Ephemeris","topic":"GPS","cat":"Comms","exp":"Ephemeris data describes a satellite's precise orbital parameters at a given time. GPS receivers download current ephemeris data from satellites to calculate exact satellite positions for accurate ranging."},{"q":"What is the inclination of GLONASS satellite orbits?","a":"64.8 degrees","topic":"GPS","cat":"Comms","exp":"GLONASS satellites orbit at 64.8° inclination compared to GPS at 55°, giving GLONASS better coverage at high latitudes (like Russia)."},{"q":"What is a diplexer used for in a TV antenna system?","a":"Prevents FM broadcast signals from entering the TV receiver","topic":"TV","cat":"Comms","exp":"A diplexer separates UHF and VHF TV signals while also blocking FM signals (88-108 MHz) from interfering with VHF TV channels."},{"q":"What is AFC in radio receivers?","a":"Automatic Frequency Control — feedback system to correct frequency drift in VHF/UHF/microwave receivers","topic":"RF","cat":"Comms","exp":"AFC uses a frequency discriminator output to generate a control voltage that keeps the local oscillator on frequency, preventing drift."},{"q":"What form of energy refers to those a system possesses as a whole with respect to some outside reference frame, such as potential and kinetic energies?","a":"Macroscopic form of energy","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the first note of the musical scale called?","a":"Root note","topic":"Acoustics","cat":"Comms","exp":"The root note (tonic) is the starting pitch of a scale. For example, C is the root of the C major scale."},{"q":"What is a balun used for?","a":"To connect coaxial cable (unbalanced) to a balanced parallel wire transmission line","topic":"Antennas","cat":"Comms","exp":"A balun (balanced-unbalanced transformer) matches coaxial feed lines to balanced antennas like dipoles, preventing pattern distortion."},{"q":"What is the cause of a minimum Q on a single-tuned LC circuit?","a":"increased shunt resistor","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A gun is shot into a 0.50 kN block which is hanging from a rope of 1.8 m long. The weight of the bullet is equal to 5 N with a muzzle velocity of 320 m/s. How high will the block swing after it was hit by the bullet?","a":"0.51 m","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is a 100 Mbps LAN signaling standard using fiber optics?","a":"FDDI (Fiber Distributed Data Interface)","topic":"Networks","cat":"Comms","exp":"FDDI uses token-ring topology over dual fiber rings at 100 Mbps. It also runs on coaxial cable. Designed for campus backbone networks before Gigabit Ethernet displaced it."},{"q":"What is blank and burst in AMPS cellular?","a":"Interrupting voice to send digital control signals","topic":"Cellular","cat":"Comms","exp":"AMPS blank-and-burst briefly mutes the voice channel to transmit digital control messages such as handoff orders and power control commands. The interruption lasts only milliseconds - completely inaudible to the user."},{"q":"What is Ohm's Law named after?","a":"Georg Simon Ohm, who described the relationship V = IR","topic":"Misc","cat":"Comms","exp":"Ohm's Law (V = IR) states that voltage equals current times resistance, the fundamental relationship in circuit analysis."},{"q":"What refers to a slender member which prevents parts of a structure moving towards each other under compressive force?","a":"Strut","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What statement of the second law of thermodynamics states that it is impossible to build a device that operates in a cycle and produces no effect other than the transfer of heat from a lower-temperature body to a higher-temperature body?","a":"Clausius statement","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the area above a vertical antenna with no radiation?","a":"Curve of silence (null overhead)","topic":"Antennas","cat":"Comms","exp":"Vertical antennas have a null directly overhead (90° elevation). Aircraft flying overhead may lose contact — this dead zone is the curve of silence."},{"q":"What refers to the amount of heat removed from the cooled space in BTS’s for 1 watt-hour of electricity consumed?","a":"Energy efficiency rating","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is a plug-in circuit board containing hardware and firmware to connect a computer to a LAN?","a":"Network Interface Card (NIC)","topic":"Networks","cat":"Comms","exp":"The NIC (network adapter) handles all physical layer functions: framing, encoding, CSMA/CD, and media access. It contains both BNC (coax) and RJ-45 (twisted pair) connectors."},{"q":"How will you minimize the output offset voltage due to the input offset current of an op- amp?","a":"by installing a bias-current-compensating resistor","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is perigee in satellite orbit?","a":"The point in a satellite's orbit closest to Earth","topic":"Satellite","cat":"Comms","exp":"Perigee is the orbit's closest point to Earth; apogee is the farthest. Satellite speed is greatest at perigee."},{"q":"Absolutely, when can we say that the circuit is at resonance?","a":"when the voltage and current are in-phase","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the amount of heat needed to turn 1kg of the substance at its boiling point from the liquid to the gaseous state?","a":"Heat of vaporation","topic":"GEAS","cat":"GEAS","exp":""},{"q":"The acceleration due to gravity on the moon is 1.67m/s2. If an astronaut can throw a ball 10 m straight upward on earth, how high should this man be able to throw the ball on the moon? Assume that the throwing speeds are the same in the two cases.","a":"58.67","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What allows one antenna to be used for reception and transmission without mutual interference?","a":"Duplexer","topic":"Antennas","cat":"Comms","exp":"A duplexer connects both transmitter and receiver to a single antenna. It uses filters to isolate Tx from Rx, preventing Tx power from damaging the Rx front end."},{"q":"What logical state is the start bit in asynchronous serial transmission?","a":"Logic 0 (space)","topic":"Networks","cat":"Comms","exp":"In async serial, the line idles at logic 1 (mark). A start bit is always logic 0, signaling the beginning of a character transmission."},{"q":"In statistics, the standard deviation means?","a":"Dispersion","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A marble, rolling with speed 20 cm/s, rolls o the edge of a table that is 80 cm high. (a) How long does it take to drop to the ¯oor? (b) How far, horizontally, from the table edge does the marble strike the ¯oor?","a":"(a) 0.40 s; (b) 8.1 cm","topic":"Uniformly Accelerated Motion","cat":"Physics","exp":"Schaum's College Physics - Uniformly Accelerated Motion"},{"q":"What utilizes electrical energy in electrical circuits?","a":"load","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is Celotex used for in acoustics?","a":"High sound absorption material","topic":"Acoustics","cat":"Comms","exp":"Celotex fiberboard (made from sugarcane bagasse) provides good broadband sound absorption due to its porous fiber structure. Used in recording studios and acoustic treatment as an environmentally friendly, cost-effective absorber."},{"q":"A magnifying glass has a lens with an index of refraction 5.4 and radii of curvature of 2.95 feet and 4.27 feet for the two faces. What is the magnification of the lens when it is held 2.36 inches from an object being viewed?","a":"1.98","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the sonic time pattern called?","a":"Rhythm","topic":"Acoustics","cat":"Comms","exp":"Rhythm refers to the pattern of sounds and silences in music — the temporal organization of beats and accents."},{"q":"What is Cheapernet?","a":"Another name for Thin Ethernet (10Base2, uses RG-58 coax)","topic":"Networks","cat":"Comms","exp":"Cheapernet or Thin Ethernet uses 50-ohm RG-58 coaxial cable with BNC connectors, cheaper and less rigid than thick Ethernet (Thicknet)."},{"q":"What law created the national council for the promotion of E-Commerce in the country?","a":"E. O. 468","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is an optoacoustic transducer?","a":"A device that converts light energy into sound","topic":"Acoustics","cat":"Comms","exp":"Optoacoustic (photoacoustic) transducers use light absorption to generate acoustic waves, used in medical imaging and gas sensing."},{"q":"What is the wavelength of 30 MHz radio waves?","a":"10 meters","topic":"RF","cat":"Board Exam","exp":"λ = c/f = 3×10⁸/30×10⁶ = 10 meters. 30 MHz is in the HF band (high frequency), useful for long-distance ionospheric propagation."},{"q":"What is Alternate Mark Inversion (AMI)?","a":"A bipolar line code where 1s alternate between positive and negative polarity, and 0s are zero volts","topic":"Networks","cat":"Electronics","exp":"AMI eliminates DC components and provides error detection (a violation occurs if two consecutive marks have the same polarity). Used in T1 transmission."},{"q":"What is companding?","a":"Combination of compression at the transmitter and expansion at the receiver to improve SNR for low-level signals","topic":"Telephone","cat":"Electronics","exp":"Companding (compress + expand) protects small signals from quantizing noise by applying more gain to weak signals before encoding and less after decoding."},{"q":"What is the resonant frequency of a circuit when L of 3 microhenry and C of 40 picofarad are in series?","a":"14.5 MHz","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What do you call materials, which possess very high permeabilities?","a":"ferromagnetic","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is lossless data compression?","a":"Compression that reduces bit rate without any loss of data quality, using redundancy elimination","topic":"Networks","cat":"Electronics","exp":"Lossless compression (ZIP, PNG, Huffman coding) perfectly reconstructs original data. Compression ratios are typically 2:1 to 5:1."},{"q":"In semiconductor materials, electrons have a higher value of mobility than holes, but which semiconductor material has the slowest electron-mobility?","a":"AlP","topic":"Electronics","cat":"Electronics","exp":""},{"q":"Why do most long-distance fiber systems use 1550 nm wavelength?","a":"Because the loss in glass fiber is lowest at approximately 1550 nm","topic":"Fiber","cat":"Comms","exp":"Silica glass fiber has minimum attenuation (~0.2 dB/km) at 1550 nm. Erbium-doped fiber amplifiers (EDFA) also operate in this window, making it ideal for long-haul transmission."},{"q":"What will happen to a parallel ac-circuit if its line frequency is more than the resonant frequency?","a":"becomes capacitive","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A train blowing its whistle at 750 Hz approaches a station at the rate of 35mph. What frequency is heard by a man standing at the station considering the velocity of sound in air 1100 ft/s?","a":"786.7 Hz","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the maximum data rate achievable in a fiber optic system?","a":"Up to 10 Gbps (per wavelength; much higher with WDM)","topic":"Fiber","cat":"Comms","exp":"Single-channel fiber supports 10 Gbps+; with wavelength-division multiplexing (WDM), aggregate rates of terabits per second are achievable."},{"q":"A 50 watt incandescent lamp has a mean spherical luminous intensity of 66.5 candelas. Compute the total luminous flux radiated by the lamp?","a":"842 lm","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What does MP3 stand for?","a":"MPEG-1 Audio Layer 3 (Motion Picture Experts Group 1, Audio Layer 3)","topic":"Networks","cat":"Board Exam","exp":"MP3 is a lossy audio compression format that reduces file size by ~90% by removing sounds the human ear is less sensitive to, based on psychoacoustic models."},{"q":"What is the NTSC TV vertical field rate?","a":"60 Hz (fields per second)","topic":"TV","cat":"Board Exam","exp":"NTSC uses 60 fields/second (two interlaced fields make one 30 fps frame). This 60 Hz was chosen to match the North American power line frequency."},{"q":"What type of absorption loss in optical fiber is caused by valence electrons in silica?","a":"Ultraviolet absorption","topic":"Fiber","cat":"Comms","exp":"UV absorption occurs when photons excite electrons in silica, causing signal attenuation at shorter wavelengths."},{"q":"Why can LORAN C not provide bearing information?","a":"LORAN C is a hyperbolic system giving position only, not a directional bearing system","topic":"GPS","cat":"Comms","exp":"LORAN-C provides location by measuring time differences of signals from multiple stations; it cannot provide bearing like VOR or TACAN."},{"q":"A network has a true power and a reactive power of 2400 W and 3200 W respectively. What is its apparent power?","a":"4000 W","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What law states that it is impossible to build a device that operates in a cycle and produces no effect other than the transfer of heat from a lower-temperature body to a higher-temperature body?","a":"Second law of thermodynamics","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A piano string with a length of 1.17 m and a mass of 21.0 g in under tension of 6.4 x 103 N, what is the fundamental frequency?","a":"255 Hz","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A horizontal cord 5 m long has a mass of 2.5 grams. What must be the tension in the cord if the wavelength of a 120 Hz wave on it is to be 50 cm?","a":"1.80 N","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A ball was dropped into a hard court from a height of 10 m. If the coefficient of restitution is 0.95, what height it will attain on its 5th bounce?","a":"6 m","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the maximum diameter formula for a fiber optic cable?","a":"rmax = 0.383λ (where λ is wavelength)","topic":"Fiber","cat":"Comms","exp":"The maximum core radius for single-mode operation is given by rmax = 0.383λ/NA, ensuring only one propagation mode is supported."},{"q":"What law created the Videogram Regulatory Board (VRB)?","a":"P. D. 1987","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What antenna property is proportional to antenna gain?","a":"Capture area (effective aperture)","topic":"Antennas","cat":"Comms","exp":"The effective aperture or capture area of an antenna is directly proportional to its gain, meaning high-gain antennas intercept more signal."},{"q":"How many holes does the shadow mask of a color CRT have?","a":"Approximately 300,000 holes","topic":"TV","cat":"Comms","exp":"The shadow mask is a thin metal plate with ~300,000 tiny holes positioned so each electron beam can only hit its correct color phosphor dot."},{"q":"Which material has the least number of valence electrons?","a":"conductor","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the speech coding rate of D-AMPS?","a":"8 kbps","topic":"Cellular","cat":"Comms","exp":"D-AMPS (IS-136) uses VSELP (Vector-Sum Excited Linear Prediction) codec at 8 kbps. This is half of GSM's 13 kbps, fitting 3 calls into one 30 kHz AMPS channel."},{"q":"A light bulb is used to light a bunker 10 ft below. A chair sits on the floor of the bunker 3 feet from a spot directly below the bulb. What is the illumination on the floor around the chair if the luminous intensity is 150 candles?","a":"1.38 footcandles","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is VDSL speed?","a":"52 Mbps downstream 2.3 Mbps upstream","topic":"Networks","cat":"Comms","exp":"VDSL achieves 52 Mbps downstream over copper loops shorter than 300 meters. Used in FTTN (fiber-to-the-node) deployments. VDSL2 reaches 100+ Mbps symmetrically. Asymmetry reflects typical internet usage patterns."},{"q":"What will happen to the power handling capability of the diode if it is to be operated at a higher temperature?","a":"decreases","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the typical output power of a standard klystron?","a":"10 MW","topic":"RF","cat":"Comms","exp":"High-power klystrons used in particle accelerators and radar systems can produce 10 MW or more of pulsed microwave power. Continuous wave (CW) klystrons for satellite uplinks produce kilowatts."},{"q":"What is the extremely large amount of energy associated with the strong bonds within the nucleus of the atom itself called?","a":"Nuclear energy","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the NE602 IC used for?","a":"A differential amplifier with on-chip oscillator, used as an RF mixer/oscillator","topic":"RF","cat":"Comms","exp":"The NE602 (SA602) is a double-balanced mixer with an internal oscillator, popular for frequency conversion in radio receivers."},{"q":"What is CDMA2000?","a":"3G evolution of IS-95 CDMA","topic":"Cellular","cat":"Comms","exp":"CDMA2000 evolved from IS-95 cdmaOne. 1xRTT provides 153 kbps. EV-DO Rev A provides 3.1 Mbps download. Used by Verizon and Sprint in the US before migration to 4G LTE. Same 1.25 MHz channel as IS-95."},{"q":"Why is the resistance of a conductor different for RF current than for DC?","a":"Because of skin effect","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A tennis ball is dropped into a cement floor from a height of 2 m. It rebounds to a height of 1.8 m. What fraction of energy did it lose in the process of striking the floor?","a":"One-tenth","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A hose lying on the ground shoots a stream of water upward at an angle of 408 to the horizontal. The speed of the water is 20 m/s as it leaves the hose. How high up will it strike a wall which is 8.0 m away?","a":"5.4 m","topic":"Uniformly Accelerated Motion","cat":"Physics","exp":"Schaum's College Physics - Uniformly Accelerated Motion"},{"q":"What is Tinnitus caused by?","a":"Exposure to high levels of noise","topic":"Safety","cat":"Comms","exp":"Tinnitus (ringing ears) results from noise-induced damage to cochlear hair cells above 85 dB SPL. Damaged cells fire spontaneously, creating perceived sound. Affects over 750 million people globally and is generally irreversible."},{"q":"What is the disadvantage of plastic fiber over glass fiber?","a":"Much higher attenuation (losses)","topic":"Fiber","cat":"Comms","exp":"Plastic optical fiber (POF) has attenuation of 100–1000 dB/km versus 0.2–3 dB/km for glass, limiting it to very short distances (up to about 100 m)."},{"q":"What is the function of a hybrid in a telephone handset?","a":"Decrease mic signal in phones (2-wire to 4-wire conversion)","topic":"Telephone","cat":"Comms","exp":"The hybrid transformer converts between 2-wire (local loop) and 4-wire (separate Tx/Rx). It provides sidetone reduction so your own voice doesn't sound too loud in the earpiece."},{"q":"What is quantizing noise?","a":"Inaccuracies in PCM caused by representing a continuous signal as one of a finite number of discrete levels","topic":"Networks","cat":"Electronics","exp":"Quantizing error is the difference between the actual sample value and the nearest quantization level. More bits per sample reduces this noise."},{"q":"What is the Hall Effect?","a":"When current flows in a conductor in a magnetic field, a voltage appears perpendicular to both","topic":"Misc","cat":"Comms","exp":"The Hall effect, discovered by Edwin Hall in 1879, produces a transverse voltage when current-carrying conductors are in a magnetic field, used in sensors and measurement."},{"q":"How many voiceband channels are in a master group per CCITT?","a":"300","topic":"Telephone","cat":"Comms","exp":"Per CCITT, a master group contains 300 voiceband channels, formed by combining multiple supergroups."},{"q":"When comparing rms voltages and average voltages, which of the following statement is true, assuming sine waves?","a":"The rms voltage is always greater than the average voltage","topic":"Electronics","cat":"Electronics","exp":""},{"q":"How does cavity resonator Q factor relate to frequency?","a":"Q increases with frequency (smaller dimensions at higher frequencies give higher Q)","topic":"RF","cat":"Comms","exp":"At higher microwave frequencies, cavity resonators can be made smaller while achieving higher Q factors than lumped-element LC circuits."},{"q":"What law provides regulation of the ownership and operation of radio and television stations and for other purposes?","a":"P. D. No. 576-A","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the IBM Token Ring network split pair speed?","a":"4 or 16 Mbps","topic":"Networks","cat":"Comms","exp":"IBM Token Ring (IEEE 802.5) operates at 4 Mbps or 16 Mbps. It uses token passing to avoid collisions. Maximum nodes: 260. It's largely been replaced by Ethernet."},{"q":"The system in Fig. 4-9 remains at rest when FW  220 N. What are the magnitude and direction of the friction force on the 200-N block?","a":"105 N down the incline","topic":"Equilibrium","cat":"Physics","exp":"Schaum's College Physics - Equilibrium"},{"q":"What do you call the resistance of the diode when operating at a steady state voltage?","a":"dc resistance","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the GPS satellite orbit altitude?","a":"20,200 km","topic":"GPS","cat":"Comms","exp":"GPS satellites orbit at 20,200 km (Medium Earth Orbit). This height provides global coverage while keeping the orbit period at 12 hours."},{"q":"What is RS-422 and its data rate?","a":"Balanced differential interface standard, up to 10 Mbps at 1200 meters","topic":"Networks","cat":"Comms","exp":"RS-422 uses differential signaling for noise immunity and can achieve 10 Mbps over distances up to 1200 meters."},{"q":"What is the frequency difference between the color subcarrier and the sound carrier in NTSC TV?","a":"0.92 MHz","topic":"TV","cat":"Comms","exp":"The NTSC audio carrier is at 4.5 MHz above the video carrier; the color subcarrier is at 3.58 MHz above the video carrier, a difference of 0.92 MHz."},{"q":"What is slope overload in delta modulation?","a":"An error when the analog signal changes too rapidly for the delta modulation system to track","topic":"Networks","cat":"Electronics","exp":"Slope overload occurs when the signal slope exceeds the maximum tracking rate of the delta modulator, causing distortion in fast-changing signals."},{"q":"What is the S-unit in radio signal reporting?","a":"6 dB change per S-unit","topic":"RF","cat":"Comms","exp":"Each S-unit = 6 dB signal strength change. S9 = 50 microvolts at the antenna terminal. S9+10dB means 10 dB above S9. The logarithmic scale matches human auditory perception and the AGC characteristics of radio receivers."},{"q":"What frequency range does the Marconi antenna operate best at?","a":"Below 2 MHz","topic":"Antennas","cat":"Comms","exp":"The Marconi antenna (quarter-wave vertical with ground plane) is most practical at lower frequencies (below 2 MHz) due to its large physical size."},{"q":"What is the gamma of a TV picture tube?","a":"2.2","topic":"TV","cat":"Comms","exp":"TV picture tubes have a non-linear response described by gamma (γ = 2.2), which must be compensated by gamma correction in the camera."},{"q":"A car must attain a speed of 65 kph for zero side thrust. If coefficient of friction is 0.60, what maximum safe speed at which the car can go without sliding up the curvature of the 100 m radius?","a":"122 kph","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A businessman bought a communication equipment costing P25000 payable in 10 semi-annual payments, each installment payable at the beginning of each period. If rate of interest is 26% compounded semi-annually, what is the amount of each installment?","a":"P 4077.20","topic":"GEAS","cat":"GEAS","exp":""},{"q":"At what frequency does a magnetron microwave oven operate?","a":"2.45 GHz","topic":"Safety","cat":"Comms","exp":"Microwave ovens use 2.45 GHz because water molecules absorb energy efficiently at this frequency. The ISM (Industrial, Scientific, Medical) band at 2.4 GHz is license-free internationally."},{"q":"What weight in pounds can be lifted by a screw that has an efficiency of 80% if it is operated by a 50 lb force at the end of a 30 inched lever and the pitch of the screw is ½ inch?","a":"15,080","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A solid sphere is placed at the top of a 45o incline. When released, it freely rolls down. What will be its linear speed at the foot of the incline which is 2.0 m below the initial position of the cylinder?","a":"5.29 m/s","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the frequency separation between forward and reverse channels in cellular?","a":"45 MHz","topic":"Cellular","cat":"Comms","exp":"AMPS uses 824–849 MHz (reverse/mobile-to-base) and 869–894 MHz (forward/base-to-mobile), with 45 MHz duplex spacing between them."},{"q":"A simply supported beam, 10 m long carries a uniform distributed load of 20 kN/m. What is the value of the maximum moment of the beam due to the load?","a":"250 kN-m","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the shifting of antenna pattern so that the major lobe is at an angle below horizontal?","a":"Down tilt","topic":"Antennas","cat":"Comms","exp":"Antenna downtilt (electrical or mechanical) aims the main beam slightly downward, reducing range while improving coverage within the cell. This reduces co-channel interference in cellular networks."},{"q":"What satellite subsystem senses the angle of solar radiation to compute satellite orientation?","a":"Sun sensor","topic":"Satellite","cat":"Comms","exp":"Sun sensors are attitude determination devices. By measuring the angle of sunlight incidence, the satellite's computer can calculate its orientation relative to the sun."},{"q":"The first law of thermodynamics is based on which of the following principles?","a":"Conservation of energy","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What body coordinates government and military communications in the USA?","a":"NTIA (National Telecommunications and Information Administration)","topic":"RF","cat":"Comms","exp":"The NTIA manages the federal government's use of the radio frequency spectrum and advises the President on telecommunications policy."},{"q":"What multiplexing technique does PCM use?","a":"TDM (Time Division Multiplexing)","topic":"Telephone","cat":"Comms","exp":"PCM digitizes voice signals and multiplexes them using TDM, where each channel gets a time slot in the digital frame."},{"q":"What do you call a negatively charged ion?","a":"anion","topic":"Electronics","cat":"Electronics","exp":""},{"q":"The velocity of sound depends on which factors?","a":"The medium and temperature","topic":"Acoustics","cat":"Board Exam","exp":"Sound speed increases with temperature (≈0.6 m/s per °C in air) and varies by medium (faster in denser solids/liquids). Pressure alone has minimal effect in gases."},{"q":"What is the data rate of TDMA in D-AMPS?","a":"8 kbps per voice channel","topic":"Cellular","cat":"Comms","exp":"D-AMPS (IS-136) uses TDMA to divide each 30 kHz channel into three 8 kbps time slots, tripling the capacity of AMPS."},{"q":"What is the Faraday screen used for?","a":"Minimize losses / prevent transmitter harmonic radiation","topic":"RF","cat":"Comms","exp":"A Faraday screen (cage) surrounds a transmitter to prevent unwanted RF radiation (harmonics). It's also used in transformers between primary and secondary windings to reduce electrostatic coupling while allowing magnetic coupling."},{"q":"Which of the following is NOT a porous absorber?","a":"Membrane absorber","topic":"Acoustics","cat":"Comms","exp":"Porous absorbers include fiberglass and foam. Membrane absorbers work by vibration of thin panels, not pore-based sound absorption."},{"q":"What ITU standard covers the V.34bis facsimile?","a":"V.34bis — supports 33.6 kbps fax transmission","topic":"Networks","cat":"Comms","exp":"V.34bis extends the V.34 modem standard to 33.6 kbps, significantly improving fax transmission speed over standard telephone lines."},{"q":"What is vertical antenna stacking?","a":"Reduces vertical beamwidth, increases horizontal gain","topic":"Antennas","cat":"Comms","exp":"Stacking antennas collinearly compresses the vertical radiation pattern, concentrating energy toward the horizon. Each doubling of elements adds approximately 3 dBd gain. FM broadcast stations use 4-8 element vertical stacks for maximum coverage."},{"q":"What navigation system provides 88-98% global coverage?","a":"Omega","topic":"GPS","cat":"Comms","exp":"Omega was a VLF (10-14 kHz) hyperbolic radio navigation system with 8 stations worldwide. Decommissioned in 1997 and replaced by GPS. It provided positional accuracy of 1-2 nautical miles globally."},{"q":"What is conversational service in B-ISDN?","a":"Real-time bidirectional communication service (e.g., video conferencing)","topic":"Networks","cat":"Comms","exp":"Conversational service in B-ISDN supports real-time two-way exchanges like video telephony, requiring low delay and synchronization."},{"q":"The Q-point of a class D amplifier can be set or positioned at what region in the load line?","a":"any of the above","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What frequency range is used for aircraft long-range HF communications?","a":"2–30 MHz (HF band)","topic":"RF","cat":"Comms","exp":"HF radio (2–30 MHz) is used for long-distance aircraft communications, especially over oceans where VHF line-of-sight is insufficient."},{"q":"What test is used to test AM transmitters using SSB method?","a":"Two-tone test","topic":"RF","cat":"Comms","exp":"The two-tone test applies two equal-amplitude audio tones (e.g., 700 Hz and 1900 Hz) to a transmitter. The resulting intermodulation products reveal linearity. For SSB, the output should be two clean carriers with no IMD products."},{"q":"What is the data rate of an ISDN B channel?","a":"64 kbps","topic":"Networks","cat":"Comms","exp":"Each ISDN B (Bearer) channel carries 64 kbps, suitable for one voice call or data transmission using PCM."},{"q":"What is the in-phase (I) signal phase angle in NTSC color?","a":"57 degrees","topic":"TV","cat":"Comms","exp":"The NTSC I signal is transmitted at 57° phase from the color burst reference, and the Q signal at 147°. This arrangement optimizes for the eye's varying color resolution."},{"q":"a constant velocity. What is thus constant velocity called?","a":"Terminal velocity","topic":"GEAS","cat":"GEAS","exp":""},{"q":"Which is not a bit-oriented protocol?","a":"BISYNC","topic":"Networks","cat":"Comms","exp":"BISYNC (Binary Synchronous Communications) is a character-oriented (byte-oriented) protocol developed by IBM. HDLC, SDLC, and LLC are bit-oriented protocols using flag fields."},{"q":"What is the LED usually used as a signal source for plastic fiber?","a":"Red LED","topic":"Fiber","cat":"Comms","exp":"Red LEDs (~650 nm) are used with plastic optical fiber because POF has lowest attenuation in the red wavelength range, and red LEDs are inexpensive and efficient."},{"q":"An electron strikes the screen of the cathode ray tube with a velocity of 10 to the 9th power cm/s. Compute its kinetic energy in erg. The mass of an electron is 9 x 10^-31 kg?","a":"4.5 x 10^-10 erg","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is equal power per octave noise called?","a":"Pink noise","topic":"Acoustics","cat":"Comms","exp":"Pink noise (also called flicker noise) has equal power per octave — each doubling of frequency contains equal energy. White noise has equal power per Hz."},{"q":"In a magnet, what do you call the point in which the magnetic lines of force is maximum?","a":"magnetic pole","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the characteristic impedance of standard TV coaxial cable?","a":"75 Ω","topic":"RF","cat":"Comms","exp":"TV distribution systems use 75-ohm coaxial cable (e.g., RG-6) for minimum signal loss. Lab/transmitter equipment uses 50-ohm coax."},{"q":"An automobile moving at 30 m/s is approaching a building whistle with a frequency of 500 Hz. If the speed of sound in air is 340 m/s what is the apparent frequency of the whistle heard by the driver?","a":"456 Hz","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the threshold effect in FM reception?","a":"The noise-reduction improvement that occurs when the FM signal exceeds the threshold level (~10 dB above noise)","topic":"RF","cat":"Comms","exp":"Above the FM threshold, the discriminator output has much less noise than the input SNR would suggest — FM provides a noise advantage when the signal is sufficiently strong."},{"q":"What radio system is used to provide high-speed data packet access for GSM?","a":"GPRS","topic":"Cellular","cat":"Comms","exp":"General Packet Radio Service (GPRS) is a packet-switched overlay on GSM, pr
