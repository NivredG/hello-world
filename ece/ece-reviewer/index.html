oviding data rates up to ~172 kbps. It enables always-on internet access without a dedicated circuit."},{"q":"What best describes the transistor current that flows between the collector and emitter terminals when the base is open?","a":"cut-off current","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A man driving his car at a constant rate of 40 mph suddenly sees a sheep crossing the road 60 feet ahead. Compute the constant deceleration (in feet/second2) required to avoid hitting the sheep? Assume a reaction time of 0.5 second before the man applies the brake.","a":"67.87","topic":"GEAS","cat":"GEAS","exp":""},{"q":"Which of the materials below that can be easily magnetized?","a":"soft magnetic materials","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the frequency of an alternating current, if it reaches 90° within 4.167 ms?","a":"60 Hz","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the total charge at the nucleus of silicon atom?","a":"14e C","topic":"Electronics","cat":"Electronics","exp":""},{"q":"The Q-point for class A amplifier is at the active region, while for class B it is at cutoff region, how about for class AB?","a":"it is slightly above cutoff","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What semiconductor diode that have a fine wire (called a cat-whisker) whose point is in permanent contact with the surface of a wafer of semiconductor material such as silicon, germanium or gallium arsenide?","a":"point-contact diode","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is CDMA2000 1xRTT data rate?","a":"153 kbps","topic":"Cellular","cat":"Comms","exp":"CDMA2000 1xRTT (1x Radio Transmission Technology) provides 153 kbps peak data rate, meeting the 3G threshold. EV-DO Rev 0 reached 2.4 Mbps and EV-DO Rev A reached 3.1 Mbps download. Used by Verizon and Sprint before 4G LTE."},{"q":"A 900-kg car whose motor delivers a maximum power of 40.0 hp to its wheels can maintain a steady speed of 130 km/h on a horizontal roadway. How large is the friction force that impedes its motion at this speed?","a":"826 N","topic":"Projectile Motion","cat":"Physics","exp":"Schaum's College Physics - Projectile Motion"},{"q":"In general, which of the transistors is particularly more useful in integrated-circuit (IC) chips?","a":"FETs","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What law states that it is impossible to operate an engine operating in a cycle that will have no other effect than to extract heat from a reservoir and turn it into an equivalent amount of work?","a":"Second law of thermodynamics","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the bulk modulus of steel if the sound waves traveled at approximately 5900 m/s? Note: the density of steel is 7900 kg/m^3","a":"2.75 x 10^11 Pa","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is radiation exposure from a TV receiver at 5 cm?","a":"0.5 milliroentgens per hour","topic":"Safety","cat":"Comms","exp":"FCC requires TV receivers to not exceed 0.5 mR/hour at 5 cm from any surface, and 0.1 mR/hour at 5 cm from TV CRT (X-ray from high-voltage electron beam)."},{"q":"What devices are inserted into a telephone channel if total via net loss exceeds about 2.5 dB?","a":"Echo suppressors","topic":"Telephone","cat":"Comms","exp":"Echo suppressors insert one-way loss in the return path to reduce echo on long-distance calls. They create a half-duplex condition. Echo cancellers (active DSP) replaced them on modern networks."},{"q":"What percentage of Earth's surface can a single GEO satellite cover at 0° elevation?","a":"Approximately 42.5%","topic":"Satellite","cat":"Board Exam","exp":"A geostationary satellite at 0° minimum elevation can see roughly 42.4% of Earth's surface. Three such satellites with overlapping coverage can serve almost the entire globe."},{"q":"What is Benjamin Franklin's contribution to electrical science?","a":"Established that lightning is electrical and identified two types of electric charge (positive and negative)","topic":"Misc","cat":"Comms","exp":"Franklin's kite experiment proved lightning is electricity, and he coined the terms positive and negative charge, as well as inventing the lightning rod."},{"q":"What happens in the resistance of copper wire when its temperature is raised?","a":"increased","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What type of transmission line uses a ground return?","a":"Unbalanced transmission line (e.g., coaxial cable)","topic":"RF","cat":"Comms","exp":"Unbalanced lines like coax use one conductor as signal and the other (outer shield/ground) as return path."},{"q":"What device amplifies by interaction between an electron beam and an RF field along a linear path?","a":"Traveling Wave Tube (TWT)","topic":"RF","cat":"Comms","exp":"TWTs use a helical slow-wave structure to match the electron beam velocity with the RF wave, enabling continuous amplification over a wide bandwidth. Used in satellite transponders and radar amplifiers."},{"q":"What is the formula for REM?","a":"REM = RBE × RAD","topic":"Safety","cat":"Comms","exp":"REM (Roentgen Equivalent Man) = RBE (Relative Biological Effectiveness) × RAD (Radiation Absorbed Dose). Alpha particles: RBE=10; Beta/gamma: RBE=1. REM accounts for biological impact."},{"q":"What is the purpose of cooling a parametric amplifier?","a":"To improve noise performance (reduce thermal noise)","topic":"RF","cat":"Electronics","exp":"Parametric amplifiers achieve extremely low noise figures when cooled to near absolute zero, making them ideal for satellite receivers and radio telescopes."},{"q":"What color in visible light has the longest wavelength after red?","a":"Orange","topic":"Misc","cat":"Comms","exp":"The visible spectrum in order of decreasing wavelength: red, orange, yellow, green, blue, indigo, violet (ROY G BIV). Orange follows red as second longest."},{"q":"The atomic weight of a silicon atom is approximately 28 amu. How many electrons, protons and neutrons does the atom consist?","a":"14, 14, 14","topic":"Electronics","cat":"Electronics","exp":""},{"q":"If in Fig. 4-9 the friction between the block and the incline is negligible, how much must the object on the right weigh if the 200-N block is to remain at rest?","a":"115 N","topic":"Equilibrium","cat":"Physics","exp":"Schaum's College Physics - Equilibrium"},{"q":"What law that describes the force of attraction or repulsion between two magnetic poles is directly proportional to their strengths?","a":"Coulomb’s first law","topic":"Electronics","cat":"Electronics","exp":""},{"q":"In a TV system, what signal has information for 1.3 MHz bandwidth?","a":"I signal","topic":"TV","cat":"Comms","exp":"The I (in-phase) signal carries orange-cyan color information with 1.3 MHz bandwidth. The Q (quadrature) signal carries green-magenta at only 0.5 MHz."},{"q":"A 12-kg box is released from the top of an incline that is 5.0 m long and makes an angle of 408 to the horizontal. A 60-N friction force impedes the motion of the box. (a) What will be the acceleration of the box and (b) how long will it take to reach the bottom of the incline?","a":"(a) 1.3 m/s2 ; (b) 2.8 s","topic":"Newton's Laws","cat":"Physics","exp":"Schaum's College Physics - Newton's Laws"},{"q":"What is the most positive element in the electron gun of a TV CRT?","a":"The second anode (ultor)","topic":"TV","cat":"Comms","exp":"The second anode (ultor) has the highest positive voltage (up to 30 kV in color TVs), accelerating electrons to high velocity for bright pictures."},{"q":"What type of impact is when the centers of mass of colliding bodies are not located on the line of impact?","a":"Eccentric impact","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A ball is thrown vertically into the air at 120 m/s. After 3 seconds, another ball is thrown vertically. What is the velocity must the second ball have to pass the first ball at 100 m from the ground?","a":"105.89 m/s","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What types of microphone have high-Z output?","a":"Crystal, electret and condenser","topic":"Acoustics","cat":"Comms","exp":"High impedance (high-Z) microphones: crystal, condenser, electret. Low impedance (low-Z): dynamic, ribbon, carbon. Impedance matching matters for signal quality."},{"q":"What defines the geographic distance required between cells using identical frequencies to avoid interference?","a":"Distance-to-reuse ratio (D/R)","topic":"Cellular","cat":"Comms","exp":"D/R (also called Cochannel Interference Reduction Factor) is the ratio of the distance between cochannel cells (D) to the cell radius (R). Higher D/R = less interference but less capacity."},{"q":"In TV, the color level control is in the?","a":"BPA","topic":"TV","cat":"Comms","exp":"The Bandpass Amplifier (BPA) amplifies the 3.58 MHz chroma signal. The color level (saturation) control is typically in this stage."},{"q":"What is the frequency tolerance for aircraft SSB stations?","a":"20 ppm","topic":"Telephone","cat":"Comms","exp":"Aircraft SSB stations must maintain carrier frequency within plus or minus 20 parts per million. At 8 MHz this equals plus or minus 160 Hz. Precise frequency control is critical for ATC coordination and emergency communication."},{"q":"The base of a transistor serves a purpose to what element of the FET?","a":"gate","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is a Doghouse in radio?","a":"Temperature-controlled enclosure for antenna tuning equipment","topic":"Misc","cat":"Comms","exp":"A doghouse is a weather-proof temperature-controlled shelter at the base of an AM broadcast antenna housing the coupling and tuning unit. Stable temperature prevents component drift that would detune the antenna."},{"q":"What did J.J. Thomson discover in 1897?","a":"The electron","topic":"Misc","cat":"Comms","exp":"J.J. Thomson discovered the electron by measuring cathode rays and showing they were streams of particles much lighter than any atom."},{"q":"What is the unit of flux in cgs?","a":"Maxwell (Mx)","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the resonant frequency of a circuit when L is 50 microhenrys and C is 40 picofarads are in parallel?","a":"3.56 MHz","topic":"Electronics","cat":"Electronics","exp":""},{"q":"Which of the following shall be complied by an international ship pursuant to the global maritime distress and safety system implemented last 1999?","a":"A radio-telegraph operator","topic":"GEAS","cat":"GEAS","exp":""},{"q":"If 12 V are applied to a circuit that consumes 78 W, what is the current flow through the circuit?","a":"6.5 A","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What type of radio fading is caused by obstruction of the signal path?","a":"Log-normal fading (shadowing)","topic":"RF","cat":"Comms","exp":"Log-normal or shadow fading results from large obstacles like buildings or hills blocking the signal, causing slow variations in signal strength."},{"q":"What is the K factor under normal atmospheric conditions?","a":"4/3","topic":"RF","cat":"Comms","exp":"The effective Earth radius factor K = 4/3 under standard atmospheric conditions, used in calculating radio horizon distance."},{"q":"The information that can be found in most specification sheets?","a":"all of the above","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is ambiophony?","a":"A technique using loudspeaker feedback to control room reverberation","topic":"Acoustics","cat":"Comms","exp":"Ambiophony artificially controls the acoustics of a space by using microphones and loudspeakers to add or reduce reverberation."},{"q":"What pressure measuring device consists of a coiled hollow tube that tends to straighten out when the tube is subjected to an internal pressure?","a":"Bourdon pressure gage","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the speed of the geostationary satellite?","a":"6879 statute miles per hour","topic":"Satellite","cat":"Comms","exp":"Geostationary satellites orbit at 35,786 km altitude at 6879 mph (11,068 km/h), matching Earth's rotation rate of 1 revolution per 24 hours."},{"q":"A 6-Ω resistor is connected in series with a capacitive reactance of 8 Ω. If the supply voltage is 200 V, what is the power consumed by the circuit?","a":"2400 W","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the effective height of a vertical antenna?","a":"One half to two thirds of physical height","topic":"Antennas","cat":"Comms","exp":"The effective height determines the antenna received voltage from an electromagnetic field. A base-fed monopole with uniform current would have effective height equal to half its physical height. Real antennas achieve 50-67% of physical height."},{"q":"What is a V-antenna?","a":"A non-resonant bidirectional travelling wave antenna shaped like the letter V","topic":"Antennas","cat":"Comms","exp":"The V-antenna is a travelling wave antenna that provides good gain over a wide frequency range due to its non-resonant (terminated) construction."},{"q":"Which type of laser diode (ILD) is NOT temperature dependent?","a":"Buried heterostructure ILD","topic":"Fiber","cat":"Comms","exp":"Injection laser diodes (ILD) used in fiber optics have threshold current that is temperature dependent, but certain heterostructures minimize this sensitivity."},{"q":"What is the 3rd layer of the OSI model?","a":"Network layer","topic":"Networks","cat":"Comms","exp":"OSI Layer 3 (Network) handles logical addressing (IP addresses) and routing. It determines the best path for data to travel from source to destination across multiple networks."},{"q":"A 1.62-ounce marble attains a velocity of 170 mph (249.3 ft/s) in a hunting slingshot. The contract with the sling is 1/15th second. What is the average force on the marble during contact?","a":"11.75 lbf","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the most commonly used microwave antenna?","a":"Horn","topic":"Antennas","cat":"Comms","exp":"Horn antennas are the most practical microwave antennas — they're broadband, have low SWR, and are easy to construct. They directly connect to waveguides without a matching network."},{"q":"A glass plate is 0.6 cm thick and has a refractive index of 1.55. Compute how long will it take for a pulse of light to pass through the plate?","a":"3.11 x 10^-11 s","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the popular fiber optic cable with glass core and plastic cladding called?","a":"PCS (Plastic Clad Silica)","topic":"Fiber","cat":"Comms","exp":"PCS fiber has a silica glass core with plastic cladding. It's easier to work with than all-glass fiber while offering better performance than all-plastic POF."},{"q":"When was wireless telegraphy first demonstrated?","a":"1895 (Guglielmo Marconi)","topic":"Misc","cat":"Comms","exp":"Marconi demonstrated wireless telegraphy over a distance of about 2.4 km in 1895, leading to the first practical radio communications."},{"q":"What is the IMT-2000 frequency allocation?","a":"1920 to 1980 MHz uplink","topic":"Cellular","cat":"Comms","exp":"IMT-2000 (3G) core bands: 1920-1980 MHz uplink and 2110-2170 MHz downlink. The 2000 in IMT-2000 refers to both the target year and frequency. Bands at 850 and 1900 MHz were also allocated for 3G deployments."},{"q":"What will happen when the power factor of a circuit is increased?","a":"active power increases","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What region the transistor should be operating to have minimum distortion at the output signal?","a":"active region","topic":"Electronics","cat":"Electronics","exp":""},{"q":"In op-amps, which gain is the highest?","a":"open-loop gain","topic":"Electronics","cat":"Electronics","exp":""},{"q":"When 100 J of work is done upon a ¯ywheel, its angular speed increases from 60 rev/min to 180 rev/min. What is its moment of inertia?","a":"0.63 kg \u0001 m2","topic":"Angular Motion","cat":"Physics","exp":"Schaum's College Physics - Angular Motion"},{"q":"The reactance of a 25 mH coil at 500 Hz is which of the following?","a":"785 ohms","topic":"Electronics","cat":"Electronics","exp":""},{"q":"When was the effectivity of Executive Order No. 109?","a":"July 12, 1993","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the common IF frequency for satellite receivers?","a":"70 MHz","topic":"Satellite","cat":"Comms","exp":"70 MHz is the standard intermediate frequency used in satellite earth station receivers, allowing standardized IF components across different systems."},{"q":"What is the data rate of GPRS?","a":"172.2 kbps (maximum with all 8 time slots)","topic":"Cellular","cat":"Comms","exp":"GPRS (2.5G) can use up to 8 TDMA time slots simultaneously, achieving up to 172.2 kbps downlink; typical deployments deliver 20–40 kbps."},{"q":"In CATV system, what is the noise figure for sub and low-band channels?","a":"5 dB or better","topic":"CATV","cat":"Comms","exp":"Sub and low-band channels have the least noise budget. At 5 dB or better NF, these channels can be distributed effectively with minimal cascade amplifier degradation."},{"q":"If an alternating voltage has a magnitude of 10 V at 30°, what is its maximum voltage?","a":"20 V","topic":"Electronics","cat":"Electronics","exp":""},{"q":"An employee obtained a loan P 100,000 at a rate of 6% compounded annually in order to build a house. How much must he pay monthly to amortize the loan within a period of 10 years?","a":"P 1,102.40","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the power factor of a circuit if the inductive susceptance and conductance have the same value?","a":"0.707","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the most important specification for semiconductor diode?","a":"Current capacity","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the Citizens Band radio allocation?","a":"40 channels at 26-27 MHz","topic":"RF","cat":"Comms","exp":"CB radio uses 40 channels in the 26.965-27.405 MHz HF band. Maximum power is 4W AM or 12W SSB. No license required in the US. Channel 9 is the emergency channel. The 27 MHz frequency supports both local ground wave and long-distance skip propagation."},{"q":"What is the H.221 broadband ISDN data rate?","a":"32.768 Mbps","topic":"Networks","cat":"Comms","exp":"H.221 frames multiple ISDN B-channels for broadband videoconferencing; at full capacity using multiple B-channels it can reach approximately 32 Mbps."},{"q":"In Fig. 4-14, the system is in equilibrium. (a) What is the maximum value that FW can have if the friction force on the 40-N block cannot exceed 12.0 N? (b) What is the coecient of static friction between the block and the tabletop?","a":"(a) 6.9 N; (b) 0.30","topic":"Equilibrium","cat":"Physics","exp":"Schaum's College Physics - Equilibrium"},{"q":"What does Unicode use for character encoding?","a":"16-bit encoding (65,536 possible characters)","topic":"Networks","cat":"Electronics","exp":"Unicode (basic multilingual plane) uses 16-bit codes, providing 65,536 character positions to support virtually all the world's writing systems in a single standard."},{"q":"What is the relative permittivity (dielectric constant) of silicon?","a":"11.7","topic":"Misc","cat":"Electronics","exp":"Silicon has εᵣ = 11.7, one of the highest among semiconductor materials, important for calculating capacitance, propagation delay, and impedance in silicon ICs."},{"q":"What is the gain of an isotropic antenna?","a":"0 dBi","topic":"Antennas","cat":"Comms","exp":"An isotropic antenna is the universal reference with unity gain (0 dBi), radiating equally in all directions."},{"q":"What is the Smith Chart?","a":"Circular transmission line calculator for impedance matching","topic":"Antennas","cat":"Comms","exp":"The Smith Chart graphs impedance transformations along transmission lines. Its circular shape reflects the mathematical fact that moving along a lossless line traces circles on the complex reflection coefficient plane. Used to design matching networks."},{"q":"What is MPEG-4 used for?","a":"Video compression specification for multimedia applications (streaming, mobile, broadcast)","topic":"Networks","cat":"Electronics","exp":"MPEG-4 (ISO 14496) provides efficient compression for video streaming and mobile media. MPEG-4 Part 10 (H.264/AVC) is the most widely used video codec today."},{"q":"What is the advantage of the Dougherty linear amplifier?","a":"High efficiency","topic":"RF","cat":"Comms","exp":"The Dougherty amplifier uses a carrier amplifier and a peaking amplifier. At full power, both operate; at lower levels, only the carrier amp runs. This maintains high efficiency across a wide power range — ideal for cellular base stations."},{"q":"What filter uses acoustic waves on the surface of a substrate to produce the desired signal response?","a":"Surface Acoustic Wave (SAW) filter","topic":"RF","cat":"Comms","exp":"SAW filters convert RF signals to acoustic waves on a piezoelectric substrate, filter them mechanically, then convert back. They're compact, precise, and widely used in TV tuners and mobile phones."},{"q":"A charged body in free space produces 10-V potential at a distance 25cn away. What will be the potential at 50cm away?","a":"5.0 Volts","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the charge magnitude, Q of a body if it lacks 5 electrons?","a":"8 x 10-19 Coulomb","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What agency of the United Nations formulates standards and recommended practices for all civil aviation?","a":"ICAO","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A uniform rectangular marble slab is 3.4 m long and 2.0 m wide. It has a mass of 180 kg. If it is originally lying on the ¯at ground, how much work is needed to stand it on end?","a":"3.0 kJ","topic":"Projectile Motion","cat":"Physics","exp":"Schaum's College Physics - Projectile Motion"},{"q":"An operational amplifier must have at least how many usable terminals?","a":"5 terminals","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What do you call a pole that when place in air with a similar and equal pole will cause a force of repulsion of 1/4πμ Newtons? ο","a":"Unit pole","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What controls the phase angle of the modulated color signal in NTSC TV?","a":"Tint (hue) control","topic":"TV","cat":"Comms","exp":"The tint control shifts the phase of the 3.58 MHz chroma subcarrier, rotating the color wheel and changing all colors simultaneously."},{"q":"Which RF connector type is the most expensive?","a":"N-type connector","topic":"RF","cat":"Comms","exp":"N-type connectors are precision 50-ohm connectors rated to 11+ GHz, used in high-performance RF systems where quality is paramount."},{"q":"What is the V-number formula for optical fiber?","a":"V = πd·NA/λ₀ (normalized frequency)","topic":"Fiber","cat":"Comms","exp":"The V-number determines how many modes a fiber supports. For single-mode operation, V must be less than 2.405."},{"q":"What is Thevenin's theorem?","a":"Any linear circuit can be replaced by a single voltage source (Vth) and series resistance (Rth)","topic":"Misc","cat":"Comms","exp":"Thevenin's theorem simplifies complex circuits into an equivalent source and resistance seen from two terminals, making analysis much easier."},{"q":"Another unit used to measure atmospheric pressure is the “torr”. This is named after the Italian physicist, Evangelista Torrecelli. An average atmospheric pressure is how many torr?","a":"760","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What signal is sent by the CO to the calling telephone indicating the called telephone is ringing?","a":"Ringback signal","topic":"Telephone","cat":"Comms","exp":"Ringback tone (RBT) is the audible tone heard by the caller indicating the called party's phone is ringing. It's generated by the CO, not the called phone."},{"q":"What is the HDLC/SDLC flag bit pattern?","a":"01111110","topic":"Networks","cat":"Comms","exp":"The HDLC frame delimiter is binary 01111110. Bit stuffing inserts a 0 after every 5 consecutive 1s in data, preventing false flag detection. The receiver strips all stuffed 0s automatically on receipt."},{"q":"Why is multi-mode fiber easier to work with than single-mode?","a":"Wider acceptance angle and easier to couple light into","topic":"Fiber","cat":"Comms","exp":"Multi-mode fiber has a larger core (50-62.5 µm) and wider numerical aperture, making it easier to splice and connect. Its larger core accepts light at wider angles. Used for LAN and short runs."},{"q":"What is the data rate of a 6 MHz terrestrial TV channel?","a":"19.39 Mbps","topic":"CATV","cat":"Comms","exp":"ATSC 8-VSB digital TV on a 6 MHz channel carries 19.39 Mbps. This allows HDTV (about 15-20 Mbps after overhead) or multiple SD channels via MPEG-2 compression."},{"q":"What is run-length encoding?","a":"Replacing consecutive identical values with a count and value code","topic":"Networks","cat":"Comms","exp":"RLE is lossless compression: AAAA becomes 4A. Effective for fax and simple graphics. Used in TIFF, BMP, and early fax (T.4) compression standards where documents have large white areas."},{"q":"A 5.0-kg block rests on a 308 incline. The coecient of static friction between the block and the incline is 0.20. How large a horizontal force must push on the block if the block is to be on the verge of sliding (a) up the incline and (b) down the incline?","a":"(a) 43 N; (b) 16.6 N","topic":"Newton's Laws","cat":"Physics","exp":"Schaum's College Physics - Newton's Laws"},{"q":"What particles that revolve around the positive nucleus?","a":"electrons","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What do you mean by root-mean-squared (rms) value?","a":"B or C","topic":"Electronics","cat":"Electronics","exp":""},{"q":"Which of the amplifiers given below that is considered as non-linear?","a":"class C","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the basis in operation of semiconductor photoconductors?","a":"EHP optical generation","topic":"Electronics","cat":"Electronics","exp":""},{"q":"At sea level a nitrogen molecule in the air has an average translational KE of 6:2 \u0002 10 21 J. Its mass is 4:7 \u0002 10 26 kg. (a) If the molecule could shoot straight up without striking other air molecules, how high would it rise? (b) What is the molecule's initial speed?","a":"14 km; (b) 0.51 km/s","topic":"Projectile Motion","cat":"Physics","exp":"Schaum's College Physics - Projectile Motion"},{"q":"A 25 g mass bullet was fired at the wall. The bullet’s speed upon hitting the wall is 350 m/s. What is the average force (in Newton) if the bullet penetrates 10 cm?","a":"15,312.5 N","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the utilization factor in a TV scanning system?","a":"The portion of scanning lines that can be used for vertical resolution (typically 0.7)","topic":"TV","cat":"Comms","exp":"Not all scanning lines contribute to vertical resolution; the utilization factor (Kell factor) accounts for interlace and scanning inefficiencies, typically 0.7."},{"q":"In AC circuit, resistors will dissipate what power?","a":"true","topic":"Electronics","cat":"Electronics","exp":""},{"q":"Among the given semiconductors below, which has the highest mobility?","a":"indium antimonide","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What are the popular IF frequencies for TV receivers?","a":"36 and 46 MHz","topic":"TV","cat":"Comms","exp":"NTSC TV receivers use picture IF of 45.75 MHz and sound IF of 41.25 MHz. The difference is 4.5 MHz (intercarrier sound)."},{"q":"A steel railroad rails 10 m long are laid with clearance of 3 mm at a temperature of 15oC. At what temperature will the rails just touch? If there were no initial clearance Assume: alpha = 11.7 micro m/m deg.C and E = 200 GPa.","a":"40.64 deg","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the effective height of an antenna if 2.7V is induced and field intensity is 27 mV/m?","a":"100 meters","topic":"Antennas","cat":"Board Exam","exp":"Effective height h = V/E = 2.7V / 0.027 V/m = 100 meters. Effective height converts field intensity to induced voltage and relates antenna size to performance."},{"q":"What data rate does the V.34 modem standard support?","a":"33.6 kbps","topic":"Networks","cat":"Comms","exp":"V.34bis (an extension of V.34) supports up to 33.6 kbps over standard telephone lines, improving on V.34's original 28.8 kbps."},{"q":"What refers to Mogul-Dellinger fadeout?","a":"Sudden Ionospheric Disturbance (SID)","topic":"GPS","cat":"Comms","exp":"A Sudden Ionospheric Disturbance (SID) or Mogul-Dellinger effect is a sharp increase in ionization caused by solar X-ray flares. It causes HF blackouts on the sunlit side of Earth, lasting minutes to hours."},{"q":"In CATV internet, a 6 MHz channel has a data rate of?","a":"27 Mbps","topic":"CATV","cat":"Comms","exp":"Cable modems on a 6 MHz CATV channel achieve ~27 Mbps downstream using 64-QAM or 256-QAM modulation. Terrestrial 8-VSB TV uses the same 6 MHz for 19.39 Mbps."},{"q":"The restriction of certain discrete energy levels in a semiconductor material can be predicted generally by using what model?","a":"Bohr model","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What class of mobile phone has a maximum ERP of -2 dBW (600 mW)?","a":"Class 3 (portable phone)","topic":"Cellular","cat":"Comms","exp":"AMPS power classes: Class 1 = 3W ERP, Class 2 = 1.6W ERP, Class 3 = 600mW (-2 dBW) ERP. Class 3 is the handheld portable phone standard."},{"q":"What is the branch of engineering mechanics which refers to the study of rigid body in motion under the action of forces?","a":"Dynamics","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What refers to a non-exclusive facility which the public may, by the payment of appropriate fees, place as well as receive telephone calls and/or telegrams or other messages?","a":"Public toll calling station","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A 19-foot beam 10 inches wide and 20 inches high supports 1500 lb/ft on two supports 14 feet apart. The right end of the beam extends 2 feet past the support. What is the shearing stress midway between supports?","a":"2.0 psi","topic":"GEAS","cat":"GEAS","exp":""},{"q":"Which of the following determines the strength of a magnetic field around a conductor?","a":"amount of current","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What component removes amplitude variations in an FM receiver?","a":"Limiters","topic":"RF","cat":"Comms","exp":"Limiters clip the amplitude of the received FM signal before detection, removing AM noise and interference."},{"q":"Which statement of the second law of thermodynamics states that no heat engine can have a thermal efficiency of 100 percent?","a":"Kelvin-Planck statement","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is a FM receiver that causes a stronger signal to dominate the weaker signal on the same frequency?","a":"Capture effect","topic":"Fiber","cat":"Comms","exp":"FM's capture effect allows a stronger signal to suppress a weaker co-channel signal. A signal only 3 dB stronger captures the receiver, eliminating the weaker signal entirely."},{"q":"A solid circular shaft 6 cm in diameter was stressed to 40 MPa when transmitting power at 1200 rpm. What horsepower is transmitted? G= 100 GPa.","a":"285.75 hp","topic":"GEAS","cat":"GEAS","exp":""},{"q":"The maximum radiation from any electronic equipment should not exceed?","a":"100 mr per week","topic":"Safety","cat":"Comms","exp":"FCC limits radiation exposure from consumer electronics to 100 milliroentgens (mr) per week. TV receivers must not exceed 0.5 mr/hour at 5 cm distance."},{"q":"What states that the net change in the total energy of the system during a process is equal to the difference between the total energy entering and the total energy leaving the system during that process?","a":"Conservation of energy principle","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A child is holding a wagon from rolling straight back down a driveway that is inclined at 208 to the horizontal. If the wagon weighs 150 N, with what force must the child pull on the handle if the handle is parallel to the incline?","a":"51 N","topic":"Vectors","cat":"Physics","exp":"Schaum's College Physics - Vectors"},{"q":"When a diode is reverse biased the depletion region widens, since it is in between positively charge holes and negatively charge electrons, it will have an effect of a capacitor, this capacitance is called what?","a":"transition capacitance","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the rest frequency in FM?","a":"The carrier frequency with no modulation applied","topic":"RF","cat":"Comms","exp":"The rest (center) frequency is the unmodulated carrier frequency; the FM signal deviates above and below this frequency in proportion to the audio signal."},{"q":"What is the interest due on a P 1500 note for 4 years and 3 month, if it bears 12% ordinary simple interest?","a":"P 756","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is an autodyne converter?","a":"Combined mixer and local oscillator using one transistor or tube","topic":"RF","cat":"Comms","exp":"An autodyne (self-heterodyne) converter uses a single active device as both the oscillator and the mixer, saving components. Used in simple AM superheterodyne receivers. Also called a self-oscillating mixer."},{"q":"What is the term used to express the amount of electrical energy stored in an electrostatic field?","a":"Joules","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What antenna is used as a standard reference for directive gain?","a":"Isotropic antenna","topic":"Antennas","cat":"Comms","exp":"An isotropic antenna radiates equally in all directions and is used as a 0 dBi reference. Antenna gains are expressed in dBi relative to it."},{"q":"A 2.0-kg block of wood rests on a tabletop. A 7.0-g bullet is shot straight up through a hole in the table beneath the block. The bullet lodges in the block, and the block ¯ies 25 cm above the tabletop. How fast was the bullet going initially?","a":"0.64 km/s","topic":"Work, Energy, and Power","cat":"Physics","exp":"Schaum's College Physics - Work, Energy, and Power"},{"q":"A 900-kg car is going 20 m/s along a level road. How large a constant retarding force is required to stop it in a distance of 30 m? (Hint: First find its deceleration.)","a":"6.0 kN","topic":"Newton's Laws","cat":"Physics","exp":"Schaum's College Physics - Newton's Laws"},{"q":"What navigation system is used for fixed location determination over large distances?","a":"LORAN","topic":"GPS","cat":"Comms","exp":"LORAN (Long Range Navigation) uses low-frequency radio signals from ground stations to determine position over large distances."},{"q":"What is the ratio of the transverse strain to the corresponding axial strain in a body subjected to uniaxial stress?","a":"Poisson’s ratio","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the technique used to reduce flicker in a TV picture without increasing bandwidth?","a":"Interlacing","topic":"TV","cat":"Comms","exp":"Interlacing scans odd lines then even lines, effectively doubling the perceived frame rate without doubling bandwidth. NTSC uses 2:1 interlace at 30 fps."},{"q":"What is the PAL TV system's vertical sync frequency?","a":"50 Hz","topic":"TV","cat":"Comms","exp":"PAL (used in Europe and many other regions) uses 50 Hz field rate (625 lines/50 fields), matching the 50 Hz power frequency to prevent flicker."},{"q":"What is a Smart Card?","a":"Card with embedded integrated circuit for subscriber identification","topic":"Cellular","cat":"Comms","exp":"Smart cards contain a microprocessor and secure memory. The SIM card in GSM phones is a smart card storing IMSI, authentication keys (Ki), and phonebook. Moving the SIM card transfers the subscriber identity to any compatible phone."},{"q":"What is AWG 19 telephone wire used for?","a":"Telephone trunk and feeder cables","topic":"Telephone","cat":"Comms","exp":"AWG 19 (0.9 mm) copper wire is used for telephone distribution feeder cables because of its lower resistance per unit length than the AWG 24/26 used in subscriber loops."},{"q":"What is the unit of magnetic flux in SI system?","a":"Weber","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is a Slot antenna?","a":"Flush aerodynamic antenna cut into aircraft metal skin","topic":"Antennas","cat":"Comms","exp":"Slot antennas are cut into the conductive aircraft skin, flush and aerodynamic. Electrically equivalent to a rotated dipole. Used for TACAN, DME, VOR on aircraft where external antennas create aerodynamic drag and icing hazards."},{"q":"What waveform appears on a trapezoid modulation pattern at 100% modulation?","a":"Triangular waveform","topic":"RF","cat":"Comms","exp":"At exactly 100% AM modulation, the trapezoid pattern on an oscilloscope forms a perfect triangle, indicating the modulation envelope reaches zero."},{"q":"What do you call the range over which the reference frequency can vary and still achieve phase lock?","a":"Capture range","topic":"Acoustics","cat":"Comms","exp":"Capture range is the frequency range over which a PLL can acquire lock. It is narrower than the lock range (hold range)."},{"q":"Determine the volume in mL of stock solution that must be diluted to produce 3.00 x 10^2 mL of 0.856 M NaOH solution, starting with a 5.27 M stock solution?","a":"48.7 mL","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What refers to slight frequency change/modulation of light by thermal energy in the material?","a":"Brillouin scattering","topic":"Fiber","cat":"Comms","exp":"Stimulated Brillouin Scattering (SBS) occurs at low power levels (~3 mW in single-mode fiber). It creates a frequency-shifted backscattered wave via interaction with acoustic phonons."},{"q":"What is the typical noise figure of metal/semiconductor FETs used at microwave frequencies?","a":"2 dB or less","topic":"RF","cat":"Comms","exp":"GaAs FETs and HEMTs achieve noise figures of 1-2 dB at microwave frequencies. This low noise figure is critical for the first amplifier stage in satellite receivers and radar systems."},{"q":"What is the maximum daily exposure in minutes for a loudness level of 110-120 dB?","a":"20 mins","topic":"Acoustics","cat":"Comms","exp":"OSHA guidelines: at 110–120 dB, safe daily exposure is just 20 minutes. Prolonged exposure causes permanent hearing damage."},{"q":"The measure of electric field strength per unit length is known as electric field intensity or simply electric intensity. What is its unit?","a":"All of the above","topic":"Electronics","cat":"Electronics","exp":""},{"q":"The average voltage value of the 3.58 MHz modulated chrominance signal in a TV receiver is?","a":"The brightness of the color","topic":"TV","cat":"Comms","exp":"The amplitude (average voltage) of the chrominance (chroma) signal represents color saturation — how vivid or washed-out the color appears."},{"q":"Which FET that has a substrate?","a":"all of the above","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the bandwidth efficiency of 16-QAM?","a":"4 bits per symbol (4 bps/Hz)","topic":"Networks","cat":"Board Exam","exp":"16-QAM encodes 4 bits per symbol (log₂16 = 4), giving 4 bps/Hz bandwidth efficiency. Higher-order QAM (64-QAM, 256-QAM) provides even higher spectral efficiency."},{"q":"What is the maximum bit rate for fiber optic cable?","a":"10 Gbps","topic":"Fiber","cat":"Comms","exp":"Standard 10GbE (10 Gigabit Ethernet) runs on fiber. With advanced modulation and DWDM, single fibers can carry Tbps, but basic fiber spec is often cited at 10 Gbps."},{"q":"What do you call the force that sets up or tends to set up magnetic flux in a magnetic circuit?","a":"magnetomotive force","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is a body that emits a constant emissivity regardless of the wavelength?","a":"Gray body","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the period of an equalizing pulse in NTSC TV?","a":"2.29 microseconds","topic":"TV","cat":"Comms","exp":"Equalizing pulses occur at twice the horizontal rate (31.5 kHz) before and after vertical sync, each lasting about 2.29 µs."},{"q":"What average resisting force must act on a 3.0-kg mass to reduce its speed from 65 cm/s to 15 cm/s in 0.20 s?","a":"7.5 N","topic":"Work, Energy, and Power","cat":"Physics","exp":"Schaum's College Physics - Work, Energy, and Power"},{"q":"Which of the following is not a basic part of an atom?","a":"Coulomb","topic":"Electronics","cat":"Electronics","exp":""},{"q":"Which position does a maritime ship main antenna have, when it is connected to the reserve transmitter and receiver?","a":"Emergency transmitter","topic":"GEAS","cat":"GEAS","exp":""},{"q":"The certificate of Authority issued by National Telecommunications Commission to a CATV operator shall have a maximum term of how many years?","a":"15 years","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What type of diode is used for high-frequency AM detection?","a":"PIN diode","topic":"RF","cat":"Electronics","exp":"PIN diodes have an intrinsic layer between P and N regions, giving low capacitance at high frequencies. They are used as RF switches, attenuators, and in high-frequency detection."},{"q":"What is delta modulation?","a":"A digital coding scheme transmitting only 1 bit per sample, indicating whether the signal is rising or falling","topic":"Networks","cat":"Electronics","exp":"Delta modulation simplifies PCM by encoding only the direction of change. It requires a higher sampling rate than PCM for comparable quality."},{"q":"What is the standard number of characters in a telegraphy word including the word space?","a":"7.5 characters","topic":"Misc","cat":"Comms","exp":"In telegraphy, a standard word is defined as 7.5 characters including the word space, used for calculating transmission speed."},{"q":"What hue is 180° out of phase with red in NTSC color?","a":"Cyan","topic":"TV","cat":"Board Exam","exp":"In color TV's hue circle, complementary colors are 180° apart. Red's complement is cyan (a blue-green mixture). This is used in color bar test patterns."},{"q":"A ball is dropped from a height y above a smooth floor. How high will rebound if the coefficient of restitution between the ball and the floor is 0.60?","a":"0.36y","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the main advantage of fiber optic cables made of plastic?","a":"Inexpensive and more flexible","topic":"Fiber","cat":"Comms","exp":"Plastic optical fiber (POF) is cheaper and more flexible than glass, making installation easier. However, it has higher attenuation, limiting it to short runs (<100 m)."},{"q":"What modulation method does D-AMPS (IS-136) use?","a":"π/4 DQPSK (pi/4 Differential Quadrature Phase Shift Keying)","topic":"Cellular","cat":"Comms","exp":"D-AMPS uses π/4 DQPSK modulation which avoids zero crossings in the signal envelope, reducing amplifier nonlinearity requirements."},{"q":"What states that thermal efficiencies of all reversible heat engines operating between the same two reservoirs are the same and that no heat engine is more efficient than a reversible one operating between the same two reservoirs?","a":"Carnot principle","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the 2nd largest category of electronics?","a":"Communications","topic":"Misc","cat":"Electronics","exp":"After computers, communications equipment (telecom infrastructure, mobile devices, networking) is the second largest electronics market segment."},{"q":"A silicon diode is in parallel with a germanium diode and is connected to a load resistor having a value of 20 kΩ and a forward supply voltage of 10 V. What is the approximate voltage across the silicon diode?","a":"0.3 V","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A parallel plate capacitor has the following values: k=81; d=0.025 inches; A=6 square inches. What is the capacitance of the capacitor?","a":"4372 picofarad","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What frequency range does LMDS operate in?","a":"27 to 31 GHz","topic":"Networks","cat":"Comms","exp":"Local Multipoint Distribution Service (LMDS) is a broadband wireless technology operating in the 27-31 GHz range for point-to-multipoint communications."},{"q":"What will happen to an atom if an electron is either taken out or taken into the same atom?","a":"Becomes an ion","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is introduced to eliminate 'singing' in telephone circuits?","a":"Via Net Loss (VNL)","topic":"Telephone","cat":"Comms","exp":"VNL is a small amount of intentional loss inserted into telephone circuits to prevent acoustic feedback (singing). About 2.5 dB is added to long-distance trunks."},{"q":"What is the width of a single-mode fiber core relative to the light wavelength?","a":"3 times the wavelength of the light carrier","topic":"Fiber","cat":"Comms","exp":"Single-mode fiber core is only ~8-10 µm diameter — about 3× the 1550 nm wavelength. This tiny core allows only one propagation mode, eliminating modal dispersion and enabling ultra-long-distance transmission."},{"q":"What is the power factor (pf) of a series RL circuit having R = 50Ω and X = 20Ω? L","a":"0.93","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the data rate of V.32 modem?","a":"9.6 kbps","topic":"Networks","cat":"Comms","exp":"V.32 was the first ITU standard for full-duplex 9600 bps operation over dial-up lines using echo cancellation, introduced in 1984."},{"q":"What is the main principle used by ITU in determining the distribution of the orbit/spectrum resources?","a":"Efficient use and equitable access","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the percent composition by mass of oxygen (O) element in sulfuric acid (H2SO4)? H = 1.008 amu, S = 32.07 amu, S = 32.07 amu and O = 16.00 amu.","a":"65.25 %","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the stress in an 8-inch round x 16-inch high concrete cylinder (E = 2.5 x 10^6 psi) when the unit deformation is 0.0012 inch/inch?","a":"3000 psi","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What does a regenerative repeater do?","a":"Fully demodulates and remodulates (regenerates) the digital signal to remove accumulated noise","topic":"Networks","cat":"Comms","exp":"Regenerative repeaters completely reconstruct the digital signal rather than just amplifying it, preventing noise accumulation over long distances."},{"q":"Which of the following transistor characteristic curves that is most useful?","a":"output characteristic curve","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What bar code type is Code 39?","a":"A discrete (non-continuous) bar code","topic":"Misc","cat":"Comms","exp":"Code 39 is a discrete bar code where each character is separated by a narrow space, allowing easy printing and wide industry adoption."},{"q":"What did Charles-Augustin de Coulomb discover?","a":"The law of electrostatic force between charges (Coulomb's Law)","topic":"Misc","cat":"Comms","exp":"Coulomb's Law states that the force between two point charges is proportional to their product and inversely proportional to the square of the distance."},{"q":"Which is the molecular formula of a sample of a compound containing 6.444 g of boron (B) and 1.803 g of hydrogen (H)? The compound has a molar mass of about 30 g. Given boron (B) has 10.81 amu and hydrogen (H) has 1.008 amu.","a":"B2H6","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What do you call the potential required to remove a valence electron?","a":"ionization potential","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the operating frequency range for telephone quality analog voice signals?","a":"300 Hz to 3 kHz","topic":"Telephone","cat":"Comms","exp":"The PSTN voice bandwidth is 300-3400 Hz — sufficient for speech intelligibility. This 3.1 kHz channel was standardized by early telephone systems and remains the basis for many standards."},{"q":"When was the first GPS satellite launched?","a":"1978","topic":"GPS","cat":"Comms","exp":"The first Block I GPS satellite was launched in 1978. Full operational capability of 24 satellites was achieved in 1993."},{"q":"What element in a klystron velocity-modulates the electron beam?","a":"Buncher","topic":"RF","cat":"Comms","exp":"The buncher cavity in a klystron imparts a velocity variation to the electron beam. Faster electrons catch up to slower ones, creating electron bunches. The catcher cavity extracts energy from these bunches as microwave output."},{"q":"What is defined as a process during which a fluid flows through a control volume steadily?","a":"Steady-flow process","topic":"GEAS","cat":"GEAS","exp":""},{"q":"Which FET operates as close as BJT in terms of switching?","a":"MOSFET enhancement type","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A post is supported by a guy wire which exerts a pull of 100 N on the top of the post. If the angle between the wire and the ground is 60 degrees, what is the horizontal component of the force supporting the pole?","a":"50.0 N","topic":"GEAS","cat":"GEAS","exp":""},{"q":"The motion of a particle is defined by the relation x = (1/3)t3 – 3t2 + 8t + 2 where x is the distance in meters and is the time in seconds. What is the time when the velocity is zero?","a":"2 seconds","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is an aperiodic antenna?","a":"An antenna not resonant at any particular frequency (wideband)","topic":"Antennas","cat":"Comms","exp":"Aperiodic antennas are designed to operate over a wide frequency range without a specific resonant frequency, often terminated to prevent reflections."},{"q":"How much more feed point impedance does a folded dipole have than a normal dipole?","a":"4 times","topic":"Antennas","cat":"Comms","exp":"A folded dipole has 4× the feed impedance of a regular half-wave dipole (73 Ω × 4 = 292 Ω). This conveniently matches 300 Ω twin-lead feedline used with TV antennas."},{"q":"What is the amount of heat needed to turn 1 kg of the substance at its melting point from the solid to liquid state?","a":"Heat of fusion","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the main advantage of glass optical fiber over copper?","a":"Less attenuation/lower losses over long distances","topic":"Fiber","cat":"Comms","exp":"Glass fiber has extremely low attenuation (0.2 dB/km at 1550 nm), allowing transmission over much longer distances than copper cables."},{"q":"What is true in visualizing electric field lines of force from a charge body?","a":"All of the above.","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is flutter echo?","a":"Rapid successive echoes between two parallel reflective surfaces","topic":"Acoustics","cat":"Comms","exp":"Flutter echo occurs when sound bounces back and forth between two parallel walls, producing a 'fluttering' or 'ringing' coloration of sound."},{"q":"What did Heinrich Hertz prove experimentally?","a":"The existence of electromagnetic waves (radio waves), confirming Maxwell's predictions","topic":"Misc","cat":"Comms","exp":"In 1887, Hertz generated and detected radio waves in his laboratory, proving Maxwell's theory. The unit of frequency (Hz) honors him."},{"q":"What is the Hartley's Law?","a":"Information rate is proportional to bandwidth: I ∝ B × T","topic":"Networks","cat":"Comms","exp":"Hartley's Law (1928) states the maximum amount of information in a channel is proportional to bandwidth multiplied by transmission time, before noise is considered."},{"q":"What is the maritime distress frequency?","a":"2182 kHz","topic":"Antennas","cat":"Comms","exp":"2182 kHz is the international maritime distress frequency on MF band. Ships maintained a radio watch on this frequency. It was officially replaced by GMDSS (using DSC on 2187.5 kHz) in 1999."},{"q":"What type of impact is when the motion of one or both of the colliding bodies is not directed along the line impact?","a":"Oblique impact","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is a Beat Frequency Oscillator (BFO) used for?","a":"Generates a 1 kHz tone to make Morse code audible in CW receivers","topic":"RF","cat":"Comms","exp":"A BFO mixes with the incoming CW carrier to produce an audible beat note, making CW (Morse code) transmissions audible."},{"q":"What is the IEEE standard for Wi-Fi (high-speed Ethernet)?","a":"IEEE 802.11b","topic":"Networks","cat":"Comms","exp":"IEEE 802.11b was the first widely-adopted Wi-Fi standard (1999), operating at 2.4 GHz with 11 Mbps maximum data rate. Later superseded by 802.11g, n, ac, and ax."},{"q":"What did Lee de Forest invent?","a":"The triode vacuum tube (Audion, 1906)","topic":"Misc","cat":"Comms","exp":"De Forest added a third element (grid) to Fleming's diode, creating the triode — the first amplifying device and enabling radio broadcasting."},{"q":"A proton m  1:67 \u0002 10 27 kg) that has a speed of 5:0 \u0002 106 m/s passes through a metal film of thickness 0.010 mm and emerges with a speed of 2:0 \u0002 106 m/s. How large an average force opposed its motion through the film?","a":"1:8 \u0002 10 9 N","topic":"Projectile Motion","cat":"Physics","exp":"Schaum's College Physics - Projectile Motion"},{"q":"The value of k in Coulomb’s electrostatic force equation ( F = kQ Q /r2 ) is oftentimes 1 2 expressed as 1/4πεο. What is ε ? ο","a":"absolute permittivity","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A loan of P30000 was to be amortized by a series of 10 equal semi-annual payments, the 1st payment being made 6 months after the loan was granted. The debtor continued paying the semi-annual installments but immediately after the sixth payments he was in the position to pay the remaining balance. What single amount must be paid if the interest is 14% compounded semi-annually?","a":"P 14,467.84","topic":"GEAS","cat":"GEAS","exp":""},{"q":"The ease with which a charge carrier (electron or hole) moves in a semiconductor material is known as mobility. It is also defined as the average drift velocity of electrons and holes per unit electrostatic field. Which of the semiconductor materials has the highest value of electron-mobility?","a":"InSb","topic":"Electronics","cat":"Electronics","exp":""},{"q":"If a beam of polarized light has one-twelfth of its initial intensity after passing through an analyzer, what is the angle between the axis of the analyzer and the initial amplitude of the beam?","a":"73.22°","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What does a noise weighting curve show?","a":"The interfering effect of noise at various frequencies compared to a reference frequency","topic":"Telephone","cat":"Comms","exp":"Noise weighting curves account for the ear's varying sensitivity at different frequencies to give a perceptual measure of noise interference."},{"q":"A cylinder of diameter 1.0 cm at 30oC is to be slide into a hole on a steel plate. The hole has a diameter of 0.99970 cm at 30oC. To what temperature the plate must be heated? Coefficient of linear expansion for steel is 1.2 x 10^-5 per oC.","a":"55oC","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the required articulation efficiency for 100% intelligibility?","a":"80%","topic":"Acoustics","cat":"Comms","exp":"When 80% of individual phonemes are correctly received, listeners achieve 100% sentence intelligibility using context clues. The 80% articulation index is the design target for telephone systems, PA systems, and conference rooms."},{"q":"What refers to any change that a system undergoes from one equilibrium state to another equilibrium state?","a":"Process","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What pump laser is used for in fiber optic amplifiers?","a":"To excite electrons to a higher energy level (for stimulated emission)","topic":"RF","cat":"Comms","exp":"Erbium-doped fiber amplifiers (EDFAs) use a 980 nm or 1480 nm pump laser to excite erbium ions to a higher energy state. When a 1550 nm signal photon passes through, stimulated emission amplifies it."},{"q":"A man weighs 128 lb on the surface of the earth (radius = 3960 miles). At what distance above the surface of the earth would he weight 80 lb?","a":"1049 miles","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What do you call the total number of electric lines of force in an electric field?","a":"Electric flux","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the oldest form of modulation?","a":"Amplitude Modulation (AM)","topic":"RF","cat":"Comms","exp":"AM was the first practical form of radio modulation, used commercially since the early 1900s before FM and other methods were developed."},{"q":"What semiconductor that is good for high-temperature applications?","a":"indium antimonide (InSb)","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A certain steel tape is known to be 100,000 ft long at a temperature of 70oF. When the tape is at a temperature of 10oF, what tape reading corresponds to a distance of 90,000 ft? Assume a coefficient of thermal expansion equal 65 x 10^-7 per oF.","a":"90,035 ft","topic":"GEAS","cat":"GEAS","exp":""},{"q":"Where does the secretary general in the organizational structure of present ITU report?","a":"Council","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the primary difference between the BJT and the FET?","a":"current-controlled device and voltage-controlled device, respectively","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the maximum moment of a beam supported at both ends and carries a uniform load of w throughout its entire length?","a":"wL2 / 8","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A red light passes an empty space. What is the momentum of a single photon of red light whose frequency is 400 x 10^12 HZ?","a":"8.8 x 10 ^-28 kg m/s","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the angle of refraction of light as a beam of parallel light enters a block of ice at angle of incidence of 30°? The index of refraction of ice is 1.31 and that of air is 1.0.","a":"22°","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A build-in, fixed support has how many reactions and moment?","a":"2 reactions and 1 moment","topic":"GEAS","cat":"GEAS","exp":""},{"q":"An alternating voltage of sine-wave form has a maximum voltage of 311V. What is its value at 225°?","a":"-220 V","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What refers to a privilege conferred upon a telecommunications entity by Congress, authorizing an entity to engage in a certain type of telecommunications service?","a":"Franchise","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the new regulation issued by NTC providing the guideline for mobile personal communication having a global coverage using satellite?","a":"GMPCS","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What FM generation method is used in broadcasting?","a":"Indirect FM (Armstrong method)","topic":"RF","cat":"Comms","exp":"Most broadcast FM uses the indirect method (Armstrong), which generates narrowband FM then multiplies the frequency to achieve wide deviation."},{"q":"In electrical circuits, current is known as the flow of charged carriers, such as electrons. When can this happen?","a":"all of the above","topic":"Electronics","cat":"Electronics","exp":""},{"q":"In TV, which controls the phase angle of demodulated color video signal?","a":"Tint","topic":"TV","cat":"Comms","exp":"The tint (hue) control adjusts the phase angle of the demodulated color signal, shifting all colors on the hue circle simultaneously."},{"q":"What is frequency hopping spread spectrum?","a":"A spread-spectrum technique where the RF carrier continuously moves between frequencies according to a pseudo-random pattern","topic":"RF","cat":"Comms","exp":"Frequency hopping rapidly changes the carrier frequency in a pre-agreed pseudo-random sequence, providing resistance to jamming and interception."},{"q":"What is the IEEE standard for WiMAX?","a":"IEEE 802.16","topic":"Networks","cat":"Comms","exp":"WiMAX (IEEE 802.16) is a wireless broadband standard with theoretical range of 50 km and practical range of 3-5 miles. The Korean variant is WiBro."},{"q":"What is the ISDN B channel?","a":"Bearer channel at 64 kbps for voice or data","topic":"Networks","cat":"Comms","exp":"ISDN BRI has two B-channels at 64 kbps each for voice or data, and one D-channel at 16 kbps for signaling. Two bonded B-channels give 128 kbps. ISDN was superseded by DSL and cable modems for internet access."},{"q":"What is the common problem with delta modulation?","a":"Slope overload","topic":"Networks","cat":"Comms","exp":"Slope overload occurs when the input signal changes faster than the step-by-step delta modulation approximation can track. Solved by adaptive delta modulation (ADM) which varies the step size dynamically."},{"q":"Which of the following refers to a characteristic of a magnetic line of force?","a":"Travels from north to south through the surrounding medium of a bar magnet","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What property defines a tunnel diode?","a":"Uses very high doping levels to create a narrow junction enabling quantum tunneling","topic":"Misc","cat":"Electronics","exp":"Tunnel diodes have impurity concentrations ~1000× greater than normal diodes, making the depletion region so thin that electrons can quantum-tunnel through it, creating negative resistance."},{"q":"A horizontal cable pulls a 200-kg cart along a horizontal track. The tension in the cable is 500 N. Starting from rest, (a) How long will it take the cart to reach a speed of 8.0 m/s? (b) How far will it have gone?","a":"(a) 3.2 s; (b) 13 m","topic":"Newton's Laws","cat":"Physics","exp":"Schaum's College Physics - Newton's Laws"},{"q":"What was the most ambitious LEO satellite system proposed?","a":"Teledesic","topic":"Satellite","cat":"Comms","exp":"Teledesic, backed by Bill Gates and Craig McCaw, proposed 840 LEO satellites for global broadband. It was eventually canceled in 2002 due to high costs."},{"q":"What is the principle reason for using geosynchronous satellites?","a":"To simplify tracking requirements","topic":"Satellite","cat":"Comms","exp":"Geostationary satellites appear fixed in the sky, so ground antennas need no tracking motors. This dramatically simplifies earth stations for TV broadcast, internet, and communications. The tradeoff is 250 ms propagation delay."},{"q":"What is a trailing wire antenna?","a":"Submarine LF/VLF communication antenna towed behind the vessel","topic":"Antennas","cat":"Comms","exp":"A trailing wire dragged behind a submarine receives LF/VLF signals (3-300 kHz) that penetrate seawater to 10-100 meters depth. This allows communication without surfacing. Military submarines use very long (several km) trailing wires."},{"q":"What is the term for an interval between unpleasant tones?","a":"Discordant interval","topic":"Acoustics","cat":"Comms","exp":"Discordant (dissonant) intervals produce unpleasant beating. The ratio 7:8 is considered the principal dissonant interval."},{"q":"Where does practically all of the RF current flow in a conductor?","a":"along the surface","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the speed of sound in wood?","a":"3300 m/s","topic":"Acoustics","cat":"Comms","exp":"Sound propagates through wood at approximately 3300 m/s, much faster than air (343 m/s) due to the higher density and elasticity."},{"q":"Which one is the correct relation between energy efficiency ratio (EER) and coefficient of performance (COP)?","a":"EER = 3.42COP","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What frequency does marine radar use?","a":"X-band (9–10 GHz)","topic":"RF","cat":"Comms","exp":"Marine radar primarily uses X-band (9.3–9.5 GHz) for its narrow beamwidth and good resolution in poor weather conditions."},{"q":"What radio transmission process sends messages by changing frequencies in a pre-determined order?","a":"Frequency hopping","topic":"RF","cat":"Comms","exp":"Frequency hopping spread spectrum (FHSS) changes carrier frequency rapidly in a pseudo-random sequence known to both transmitter and receiver. This resists jamming and eavesdropping — used in Bluetooth and military radios."},{"q":"What is Erbium-doped fiber amplifier (EDFA)?","a":"Optical amplifier for 1530-1625 nm wavelengths","topic":"Fiber","cat":"Comms","exp":"EDFAs amplify optical signals without electrical conversion. A 980 or 1480 nm pump laser excites Er3+ ions; passing 1550 nm signal photons stimulate identical photon emission - amplification. Provides 20-30 dB gain for long-haul WDM systems."},{"q":"What is the Antenna power gain for a 10-degree beamwidth?","a":"26 dB","topic":"Antennas","cat":"Board Exam","exp":"Antenna gain ≈ 10·log(30000/θ²) for a parabolic antenna, where θ is beamwidth in degrees. For θ=10°: G = 10·log(30000/100) = 10·log(300) ≈ 24.8 ≈ 26 dB."},{"q":"What is WiMAX practical range?","a":"3 to 5 miles (5 to 8 km)","topic":"Networks","cat":"Comms","exp":"IEEE 802.16 WiMAX has a theoretical range of 50 km but practical deployments achieve 3-5 miles at useful data rates due to interference and path loss. Korean WiBro is a mobile WiMAX variant. Most WiMAX spectrum has been repurposed for LTE."},{"q":"What is GPRS maximum theoretical data rate?","a":"172.2 kbps","topic":"Cellular","cat":"Comms","exp":"GPRS maximum uses all 8 time slots with CS-4 coding at 21.4 kbps each = 171.2 kbps. Practical rates are 20-40 kbps since slots are shared. EDGE using 8PSK modulation extended this to 384 kbps."},{"q":"What is the main accelerating element in the CRT?","a":"Ultor","topic":"TV","cat":"Comms","exp":"The ultor (final anode) accelerates electrons to high velocity toward the screen. For a 35\" color TV, it operates at about 30 kV."},{"q":"What are the possible applications of operational amplifiers (op-amps)?","a":"all of the above","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the SI unit of specific heat capacity?","a":"J/kg∙ °C","topic":"GEAS","cat":"GEAS","exp":""},{"q":"How is antenna beamwidth defined?","a":"Angular separation between the half-power (-3 dB) points of the radiation pattern","topic":"Antennas","cat":"Comms","exp":"The half-power beamwidth (HPBW) is the angle between the directions where the power drops to half (-3 dB) of the main beam maximum."},{"q":"What is Electroluminescence?","a":"Light produced by electron-hole recombination in an LED junction","topic":"Misc","cat":"Comms","exp":"Forward-biasing an LED causes electrons to recombine with holes at the p-n junction, releasing energy as photons. Wavelength depends on the semiconductor bandgap: GaAs gives infrared, GaP gives green or red, InGaN gives blue or white."},{"q":"What government regulation in telecommunication provides the policy to improve the provision of local exchange carrier service?","a":"O. 109","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A company sets aside P 300,000 each year as a fund for expansion. If the fund earns 9% compounded annually, determine how long will it take before a building costing P 3, 000, 000 can be built?","a":"7.44 years","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the effect that keeps a spinning satellite's antenna beam pointed in one direction?","a":"Gyroscopic/flywheel effect","topic":"Satellite","cat":"Comms","exp":"A spinning satellite acts like a gyroscope — its spin axis remains fixed in space. Despun antennas counter-rotate to maintain Earth-pointing while the body spins for stability."},{"q":"An object is subjected to the forces shown in Fig. 5-25. What single force F applied at a point on the x-axis will balance these forces? (First find its components, and then find the force.) Where on the x-axis should the force be applied?","a":"Fx  232 N, Fy  338 N; F  410 N at 55:58; at x  2:14 m 68 EQUILIBRIUM OF A RIGID BODY UNDER COPLANAR FORCES [CHAP. 5","topic":"Uniformly Accelerated Motion (2D)","cat":"Physics","exp":"Schaum's College Physics - Uniformly Accelerated Motion (2D)"},{"q":"In fiber optics, when electromagnetic waves scatter and are about equal to or larger than the wavelength?","a":"Mie scattering","topic":"Fiber","cat":"Comms","exp":"Mie scattering occurs when particles are comparable in size to the light wavelength. Rayleigh scattering occurs for much smaller particles (dominant in fiber). Mie causes more forward scattering."},{"q":"How is the collector cut-off or reverse saturation current I related to the emitter cut- CBO off current I ? EBO","a":"I  I CBO EBO","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is blank-and-burst signaling in cellular systems?","a":"Briefly interrupting voice transmission to send control information on the voice channel","topic":"Cellular","cat":"Comms","exp":"In AMPS, blank-and-burst sends control messages (like handoff commands) by briefly muting audio and transmitting FSK data on the voice channel."},{"q":"What is the electronic serial number (ESN) of a mobile phone composed of?","a":"32 bits","topic":"Cellular","cat":"Comms","exp":"ESN is a 32-bit unique identifier assigned to AMPS/CDMA mobile phones. Combined with the MIN (Mobile Identification Number), it's used for billing and authentication."},{"q":"A boat, propelled so as to travel with a speed of 0.50 m/s in still water, moves directly across a river that is 60 m wide. The river ¯ows with a speed of 0.30 m/s. (a) At what angle, relative to the straight-across direction, must the boat be pointed? (b) How long does it take the boat to cross the river?","a":"(a) 378 upstream; (b) 1:5 \u0002 102 s","topic":"Vectors","cat":"Physics","exp":"Schaum's College Physics - Vectors"},{"q":"What is the speed of sound in neon gas at temperature of 25°C considering that the molecular mass if this gas is 20.18 kg/mol? Neon is monoatomic. Use k = 1.67","a":"447.5 m/s","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the more elaborate approach to the study of thermodynamics and based on the average behavior of large groups of individual particles?","a":"Statistical thermodynamics","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A 250 W light source has a mean spherical luminous intensity of 87.5 candelas. Compute the luminous intensity of the lamp?","a":"4.4 lm/s","topic":"GEAS","cat":"GEAS","exp":""},{"q":"A germanium diode is connected to a load resistance of 1.5 kΩ and is supplied with 12- V such that the diode will be forward biased. What is the voltage across the diode?","a":"approximately 0.3 V","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What helps protect fibers against degradation caused by moisture?","a":"Cabling","topic":"Fiber","cat":"Comms","exp":"Fiber cabling adds protective layers — strength members (Kevlar), moisture barriers, and outer jackets — preventing water ingress that causes microcracks and signal degradation."},{"q":"What states that for any two bodies in thermal equilibrium, the ratios of emissive power to the absorptivity are equal?","a":"Kirchhoff’s radiation law","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is the effective component applied on the box that is being pulled by a 30 N force inclined at 30 degrees with horizontal?","a":"25.98 N","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is meant by back EMF?","a":"A voltage that opposes the applied EMF.","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A light source emits a total luminous flux of 1000 lumens and distributed uniformly over 25% of a sphere. What is the luminous intensity at 2.5-meter distance?","a":"318 cd","topic":"GEAS","cat":"GEAS","exp":""},{"q":"An observer sees a spaceship, measured 100 m long when at rest. He passed by in uniform motion with the speed of 0.5 c. While the observer is watching the spaceship, a time of 2 s elapses on a clock on board the ship, what is the length of the moving spaceship?","a":"87 m","topic":"GEAS","cat":"GEAS","exp":""},{"q":"Which of the given below can produce the most induced voltage?","a":"1 A, 400 Hz","topic":"Electronics","cat":"Electronics","exp":""},{"q":"A man can exert a maximum pull of 1,000 N but wishes to lift a new stone door for his cave weighing 20,000 N. If he uses a lever how much closer must the fulcrum be to the stone than to his hand?","a":"20 times nearer","topic":"GEAS","cat":"GEAS","exp":""},{"q":"Find the acceleration of the blocks in Fig. 3-20 if friction forces are negligible. What is the tension in the cord connecting them?","a":"3.3 m/s2 , 13 N Ans.","topic":"Newton's Laws","cat":"Physics","exp":"Schaum's College Physics - Newton's Laws"},{"q":"A horizontal force F is exerted on a 20-kg box to slide it up a 308 incline. The friction force retarding the motion is 80 N. How large must F be if the acceleration of the moving box is to be (a) zero and (b) 0.75 m/s2 ?","a":"(a) 0.21 kN; (b) 0.22 kN","topic":"Newton's Laws","cat":"Physics","exp":"Schaum's College Physics - Newton's Laws"},{"q":"What is the number of Intelsat satellites?","a":"21 satellites","topic":"Satellite","cat":"Comms","exp":"Intelsat operates approximately 21 geostationary satellites. It was historically the dominant international satellite telecommunications organization, privatized in 2001."},{"q":"What is a Twinax cable?","a":"Balanced coaxial cable with two inner conductors","topic":"Antennas","cat":"Comms","exp":"Twinaxial cable has two inner conductors within a single outer shield, supporting balanced differential signaling with shielding. Used in IBM mainframe connections, 10GbE SFP+ direct-attach copper (DAC) cables, and high-speed data links."},{"q":"The output offset voltage of an op-amp is due to the input offset current and voltage. If 1 mV is due to the input offset current and 22 mV due to the input offset voltage, what is the total output offset voltage of the op-amp?","a":"23 mV","topic":"Electronics","cat":"Electronics","exp":""},{"q":"The reason why a slight difference between the input bias current occurs in op-amps is due to the unsymmetrical circuit component parameters. This unsymmetrical condition also produces a difference in input voltage called what?","a":"input offset voltage","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is the IEEE standard for ZigBee?","a":"IEEE 802.15.4","topic":"Networks","cat":"Comms","exp":"ZigBee uses IEEE 802.15.4 for its physical and MAC layers. It operates at 2.4 GHz (global), 915 MHz (US), and 868 MHz (Europe), for low-power sensor networks."},{"q":"What is Popcorn noise (burst noise)?","a":"Random low-frequency noise that produces sudden step-like transitions, named for its sound","topic":"RF","cat":"Electronics","exp":"Burst noise appears in semiconductors as random rectangular pulses at low frequency, caused by crystal defects or contaminants at junctions."},{"q":"A lens has a convex surface of radius 17 cm and a concave surface of radius 38 cm and is made of glass of refractive index 1.55. Calculate the focal length of the lens and classify the type of lens whether diverging or converging?","a":"55.93 cm converging lens","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is defined as the energy required to raise the temperature of a unit mass of a substance by one degree?","a":"Specific heat","topic":"GEAS","cat":"GEAS","exp":""},{"q":"The distance between supports of a transmission cable is 20 m apart. The cable is loaded with a uniformly distributed load of 20 kN/m throughout its span. The maximum sag of the cable is 4 m. What is the maximum tension of the cable if one of the supports is 2 meters above the other?","a":"415.53 N","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What is 'singing' in a telephone circuit?","a":"Uncontrolled echo feedback causing continuous oscillation in the circuit","topic":"Telephone","cat":"Comms","exp":"Singing occurs when the echo signal reinforces itself around the 4-wire loop, causing the circuit to oscillate — effectively the echo goes out of control."},{"q":"The beam in Fig. 5-24 has negligible weight. If the system hangs in equilibrium when FW1  500 N, what is the value of FW2 ?","a":"0.64 kN","topic":"Uniformly Accelerated Motion (2D)","cat":"Physics","exp":"Schaum's College Physics - Uniformly Accelerated Motion (2D)"},{"q":"The driver of a 1200-kg car notices that the car slows from 20 m/s to 15 m/s as it coasts a distance of 130 m along level ground. How large a force opposes the motion?","a":"0.81 kN","topic":"Projectile Motion","cat":"Physics","exp":"Schaum's College Physics - Projectile Motion"},{"q":"What is the Discone antenna's polarization?","a":"Vertical polarization","topic":"Antennas","cat":"Comms","exp":"The discone antenna radiates vertically polarized waves from its cone element, making it compatible with VHF/UHF mobile communications."},{"q":"What is the rest energy of electron equivalent to its rest mass? 1Mev = 1.60 x 10^-13 J and mass of electron is 9.11 x 10^-31 kg.","a":"0.512 MeV","topic":"GEAS","cat":"GEAS","exp":""},{"q":"What unit refers to radiation other than X-rays that has an absorption equal to 1 roentgen?","a":"REP (Roentgen Equivalent Physical)","topic":"Safety","cat":"Comms","exp":"REP is the dose of any ionizing radiation with the same biological effect as 1 roentgen of X-rays. Now largely replaced by the Gray (Gy) and Sievert (Sv) units."},{"q":"What is the ITU emission designation for SSB with full carrier?","a":"H3E","topic":"RF","cat":"Board Exam","exp":"H3E = SSB full carrier. J3E = SSB suppressed carrier. A3E = AM double sideband full carrier. These ITU codes describe emission type/content/information."},{"q":"In materials, what do you call the region that separates the valence and conduction bands?","a":"energy gap or forbidden band","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What is DS-1 (T1)?","a":"Digital signal level 1 — consists of 24 PCM voice channels at 1.544 Mbps","topic":"Telephone","cat":"Electronics","exp":"DS-1 frames 24 channels × 8 bits each + 1 framing bit = 193 bits/frame × 8000 frames/sec = 1.544 Mbps total line rate."},{"q":"What is the gain of 4 stacked identical antennas?","a":"6 dB over a single antenna","topic":"Antennas","cat":"Comms","exp":"Doubling the number of antennas adds 3 dB; 4 antennas (2x doubling) gives 6 dB gain improvement over a single element."},{"q":"What device are used for low-power microwave oscillations with varactor diodes?","a":"PARAMP (Parametric Amplifier)","topic":"RF","cat":"Comms","exp":"Parametric amplifiers use varactor diodes whose capacitance is varied by a pump signal. They produce very low noise, making them ideal for satellite ground station receivers and radio telescopes."},{"q":"What is the accuracy of LORAN-C?","a":"¼ mile absolute, >100 ft relative","topic":"GPS","cat":"Comms","exp":"LORAN-C operates at 100 kHz with chains of transmitters. Absolute accuracy is ~460 m (¼ mile), but relative (repeatable) accuracy can be ~30 m (100 ft)."},{"q":"A certain loud speaker has a circular opening with a diameter of 15 cm. Assume that the sound it emits is uniform and outward through this entire opening. How much power is being radiated by the loudspeaker if the sound intensity at opening is 150µW/m^2?","a":"2.65 µW","topic":"GEAS","cat":"GEAS","exp":""},{"q":"How many address bits does IPv6 use?","a":"128 bits","topic":"Networks","cat":"Comms","exp":"IPv6 uses 128-bit addresses, providing approximately 3.4 × 10^38 unique addresses, compared to IPv4's 32-bit (4.3 billion) addresses."},{"q":"What is the average voltage of an alternating voltage, v = 100sin120πt?","a":"0 (zero) V","topic":"Electronics","cat":"Electronics","exp":""},{"q":"What frequency range is used for civil aircraft VHF communications?","a":"30–100 MHz (VHF), specifically 118–136 MHz for air-to-ground","topic":"RF","cat":"Comms","exp":"Civil aviation VHF communications use the 118–136.975 MHz band. The broader 30–100 MHz range covers other aircraft communications."},{"q":"What is the largest category of electronics by market siz
