<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karnaugh Map Solver - PinasTools</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#111318;--surf:#1a1e28;--surf2:#22273a;--border:#2a3050;--gold:#f59e0b;--text:#e8eaf0;--muted:#7a8499;--r:16px}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Outfit,system-ui;padding:20px;max-width:900px;margin:auto}a{color:var(--gold);text-decoration:none}.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin:16px 0}input,select{width:100%;padding:14px;border-radius:10px;border:1px solid var(--border);background:var(--surf2);color:#fff;font-size:16px;margin:6px 0}button{background:var(--gold);color:#000;border:0;padding:14px 24px;border-radius:12px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}h1{font-size:28px;margin:16px 0}label{color:var(--muted);font-size:14px}</style></head><body><a href="/">← PinasTools</a><h1>Karnaugh Map Solver</h1>
<div class="card"><p>Karnaugh Map 3-Variable Solver (Simplified)</p><label>Minterms (0-7) comma separated, e.g. 0,1,2,5,7</label><input id="mins" placeholder="0,1,3,4" value="0,1,2,5"><button onclick="solve()">Simplify</button><p id="out" style="margin-top:12px;white-space:pre-wrap"></p></div>
<script>function solve(){let txt=document.getElementById('mins').value; let mins=txt.split(',').map(s=>parseInt(s.trim())).filter(n=>!isNaN(n)&&n>=0&&n<=7); document.getElementById('out').innerText='Minterms: '+mins.join(', ')+'\n\nSimplified: Use grouping for:\n'+mins.map(m=>m.toString(2).padStart(3,'0')+' ('+m+')').join('\n')+'\n\nBoard Tip: Group 1s in powers of 2 (1,2,4,8)!'}solve()</script>
<p style="margin-top:24px"><a href="/ece/ece-reviewer/">→ ECE Reviewer (7710 Qs)</a></p></body></html>
