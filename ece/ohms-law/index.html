<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ohm's Law Calculator - PinasTools</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#111318;--surf:#1a1e28;--surf2:#22273a;--border:#2a3050;--gold:#f59e0b;--text:#e8eaf0;--muted:#7a8499;--r:16px}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Outfit,system-ui;padding:20px;max-width:900px;margin:auto}a{color:var(--gold);text-decoration:none}.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin:16px 0}input,select{width:100%;padding:14px;border-radius:10px;border:1px solid var(--border);background:var(--surf2);color:#fff;font-size:16px;margin:6px 0}button{background:var(--gold);color:#000;border:0;padding:14px 24px;border-radius:12px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}h1{font-size:28px;margin:16px 0}label{color:var(--muted);font-size:14px}</style></head><body><a href="/">← PinasTools</a><h1>Ohm's Law Calculator</h1>
<div class="card"><label>Voltage V (volts)</label><input id="v" type="number" placeholder="12" oninput="calc()"><label>Current I (amps)</label><input id="i" type="number" placeholder="2" oninput="calc()"><label>Resistance R (ohms)</label><input id="r" type="number" placeholder="6" oninput="calc()"><p id="out" style="font-size:20px;font-weight:700;margin-top:12px"></p></div>
<script>function calc(){let V=parseFloat(document.getElementById('v').value), I=parseFloat(document.getElementById('i').value), R=parseFloat(document.getElementById('r').value); let o=''; if(!isNaN(V)&&!isNaN(I)&&isNaN(R))o='R = V/I = '+(V/I).toFixed(3)+' Ω'; else if(!isNaN(V)&&!isNaN(R)&&isNaN(I))o='I = V/R = '+(V/R).toFixed(3)+' A'; else if(!isNaN(I)&&!isNaN(R)&&isNaN(V))o='V = I×R = '+(I*R).toFixed(3)+' V'; else if(!isNaN(V)&&!isNaN(I))o='R = '+(V/I).toFixed(3)+' Ω | Power P = '+(V*I).toFixed(3)+' W'; document.getElementById('out').innerText=o}</script>
<p style="margin-top:24px"><a href="/ece/ece-reviewer/">→ ECE Reviewer (7710 Qs)</a></p></body></html>
