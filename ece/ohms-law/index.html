<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ohm's Law</title><style>body{background:#111318;color:#e8eaf0;font-family:system-ui;padding:24px;max-width:800px;margin:auto}.card{background:#1a1e28;border:1px solid #2a3050;border-radius:16px;padding:20px}input{width:100%;padding:12px;border-radius:8px;background:#22273a;color:#fff;border:1px solid #333;margin:6px 0}</style></head><body><a href="/" style="color:#f59e0b">← PinasTools</a><h1>Ohm's Law Calculator</h1><div class="card"><input id="v" placeholder="Voltage V" oninput="calc()"><input id="i" placeholder="Current I (A)" oninput="calc()"><input id="r" placeholder="Resistance R (Ω)" oninput="calc()"><p id="out"></p></div><script>function calc(){let V=parseFloat(document.getElementById('v').value), I=parseFloat(document.getElementById('i').value), R=parseFloat(document.getElementById('r').value); let o=''; if(!isNaN(V)&&!isNaN(I))o='R = '+(V/I).toFixed(3)+' Ω'; else if(!isNaN(V)&&!isNaN(R))o='I = '+(V/R).toFixed(3)+' A'; else if(!isNaN(I)&&!isNaN(R))o='V = '+(I*R).toFixed(3)+' V'; document.getElementById('out').innerText=o}</script></body></html>
