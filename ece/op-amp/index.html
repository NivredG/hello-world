<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Op-Amp Calculator - PinasTools</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#111318;--surf:#1a1e28;--surf2:#22273a;--border:#2a3050;--gold:#f59e0b;--text:#e8eaf0;--muted:#7a8499;--r:16px}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Outfit,system-ui;padding:20px;max-width:900px;margin:auto}a{color:var(--gold);text-decoration:none}.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin:16px 0}input,select{width:100%;padding:14px;border-radius:10px;border:1px solid var(--border);background:var(--surf2);color:#fff;font-size:16px;margin:6px 0}button{background:var(--gold);color:#000;border:0;padding:14px 24px;border-radius:12px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}h1{font-size:28px;margin:16px 0}label{color:var(--muted);font-size:14px}</style></head><body><a href="/">← PinasTools</a><h1>Op-Amp Calculator</h1>
<div class="card"><label>Configuration</label><select id="type" onchange="calc()"><option value="inv">Inverting Amp</option><option value="non">Non-Inverting Amp</option></select><label>Rf (kΩ)</label><input id="rf" type="number" value="100" oninput="calc()"><label>R1 (kΩ)</label><input id="r1" type="number" value="10" oninput="calc()"><p id="out" style="font-size:20px;font-weight:700;margin-top:12px"></p><p id="formula" style="color:#7a8499"></p></div>
<script>function calc(){let Rf=parseFloat(document.getElementById('rf').value)||100,R1=parseFloat(document.getElementById('r1').value)||10,type=document.getElementById('type').value; let Av=type==='inv'? -Rf/R1 : 1+Rf/R1; document.getElementById('out').innerText='Gain Av = '+Av.toFixed(2)+' V/V = '+(20*Math.log10(Math.abs(Av))).toFixed(2)+' dB'; document.getElementById('formula').innerText=type==='inv'?'Formula: Av = -Rf/R1':'Formula: Av = 1+Rf/R1'}calc()</script>
<p style="margin-top:24px"><a href="/ece/ece-reviewer/">→ ECE Reviewer (7710 Qs)</a></p></body></html>
