<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number System - PinasTools</title><style>body{background:#111318;color:#e8eaf0;font-family:system-ui;padding:24px;max-width:800px;margin:auto}.card{background:#1a1e28;border:1px solid #2a3050;border-radius:16px;padding:20px}input{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#22273a;color:#fff;margin:6px 0}</style></head><body><a href="/" style="color:#f59e0b">← PinasTools</a><h1>Number System Converter</h1><div class="card"><input id="dec" placeholder="Decimal" oninput="c('dec')"><input id="bin" placeholder="Binary" oninput="c('bin')"><input id="hex" placeholder="Hex" oninput="c('hex')"><input id="oct" placeholder="Octal" oninput="c('oct')"></div><script>function c(s){let v=document.getElementById(s).value; let dec; try{if(s=='dec')dec=parseInt(v,10); if(s=='bin')dec=parseInt(v,2); if(s=='hex')dec=parseInt(v,16); if(s=='oct')dec=parseInt(v,8); if(isNaN(dec))return; if(s!='dec')document.getElementById('dec').value=dec; if(s!='bin')document.getElementById('bin').value=dec.toString(2); if(s!='hex')document.getElementById('hex').value=dec.toString(16).toUpperCase(); if(s!='oct')document.getElementById('oct').value=dec.toString(8);}catch(e){}}</script></body></html>
