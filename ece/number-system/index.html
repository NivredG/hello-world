<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number System Converter - PinasTools</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#111318;--surf:#1a1e28;--surf2:#22273a;--border:#2a3050;--gold:#f59e0b;--text:#e8eaf0;--muted:#7a8499;--r:16px}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Outfit,system-ui;padding:20px;max-width:900px;margin:auto}a{color:var(--gold);text-decoration:none}.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin:16px 0}input,select{width:100%;padding:14px;border-radius:10px;border:1px solid var(--border);background:var(--surf2);color:#fff;font-size:16px;margin:6px 0}button{background:var(--gold);color:#000;border:0;padding:14px 24px;border-radius:12px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}h1{font-size:28px;margin:16px 0}label{color:var(--muted);font-size:14px}</style></head><body><a href="/">← PinasTools</a><h1>Number System Converter</h1>
<div class="card"><input id="dec" placeholder="Decimal (e.g. 255)" oninput="c('dec')"><input id="bin" placeholder="Binary (e.g. 11111111)" oninput="c('bin')"><input id="hex" placeholder="Hex (e.g. FF)" oninput="c('hex')"><input id="oct" placeholder="Octal (e.g. 377)" oninput="c('oct')"><p id="tips" style="color:#7a8499;margin-top:12px">Board Tip: 255 = 0xFF = 11111111 = 377₈</p></div>
<script>function c(s){let v=document.getElementById(s).value.trim(); let dec; try{if(!v)return; if(s=='dec')dec=parseInt(v,10); if(s=='bin')dec=parseInt(v.replace(/[^01]/g,''),2); if(s=='hex')dec=parseInt(v,16); if(s=='oct')dec=parseInt(v,8); if(isNaN(dec))return; if(s!='dec')document.getElementById('dec').value=dec; if(s!='bin')document.getElementById('bin').value=dec.toString(2); if(s!='hex')document.getElementById('hex').value=dec.toString(16).toUpperCase(); if(s!='oct')document.getElementById('oct').value=dec.toString(8);}catch(e){}}</script>
<p style="margin-top:24px"><a href="/ece/ece-reviewer/">→ ECE Reviewer (7710 Qs)</a></p></body></html>
