<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dB Converter - PinasTools</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#111318;--surf:#1a1e28;--surf2:#22273a;--border:#2a3050;--gold:#f59e0b;--text:#e8eaf0;--muted:#7a8499;--r:16px}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:Outfit,system-ui;padding:20px;max-width:900px;margin:auto}a{color:var(--gold);text-decoration:none}.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin:16px 0}input,select{width:100%;padding:14px;border-radius:10px;border:1px solid var(--border);background:var(--surf2);color:#fff;font-size:16px;margin:6px 0}button{background:var(--gold);color:#000;border:0;padding:14px 24px;border-radius:12px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}h1{font-size:28px;margin:16px 0}label{color:var(--muted);font-size:14px}</style></head><body><a href="/">← PinasTools</a><h1>dB Converter</h1>
<div class="card"><label>dBm</label><input id="dbm" type="number" value="0" oninput="calc()"><label>mW</label><input id="mw" type="number" value="1" oninput="calcM()"><p id="out" style="margin-top:12px;line-height:1.6"></p></div>
<script>function calc(){let dbm=parseFloat(document.getElementById('dbm').value)||0; let mw=Math.pow(10,dbm/10); document.getElementById('mw').value=mw.toFixed(4); let w=mw/1000; document.getElementById('out').innerHTML=`<b>${mw.toFixed(4)} mW</b> = ${w.toFixed(6)} W<br>${(10*Math.log10(w)+30).toFixed(2)} dBm<br>Board Tip: 0 dBm = 1 mW reference for ECE!`}function calcM(){let mw=parseFloat(document.getElementById('mw').value)||1; let dbm=10*Math.log10(mw); document.getElementById('dbm').value=dbm.toFixed(2); calc()}calc()</script>
<p style="margin-top:24px"><a href="/ece/ece-reviewer/">→ ECE Reviewer (7710 Qs)</a></p></body></html>
