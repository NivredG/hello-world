<!doctype html><html lang="fil"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three-Phase Power - PinasTools</title>
<style>:root{--bg:#111318;--surf:#1a1e28;--surf2:#22273a;--border:#2a3050;--gold:#f59e0b;--text:#e8eaf0;--muted:#7a8499;--r:16px}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:system-ui,Outfit,sans-serif;padding:20px;max-width:900px;margin:auto}a{color:var(--gold);text-decoration:none}.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin:16px 0}input,select{width:100%;padding:14px;border-radius:10px;border:1px solid var(--border);background:var(--surf2);color:#fff;font-size:16px;margin:6px 0}button{background:var(--gold);color:#000;border:0;padding:14px 24px;border-radius:12px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}h1{font-size:28px;margin:16px 0}label{color:var(--muted);font-size:14px}</style></head><body><a href="/">← PinasTools Home</a><h1>Three-Phase Power</h1><div class="card"><label>VL (V)</label><input id="vl" value="230"><label>IL (A)</label><input id="il" value="10"><label>PF</label><input id="pf" value="0.8"><button onclick="calc()">Calculate</button><p id="out"></p></div><script>function calc(){let VL=parseFloat(vl.value),IL=parseFloat(il.value),PF=parseFloat(pf.value);let P=Math.sqrt(3)*VL*IL*PF;out.innerText="P = "+P.toFixed(0)+" W = "+(P/1000).toFixed(2)+" kW"}calc()</script><p style="margin-top:24px"><a href="/ece/ece-reviewer/">→ ECE Reviewer (7710 Qs)</a> · <a href="/">Home</a></p></body></html>
